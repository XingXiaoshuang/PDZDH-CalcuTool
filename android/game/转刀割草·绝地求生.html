  pGlow.addColorStop(1, auraCol + '00');
  ctx.beginPath();
  ctx.arc(px, py, pulseR * 2.2, 0, Math.PI * 2);
  ctx.fillStyle = pGlow;
  ctx.fill();
  // 旋转能量环（三段弧）
  ctx.strokeStyle = auraCol + '66';
  ctx.lineWidth = 2;
  var ringR = pr * 1.55;
  for(var arcI = 0; arcI < 3; arcI++){
    var a0 = time * 0.004 + arcI * Math.PI * 2 / 3;
    ctx.beginPath();
    ctx.arc(px, py, ringR, a0, a0 + Math.PI * 0.4);
    ctx.stroke();
  }
  // 内层快速呼吸光
  var pulse2 = pr * (1.25 + Math.sin(time * 0.012) * 0.08);
  var pGlow2 = ctx.createRadialGradient(px, py, pr * 0.5, px, py, pulse2);
  pGlow2.addColorStop(0, auraCol + '2e');
  pGlow2.addColorStop(1, auraCol + '00');
  ctx.beginPath();
  ctx.arc(px, py, pulse2, 0, Math.PI * 2);
  ctx.fillStyle = pGlow2;
  ctx.fill();
  ctx.restore();

  var alpha = player.invuln > 0 ? (Math.floor(time * 0.025) % 2 === 0 ? 0.35 : 1) : 1;
  ctx.globalAlpha = alpha;

  var pSpeed = Math.hypot(player.vx, player.vy);
  var walkT = pSpeed > 6 ? time * 0.012 : 0;
  drawHero(ctx, px, py, pr, selectedHero, time, 1, walkT);

  ctx.globalAlpha = 1;

  // ---- 旋刃技能专属高速转刀特效 ----
  drawSkillSpinFx(ctx, px, py, pr, ox, oy);

  // ---- 刀刃系统 ----
  var nBlades = blades.length;
  var perArc = player.bladeOrbit * 2 * Math.PI / Math.max(1, nBlades);
  var bw = clamp(player.bladeThickness * 0.9, 2.2, perArc * 0.46);
  var len = player.bladeLength;
  var innerR = Math.max(4, player.bladeOrbit - len);
  var outerR = player.bladeOrbit;
  var pcx = player.x + ox, pcy = player.y + oy;

  // 连续弧形拖尾（基于角速度，转快时自然延展成环，转慢时几乎不可见）
  var speed = Math.abs(bladeAngStep);
  var trailArc = clamp(speed * 14, 0, Math.PI * 0.85);
  var trailDir = bladeAngStep >= 0 ? -1 : 1;   // 拖尾在刀身后方
  if(trailArc > 0.01){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for(var i = 0; i < nBlades; i++){
      var b = blades[i];
      var aEnd = b.angle;
      var aStart = aEnd + trailDir * trailArc;
      // 多段渐隐弧
      for(var seg = 0; seg < 4; seg++){
        var f0 = seg / 4, f1 = (seg + 1) / 4;
        var a0 = aStart + (aEnd - aStart) * f0;
        var a1 = aStart + (aEnd - aStart) * f1;
        var alpha = 0.13 * (1 - f0);
        // 内层亮能量核心
        ctx.beginPath();
        ctx.arc(pcx, pcy, outerR, a0, a1);
        ctx.strokeStyle = 'rgba(255,240,190,' + (alpha * 0.7) + ')';
        ctx.lineWidth = bw * (1 - f0 * 0.35) * 0.5;
        ctx.lineCap = 'round';
        ctx.stroke();
        // 外层柔光
        ctx.beginPath();
        ctx.arc(pcx, pcy, outerR, a0, a1);
        ctx.strokeStyle = 'rgba(200,222,240,' + alpha + ')';
        ctx.lineWidth = bw * (1 - f0 * 0.35);
        ctx.lineCap = 'round';
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // 金属枢纽环（环形描边，中心保持可见，不随刀数变化）
  ctx.beginPath();
  ctx.arc(pcx, pcy, innerR, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(150,180,210,0.28)';
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(pcx, pcy, innerR * 0.78, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(110,135,165,0.16)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // 刀刃（直线刀背 + 曲线刃腹 + 尖端的弯刀形）
  for(var i = 0; i < nBlades; i++){
    var b = blades[i];
    var bx1 = b.ox + ox, by1 = b.oy + oy;
    var bx2 = b.x + ox, by2 = b.y + oy;
    var ang = b.angle;
    var dx = Math.cos(ang), dy = Math.sin(ang);
    var px = -dy, py = dx;
    var hw = bw * 0.5;

    // 局部坐标转世界坐标辅助
    function lp(lx, ly){
      return [bx1 + lx * dx + ly * px, by1 + lx * dy + ly * py];
    }

    // 外发光晕
    ctx.beginPath();
    ctx.moveTo(bx1, by1);
    ctx.lineTo(bx2, by2);
    ctx.strokeStyle = 'rgba(200,225,255,0.10)';
    ctx.lineWidth = bw * 3.2;
    ctx.lineCap = 'round';
    ctx.stroke();

    // 刀身路径：直线刀背(上) -> 尖端 -> 曲线刃腹(下，鼓腹) -> 回根部
    // spine 点
    var pS0 = lp(0, -hw);
    var pS1 = lp(len * 0.76, -hw * 0.92);
    // 尖端控制 + 顶点
    var pTipCtrl = lp(len * 0.9, -hw * 0.7);
    var pTip = lp(len, 0);
    // 刃腹控制（鼓出）+ 根部
    var pEdgeCtrl = lp(len * 0.5, hw * 1.18);
    var pE0 = lp(0, hw);

    ctx.beginPath();
    ctx.moveTo(pS0[0], pS0[1]);
    ctx.lineTo(pS1[0], pS1[1]);
    ctx.quadraticCurveTo(pTipCtrl[0], pTipCtrl[1], pTip[0], pTip[1]);
    ctx.quadraticCurveTo(pEdgeCtrl[0], pEdgeCtrl[1], pE0[0], pE0[1]);
    ctx.closePath();

    // 按英雄武器类型改变刀身色调
    var wpn = selectedHero.weapon;
    var bladeC1, bladeC2, bladeHi, bladeEdge;
    if(wpn === 'flame'){
      // 鸠摩智火焰刀：橙红火刃
      bladeC1 = '#7a1a00'; bladeC2 = '#ff6b1a'; bladeHi = '#fff2c0'; bladeEdge = '#ffd24a';
    } else if(wpn === 'sword'){
      // 段誉六脉神剑：青白灵剑
      bladeC1 = '#1a3a5c'; bladeC2 = '#5dade2'; bladeHi = '#e8faff'; bladeEdge = '#aee9ff';
    } else {
      // 乔峰刀：金红钢刀
      bladeC1 = '#5c2a14'; bladeC2 = '#c87941'; bladeHi = '#fff6e0'; bladeEdge = '#ffd27a';
    }
    var g0 = lp(0, -bw), g1 = lp(0, bw);
    var steelGrad = ctx.createLinearGradient(g0[0], g0[1], g1[0], g1[1]);
    steelGrad.addColorStop(0, bladeC1);
    steelGrad.addColorStop(0.2, bladeC2);
    steelGrad.addColorStop(0.42, bladeHi);
    steelGrad.addColorStop(0.55, bladeC2);
    steelGrad.addColorStop(0.78, bladeC2);
    steelGrad.addColorStop(1, bladeC1);
    ctx.fillStyle = steelGrad;
    ctx.fill();

    // 刃腹高亮线（切割边，靠刃口一侧）
    var eA = lp(len * 0.78, hw * 0.46);
    var eB = lp(len * 0.15, hw * 0.55);
    ctx.beginPath();
    ctx.moveTo(eA[0], eA[1]);
    ctx.quadraticCurveTo(pEdgeCtrl[0], pEdgeCtrl[1], eB[0], eB[1]);
    ctx.strokeStyle = bladeEdge;
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = Math.max(0.6, bw * 0.14);
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.globalAlpha = 1;

    // 刀背暗线
    ctx.beginPath();
    ctx.moveTo(pS0[0], pS0[1]);
    ctx.lineTo(pS1[0], pS1[1]);
    ctx.strokeStyle = 'rgba(20,14,10,0.6)';
    ctx.lineWidth = Math.max(0.5, bw * 0.1);
    ctx.stroke();

    // 尖端高光
    ctx.beginPath();
    ctx.arc(pTip[0], pTip[1], Math.max(0.8, bw * 0.2), 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fill();
  }

  // 斩击特效（弧形斩光）
  for(var i = 0; i < slashes.length; i++){
    var s = slashes[i];
    var sx = s.x + ox, sy = s.y + oy;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(s.angle + Math.PI / 2);
    var sl = s.len || 25;
    var lf = s.life;
    var arcR = sl * 0.55;
    var arcW = s.isCrit ? 0.9 : 0.55;

    ctx.globalAlpha = lf * 0.9;
    // 外层光晕弧
    ctx.beginPath();
    ctx.arc(0, 0, arcR, -arcW, arcW);
    ctx.strokeStyle = s.color;
    ctx.lineWidth = (s.isCrit ? 12 : 7) * lf;
    ctx.lineCap = 'round';
    ctx.stroke();

    // 内层亮弧
    ctx.globalAlpha = lf;
    ctx.beginPath();
    ctx.arc(0, 0, arcR, -arcW*0.7, arcW*0.7);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = (s.isCrit ? 5 : 2.5) * lf;
    ctx.stroke();

    // 暴击额外放射线
    if(s.isCrit){
      ctx.globalAlpha = lf * 0.8;
      for(var rj = -2; rj <= 2; rj++){
        var ra = rj * 0.22;
        ctx.beginPath();
        ctx.moveTo(Math.cos(ra) * arcR * 0.7, Math.sin(ra) * arcR * 0.7);
        ctx.lineTo(Math.cos(ra) * arcR * 1.25, Math.sin(ra) * arcR * 1.25);
        ctx.strokeStyle = 'rgba(255,230,120,1)';
        ctx.lineWidth = 2 * lf;
        ctx.stroke();
      }
    }

    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // 命中火花
  for(var i = 0; i < hitSparks.length; i++){
    var sp = hitSparks[i];
    var spx = sp.x + ox, spy = sp.y + oy;
    ctx.globalAlpha = sp.life;
    ctx.beginPath();
    ctx.arc(spx, spy, sp.size * 2.2, 0, Math.PI * 2);
    ctx.fillStyle = sp.color;
    ctx.globalAlpha = sp.life * 0.2;
    ctx.fill();
    ctx.globalAlpha = sp.life;
    ctx.beginPath();
    ctx.arc(spx, spy, sp.size, 0, Math.PI * 2);
    ctx.fillStyle = sp.color;
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 粒子
  for(var i = 0; i < particles.length; i++){
    var p = particles[i];
    ctx.globalAlpha = p.life * 0.95;
    var pxp = p.x + ox, pyp = p.y + oy;
    ctx.beginPath();
    ctx.arc(pxp, pyp, p.size * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life * 0.12;
    ctx.fill();
    ctx.globalAlpha = p.life;
    ctx.beginPath();
    ctx.arc(pxp, pyp, p.size, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 伤害数字
  for(var i = 0; i < damageTexts.length; i++){
    var d = damageTexts[i];
    var dxp = d.x + ox, dyp = d.y + oy;
    var sc = d.scale;
    var rot = d.rot || 0;

    ctx.save();
    ctx.globalAlpha = Math.min(1, d.life * 1.6);
    ctx.translate(dxp, dyp);
    ctx.rotate(rot);
    ctx.scale(sc, sc);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if(d.color){
      ctx.font = '900 16px "PingFang SC",sans-serif';
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = 'rgba(8,4,18,0.9)';
      ctx.strokeText(d.text, 0, 0);
      ctx.fillStyle = d.color;
      ctx.fillText(d.text, 0, 0);
    } else if(d.isCrit){
      ctx.font = '900 22px sans-serif';
      ctx.shadowColor = '#ff9a1f';
      ctx.shadowBlur = 18;
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#5a2a00';
      ctx.strokeText(d.text, 0, 0);
      var cg = ctx.createLinearGradient(0, -12, 0, 12);
      cg.addColorStop(0, '#fff6c2');
      cg.addColorStop(0.5, '#ffd633');
      cg.addColorStop(1, '#ff8a1f');
      ctx.fillStyle = cg;
      ctx.fillText(d.text, 0, 0);
      // 暴击小标记
      ctx.font = '900 10px sans-serif';
      ctx.shadowBlur = 6;
      ctx.fillStyle = '#ffe680';
      ctx.fillText('暴击', 0, -18);
    } else {
      ctx.font = '800 15px sans-serif';
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = 'rgba(0,0,0,0.85)';
      ctx.strokeText(d.text, 0, 0);
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 3;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(d.text, 0, 0);
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // ===== 夜色与灯火（先压暗，再点亮火光/玩家气场）=====
  ctx.save();
  ctx.fillStyle = 'rgba(6,14,28,0.20)';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(var li = 0; li < visibleScenery.length; li++){
    var vs = visibleScenery[li];
    if(vs.sc.type !== 'fire' && vs.sc.type !== 'lantern') continue;
    var lr = (vs.sc.type === 'fire' ? 170 : 118) * vs.sc.size;
    var lg2 = ctx.createRadialGradient(vs.x, vs.y, 2, vs.x, vs.y, lr);
    lg2.addColorStop(0, 'rgba(255,196,110,0.42)');
    lg2.addColorStop(0.45, 'rgba(255,150,70,0.16)');
    lg2.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = lg2;
    ctx.beginPath(); ctx.arc(vs.x, vs.y - (vs.sc.type === 'fire' ? 8 : 14), lr, 0, Math.PI * 2); ctx.fill();
  }
  // 玩家脚下的气场光圈
  var plgt = ctx.createRadialGradient(pcx0, pcy0, 4, pcx0, pcy0, 168);
  plgt.addColorStop(0, beamCol + '3a');
  plgt.addColorStop(0.5, beamCol + '12');
  plgt.addColorStop(1, beamCol + '00');
  ctx.fillStyle = plgt;
  ctx.beginPath(); ctx.arc(pcx0, pcy0, 168, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // 风暴墙（画在最上层，强调"圈"）
  drawStormWall(ox, oy);

  // 雷属性传导电弧
  if(lightning.length){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for(var lgi = 0; lgi < lightning.length; lgi++){
      var lg = lightning[lgi];
      var x1 = lg.x1 + ox, y1 = lg.y1 + oy, x2 = lg.x2 + ox, y2 = lg.y2 + oy;
      var segN2 = 6;
      ctx.globalAlpha = Math.max(0, lg.life) * 0.9;
      ctx.strokeStyle = '#bff2ff';
      ctx.lineWidth = 2.4 * lg.life + 0.6;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      for(var si2 = 1; si2 < segN2; si2++){
        var k3 = si2 / segN2;
        ctx.lineTo(x1 + (x2 - x1) * k3 + rand(-9, 9), y1 + (y2 - y1) * k3 + rand(-9, 9));
      }
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.globalAlpha = Math.max(0, lg.life) * 0.3;
      ctx.lineWidth = 7 * lg.life;
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // 玩家焦点高光（聚光感，英雄气质色）
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  var pFocus = ctx.createRadialGradient(pcx0, pcy0, 0, pcx0, pcy0, Math.max(W,H)*0.4);
  pFocus.addColorStop(0, beamCol + '1a');
  pFocus.addColorStop(0.4, beamCol + '08');
  pFocus.addColorStop(1, beamCol + '00');
  ctx.fillStyle = pFocus;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // 边缘暗角（更深的电影感）
  var vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.32, W/2, H/2, Math.max(W,H)*0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(0.7, 'rgba(8,30,22,0.18)');
  vg.addColorStop(1, 'rgba(6,22,16,0.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  if(vignettePulse > 0.01){
    var rv = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.35, W/2, H/2, Math.max(W,H)*0.7);
    rv.addColorStop(0, 'rgba(255,0,40,0)');
    rv.addColorStop(1, 'rgba(255,0,40,' + vignettePulse * 0.5 + ')');
    ctx.fillStyle = rv;
    ctx.fillRect(0, 0, W, H);
  }

  // 圈外紫雾（覆盖地面，但不盖住 HUD）
  drawStormOverlay(ox, oy);
  // 自己在圈外：紫边警示
  if(player.stormed){
    var sv = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.22, W/2, H/2, Math.max(W,H)*0.72);
    sv.addColorStop(0, 'rgba(150,80,255,0)');
    sv.addColorStop(1, 'rgba(140,70,255,' + (0.30 + Math.sin(time * 0.006) * 0.08).toFixed(3) + ')');
    ctx.fillStyle = sv;
    ctx.fillRect(0, 0, W, H);
  }
  // 小地图
  drawMinimap();
}

    if(dEdge < 0){ zEl.textContent = '⚠ 圈外掉血 · 第' + zonePhase + '圈 ' + secs + 's'; zEl.classList.add('warn'); }

  }

  var order = ['armor','enchant','aux','tech'];
  for(var i = 0; i < order.length; i++){

            '<span class="gt">' + (g.tier ? g.tier : '') + '</span></div>';

  }
  if(player.buffThunderT > 0){
    html += '<div class="gslot buff" title="蓝BUFF：刀附雷属性" style="border-color:#7fe9ff">⚡<span class="gt">' + Math.ceil(player.buffThunderT / 1000) + 's</span></div>';

/* 决战结算：终极 Boss 死亡 且 场上再没有精英 → 吃鸡 */
function checkVictory(){
  if(victoryDone) return;
  if(eliteTotal <= 0) return;          // 没开精英就不判胜负
  var n = 0;
  for(var i = 0; i < enemies.length; i++){
    var e = enemies[i];
    if(!e.dead && e.tier >= 1 && !e.guardian) n++;
  }
  aliveElites = n;
  if(n === 0) victory();
}
function victory(){
  if(victoryDone) return;
  victoryDone = true;
  state = 'gameover';
  var box = document.getElementById('gameOverScreen');
  box.classList.add('win');
  document.getElementById('overTitle').textContent = '大 吉 大 利';
  document.getElementById('overPlace').textContent = '第 1 名 · 唯一存活';
  document.getElementById('overWave').textContent = wave;
  document.getElementById('overKills').textContent = killCount;
  document.getElementById('overLevel').textContent = player.level;
  box.classList.add('show');
  screenFlash = 0.6;
  sfxLevel();
  feedMsg('🏆 你成为了最后活着的那个人', '#ffd27a');
}

function fmtVal(it, v){
  if(it.pct){
    var p = v * 100;
    return (Math.abs(p - Math.round(p)) < 1e-9 ? Math.round(p) : p.toFixed(1)) + '%';
  }
  if(it.dec != null) return v.toFixed(it.dec);
  if(it.step >= 1) return String(Math.round(v));
  return String(parseFloat(v.toFixed(2)));
}

function buildSettingsUI(){
  var body = document.getElementById('settingsBody');
  body.innerHTML = '';

  var hint = document.createElement('div');
  hint.className = 'setHint';
  hint.textContent = '提示：改动会立即生效（当前对局也实时应用）。「初始刀刃数量」等开局参数会在下一局开始时重置为本数值。';
  body.appendChild(hint);

  SETTING_DEFS.forEach(function(g){
    var gh = document.createElement('div');
    gh.className = 'setGroup';
    gh.textContent = g.group;
    body.appendChild(gh);

    g.items.forEach(function(it){
      var row = document.createElement('div');
      row.className = 'setRow';

      var top = document.createElement('div');
      top.className = 'setTop';

      var nm = document.createElement('span');
      nm.className = 'setName';
      nm.textContent = it.n;

      var vl = document.createElement('span');
      vl.className = 'setVal';
      vl.textContent = fmtVal(it, settings[it.k]);

      top.appendChild(nm);
      top.appendChild(vl);

      var inp = document.createElement('input');
      inp.type = 'range';
      inp.min = it.min;
      inp.max = it.max;
      inp.step = it.step;
      inp.value = settings[it.k];
      inp.setAttribute('aria-label', it.n);

      inp.addEventListener('input', function(){
        var v = parseFloat(inp.value);
        if(isNaN(v)) return;
        settings[it.k] = v;
        vl.textContent = fmtVal(it, v);
        applySettingChange();
      });

      row.appendChild(top);
      row.appendChild(inp);
      body.appendChild(row);
    });
  });
}

/* ============================================================
   摇杆
   ============================================================ */
function setupJoystick(){
  var joyEl = document.getElementById('joystick');
  var stickEl = document.getElementById('joystickStick');
  var maxD = 48;

  function getCenter(){
    var r = joyEl.getBoundingClientRect();
    return { x: r.left + r.width/2, y: r.top + r.height/2 };
  }

  function updateJoy(clientX, clientY){
    var c = getCenter();
    var dx = clientX - c.x, dy = clientY - c.y;
    var d = Math.sqrt(dx*dx + dy*dy);
    var clamped = Math.min(d, maxD);
    if(d > 0.001){
      var nx = dx/d, ny = dy/d;
      joy.dx = nx * (clamped / maxD);
      joy.dy = ny * (clamped / maxD);
      stickEl.style.transform = 'translate(-50%,-50%) translate(' + (nx*clamped) + 'px,' + (ny*clamped) + 'px)';
    }
  }

  function resetJoy(){
    joy.active = false; joy.id = null; joy.dx = 0; joy.dy = 0;
    stickEl.style.transform = 'translate(-50%,-50%)';
    joyEl.classList.remove('active');
  }

  function placeJoy(x,y){
    var half=joyEl.offsetWidth/2;
    joyEl.style.left=clamp(x,half+8,W-half-8)-half+'px';
    joyEl.style.top=clamp(y,half+8,H-half-8)-half+'px';
    joyEl.style.bottom='auto';
  }

  document.addEventListener('touchstart', function(e){
    if(state !== 'playing') return;
    if(e.target.closest('button, #upgradePanel, #pauseScreen, #settingsPanel, #startScreen, #gameOverScreen')) return;
    for(var i = 0; i < e.changedTouches.length; i++){
      var t = e.changedTouches[i];
      if(!joy.active){
        joy.active = true;
        joy.id = t.identifier;
        placeJoy(t.clientX,t.clientY);
        joyEl.classList.add('active');
        updateJoy(t.clientX, t.clientY);
        e.preventDefault();
        break;
      }
    }
  }, {passive:false});

  document.addEventListener('touchmove', function(e){
    if(!joy.active) return;
    for(var i = 0; i < e.changedTouches.length; i++){
      var t = e.changedTouches[i];
      if(t.identifier === joy.id){
        updateJoy(t.clientX, t.clientY);
        e.preventDefault();
        break;
      }
    }
  }, {passive:false});

  function endTouch(e){
    for(var i = 0; i < e.changedTouches.length; i++){
      if(e.changedTouches[i].identifier === joy.id){
        resetJoy();
        break;
      }
    }
  }
  document.addEventListener('touchend', endTouch);
  document.addEventListener('touchcancel', endTouch);

  // 鼠标调试
  document.addEventListener('mousedown', function(e){
    if(state !== 'playing') return;
    if(e.target.closest('.upCard, button, #pauseBtn, #settingsPanel')) return;
    joy.active = true; joy.id = 'mouse';
    placeJoy(e.clientX,e.clientY);
    joyEl.classList.add('active');
    updateJoy(e.clientX, e.clientY);
  });
  document.addEventListener('mousemove', function(e){
    if(!joy.active || joy.id !== 'mouse') return;
    updateJoy(e.clientX, e.clientY);
  });
  document.addEventListener('mouseup', function(){
    if(joy.id === 'mouse') resetJoy();
  });
}

      document.getElementById('pauseBtn').click();

    return;

  if(key === ' ' && !e.repeat){
    if(state === 'playing') useSkill();
  }

/* ============================================================
   调试接口（浏览器控制台可用）
   __game()            读取当前局面
   __gameCmd('wave',10) 跳到第10波 / 'spawnElite' 刷精英
   ============================================================ */
window.__game = function(){
  var mobs = 0;
  var maxKills = 0, maxBlades = 0;
  var nSpec = 0, nGuard = 0;
  for(var i = 0; i < enemies.length; i++){
    if(enemies[i].dead) continue;
    if(enemies[i].tier === 0){
      mobs++;
      if(enemies[i].isSpecial) nSpec++;
    }
    if(enemies[i].guardian) nGuard++;
    if(enemies[i].kills > maxKills) maxKills = enemies[i].kills;
    if(enemies[i].blades > maxBlades) maxBlades = enemies[i].blades;
  }
  return {
    state:state, wave:wave, level:player.level, hp:Math.round(player.hp), maxHp:Math.round(player.maxHp),
    kills:killCount, enemies:enemies.length, mobs:mobs, elites:aliveElites,
    blades:player.bladeCount, dmg:Math.round(player.damage), damage:Math.round(player.damage),
    threat:Math.round(threat * 100) / 100, stormR:storm ? Math.round(storm.r) : -1,
    stormed:!!player.stormed, gems:xpGems.length, items:items.length, projectiles:projectiles.length,
    finalSpawned:!!finalSpawned, finalBossDead:finalBossDead, victory:victoryDone, decals:decals.length,
    maxEliteKills:maxKills, maxBlades:maxBlades, ecoKills:ecoKills, fps:Math.round(fpsAvg)
    ,specials:nSpec, guardiansN:nGuard, mobsOnly:mobs - nSpec
    ,airDrops:airDrops.length, planes:planes.length, zonePhase:zonePhase,
    cratesOutside: airDrops.filter(function(a){ return !a.opened && !inZone(a.x, a.y, 1.0); }).length,
    guardiansOutside: guardians.filter(function(g){ return g && !g.dead && !inZone(g.x, g.y, 1.0); }).length,
    cratesFar: airDrops.filter(function(a){ return !a.opened && !inZone(a.x, a.y, 0.8); }).length,
    crateHp: airDrops.length ? Math.round(airDrops[0].hp) : -1,
    duelRate: settings.eliteDuelRate,
    guardians:guardians.filter(function(g){ return g && !g.dead; }).length,
    gear:JSON.parse(JSON.stringify(player.gear)), buffFire:Math.round(player.buffFireT/1000),
    buffThunder:Math.round(player.buffThunderT/1000), shield:Math.round(player.shield||0),
    reflect:Math.round((player.reflect||0)*100), element:playerElement(),
    mobsLeft:worldMobsLeft, specialsLeft:worldSpecialsLeft, eliteTotal:eliteTotal
  };
};
window.__gameCmd = function(cmd, v){
  if(!player) return;
  if(cmd === 'wave') wave = v | 0;
  else if(cmd === 'heal') player.hp = player.maxHp;
  else if(cmd === 'levelup'){ player.xp = player.xpMax; checkLevelUp(); }
  else if(cmd === 'spawnElite') for(var i = 0; i < (v || 1); i++) spawnEnemyAt(player.x + rand(-230, 230), player.y + rand(-230, 230), 'elite');
  else if(cmd === 'spawnMob') for(var j = 0; j < (v || 1); j++) spawnEnemyAt(player.x + rand(-200, 200), player.y + rand(-200, 200), 'slime');
  else if(cmd === 'spawnThrower') for(var k = 0; k < (v || 1); k++) spawnEnemyAt(player.x + rand(-260, 260), player.y + rand(-260, 260), 'thrower');
  else if(cmd === 'storm'){ if(storm){ storm.r = v; storm.targetR = v; storm.shrink = 0; } }
  else if(cmd === 'kill'){ for(var m = enemies.length - 1; m >= 0; m--) if(enemies[m].tier >= 1) damageEnemy(enemies[m], 1e7, false); }
  else if(cmd === 'clear'){
    enemies.length = 0; xpGems.length = 0; items.length = 0; projectiles.length = 0; decals.length = 0;
  }
  else if(cmd === 'spawnAt' && v){
    var ne = spawnEnemyAt(player.x + (v.dx || 0), player.y + (v.dy || 0), v.type || 'slime');
    if(ne && v.grow) ne.kills = v.grow;
  }
  else if(cmd === 'set' && v){
    for(var kk in v) if(Object.prototype.hasOwnProperty.call(v, kk)) settings[kk] = v[kk];
    recalcPlayer();
  }
  else if(cmd === 'hero' && v != null){
    selectedHero = HEROES[v % HEROES.length];
    settings.maxHp = selectedHero.maxHp; settings.bladeCount = selectedHero.bladeCount;
    settings.bladeDamage = selectedHero.bladeDamage; settings.bladeLength = selectedHero.bladeLength;
    settings.bladeThickness = selectedHero.bladeThickness; settings.bladeOrbit = selectedHero.bladeOrbit;
    settings.bladeRotSpeed = selectedHero.bladeRotSpeed; settings.moveSpeed = selectedHero.speed;
    settings.critChance = selectedHero.critChance; settings.critMult = selectedHero.critMult;
    settings.magnet = selectedHero.magnet;
    recalcPlayer();
  }
  else if(cmd === 'tp' && v){ player.x += v.dx || 0; player.y += v.dy || 0; camera.x = player.x; camera.y = player.y; }
  else if(cmd === 'plane') spawnPlane();
  else if(cmd === 'crate'){
    airDrops.push({ x:player.x + 90, y:player.y - 30, hp:settings.airDropHp, maxHp:settings.airDropHp,
      opened:false, armor:10, phase:rand(0,Math.PI*2), fall:0, landed:true });
  }
  else if(cmd === 'gear') spawnGear(player.x + rand(-40,40), player.y + rand(-40,40), v);
  else if(cmd === 'buff') grantBuff(v || 'redbuff');
  else if(cmd === 'guardians'){
    for(var gi3 = guardians.length - 1; gi3 >= 0; gi3--){
      var gd2 = guardians[gi3];
      if(!gd2.dead){ damageEnemy(gd2, 1e9, false); }
    }
  }
  else if(cmd === 'elites'){ for(var ej = enemies.length - 1; ej >= 0; ej--) if(enemies[ej].tier >= 1 && !enemies[ej].guardian) damageEnemy(enemies[ej], 1e9, false); }
  return window.__game();
};

})();
</script>
