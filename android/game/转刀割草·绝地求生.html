function drawSkillSpinFx(ctx, px, py, pr, ox, oy){
  if(!player || player.skillSpinT <= 0) return;
  var cx = px, cy = py;
  var k = player.skillSpinMax > 0 ? player.skillSpinT / player.skillSpinMax : 0;
  var power = 0.55 + (1 - k) * 0.45;
  var rot = player.bladeAngle;
  var orbit = player.bladeOrbit;
  var inner = Math.max(pr * 1.5, orbit - player.bladeLength * 0.9);
  var outer = orbit + player.bladeThickness * 1.5;
  var n = Math.max(1, blades.length);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.globalCompositeOperation = 'lighter';

  // 旋刃专属“疾风环”：不是普通技能圆环，而是跟随刀刃旋转方向高速扫过。
  var sweep = Math.PI * (0.95 + power * 0.8);
  for(var aidx = 0; aidx < 3; aidx++){
    var off = aidx * Math.PI * 2 / 3;
    var start = rot - sweep * 0.72 + off;
    var end = rot + sweep * 0.28 + off;
    ctx.beginPath();
    ctx.arc(0, 0, inner + (outer-inner)*0.45, start, end);
    ctx.strokeStyle = aidx === 0 ? 'rgba(255,235,150,'+(0.75*power)+')' : 'rgba(120,225,255,'+(0.34*power)+')';
    ctx.lineWidth = (7 - aidx*1.5) * power;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  // 刀刃残影：把真实刀刃复制到前后几个相位，形成“转刀”而非瞬间闪光。
  for(var bi = 0; bi < n; bi++){
    var base = rot + Math.PI * 2 / n * bi;
    for(var ghost = 1; ghost <= 4; ghost++){
      var ga = base - ghost * 0.16;
      var alpha = (0.24 - ghost * 0.045) * power;
      var gInner = inner, gOuter = outer + player.bladeLength * 0.16;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ga) * gInner, Math.sin(ga) * gInner);
      ctx.lineTo(Math.cos(ga) * gOuter, Math.sin(ga) * gOuter);
      ctx.strokeStyle = 'rgba(255,245,205,'+alpha+')';
      ctx.lineWidth = Math.max(2, player.bladeThickness * (1.7 - ghost*0.18));
      ctx.lineCap = 'round';
      ctx.stroke();
    }
  }

  // 中心风压环 + 旋转刻线
  ctx.beginPath();
  ctx.arc(0, 0, orbit * 0.72, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,226,125,'+(0.16*power)+')';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  for(var ri = 0; ri < 8; ri++){
    var ra = rot * 1.7 + ri * Math.PI/4;
    ctx.beginPath();
    ctx.moveTo(Math.cos(ra) * orbit*0.62, Math.sin(ra) * orbit*0.62);
    ctx.lineTo(Math.cos(ra) * orbit*0.86, Math.sin(ra) * orbit*0.86);
    ctx.strokeStyle = 'rgba(210,245,255,'+(0.34*power)+')';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.restore();
}

function useSkill(){
  if(state !== 'playing' || skillCooldown > 0) return;
  var cdMax = Math.max(1, settings.skillCooldown * (player.cdMul || 1));
  skillCooldown = cdMax;
  // 专属旋刃状态：短时间让真实刀刃高速旋转，而不是只做一个按钮/圆环特效。
  player.skillSpinMax = 760;
  player.skillSpinT = player.skillSpinMax;
  player.invuln = Math.max(player.invuln, 46);
  var skillEl = document.getElementById('skillBtn');
  skillEl.classList.remove('skillFlash');
  void skillEl.offsetWidth;
  skillEl.classList.add('skillFlash');
  showBanner('⚔ 旋刃·疾风斩！');
  var dx = joy.active ? joy.dx : Number(!!(keys.d || keys.ArrowRight)) - Number(!!(keys.a || keys.ArrowLeft));
  var dy = joy.active ? joy.dy : Number(!!(keys.s || keys.ArrowDown)) - Number(!!(keys.w || keys.ArrowUp));
  var length = Math.hypot(dx,dy);
  if(length > 0){
    var dashDist = 118;
    var sx = player.x, sy = player.y;
    player.x += dx / length * dashDist; player.y += dy / length * dashDist;
    for(var trail=0; trail<6; trail++){
      var tt = trail / 6;
      createParticles(sx + (player.x-sx)*tt, sy + (player.y-sy)*tt, 3, trail%2 ? '#ffe28e' : '#7fe9ff', 2.8);
    }
  }
  rings.push({x:player.x,y:player.y,r:12,maxR:settings.skillRadius,life:1,color:'#ffca61'});
  createParticles(player.x, player.y, 34, '#ffdc79', 7);
  shake.intensity = 12;
  screenFlash = .28;
  playTone(220,.28,'sawtooth',.16,680);
  // 冲刺顺手震碎附近飞刀
  for(var pi2 = projectiles.length - 1; pi2 >= 0; pi2--){
    var ppj = projectiles[pi2];
    if(dist(player.x, player.y, ppj.x, ppj.y) < settings.skillRadius){
      createParticles(ppj.x, ppj.y, 6, '#bff8ff', 4);
      hitSparks.push({ x:ppj.x, y:ppj.y, vx:rand(-4,4), vy:rand(-4,4), life:1, decay:0.1, size:2.5, color:'#bff8ff' });
      projectiles.splice(pi2, 1);
    }
  }
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i];
    if(!e.dead && dist(player.x,player.y,e.x,e.y)<settings.skillRadius)
      damageEnemy(e, player.damage * settings.skillDmgMult, true);
  }
  updateUI();
}

/* ============================================================
   主循环
   ============================================================ */
function gameLoop(t){
  requestAnimationFrame(gameLoop);
  if(!lastTime) lastTime = t;
  var dt = Math.min(t - lastTime, 50);
  lastTime = t;
  if(dt > 0) fpsAvg = fpsAvg * 0.94 + (1000 / dt) * 0.06;

  if(state === 'playing') update(dt);
  render();
}

function update(dt){
  var dtf = dt / 16.67;
  time += dt;
  // 命中停顿：冻结整个世界
  if(hitstop > 0){ hitstop -= 1; return; }
  var cdMax = Math.max(1, settings.skillCooldown);
  skillCooldown = Math.max(0, skillCooldown - dt);
  if(player.skillSpinT > 0) player.skillSpinT = Math.max(0, player.skillSpinT - dt);
  comboTimer = Math.max(0, comboTimer - dt);
  bannerTimer = Math.max(0, bannerTimer - dt);
  if(comboTimer === 0) combo = 0;
  document.getElementById('banner').classList.toggle('show', bannerTimer > 0);
  var comboEl = document.getElementById('combo');
  comboEl.textContent = combo >= 3 ? combo + ' 连斩' : '';
  comboEl.classList.toggle('show', combo >= 3);
  var skillEl = document.getElementById('skillBtn');
  var chargePct = (100 * (1 - skillCooldown / cdMax));
  skillEl.style.setProperty('--charge', chargePct + '%');
  skillEl.disabled = skillCooldown > 0;
  skillEl.classList.toggle('ready', skillCooldown <= 0);
  skillEl.classList.toggle('cooling', skillCooldown > 0);
  skillEl.querySelector('.skillCdText').textContent = skillCooldown > 0 ? (skillCooldown/1000).toFixed(1) + 's' : 'READY';

  shake.intensity *= 0.86;
  shake.x = (Math.random() - 0.5) * shake.intensity * 2;
  shake.y = (Math.random() - 0.5) * shake.intensity * 2;
  screenFlash *= 0.88;
  vignettePulse *= 0.9;

  if(player.invuln > 0) player.invuln -= dtf;
  if(player.hpRegen > 0){
    // 回血有上限：叠再多血量也不可能站着不动就不死
    var regenCap = Math.max(player.hpRegen * 0.35, player.maxHp * settings.regenCapPct);
    player.hp = Math.min(player.hp + Math.min(player.hpRegen, regenCap) * dt / 1000, player.maxHp);
  }

  // 移动
  var moveX = joy.active ? joy.dx : Number(!!(keys.d || keys.ArrowRight)) - Number(!!(keys.a || keys.ArrowLeft));
  var moveY = joy.active ? joy.dy : Number(!!(keys.s || keys.ArrowDown)) - Number(!!(keys.w || keys.ArrowUp));
  var moveLen = Math.hypot(moveX, moveY);
  if(moveLen > 1){ moveX /= moveLen; moveY /= moveLen; }
  // 肾上腺素：短时间大幅提速
  var spd = player.speed * player.speedMul * ((player.adrenT > 0) ? 1.6 : 1) * dtf;
  player.x += moveX * spd; player.y += moveY * spd;
  player.vx = moveX * spd; player.vy = moveY * spd;
  if(Math.abs(moveX) > 0.05) player.face = moveX > 0 ? 1 : -1;

  // 刀刃
  updateBlades(dt);

  // 挥砍音效：按旋转角度累积触发
  _swingPhase += Math.abs(player.bladeRotSpeed) * dt * 0.065;
  if(_swingPhase > 1.3){ _swingPhase = 0; sfxSwing(); }

  // 刀刃碰撞
  gridBuild();
  var segs = getBladeSegments();
  for(var i = 0; i < enemies.length; i++){
    var e = enemies[i];
    if(e.dead) continue;
    if(!e.cd) e.cd = [];

    // 刀圈防穿透：不能只检测“刀柄到刀尖”的线段。小怪体积小、速度快时，
    // 一帧内可能从刀刃缝隙直接穿进内圈，随后只撞玩家却没有受到伤害。
    // 因此额外检测“旋转刀圈”本身，并在穿过刀圈时产生实体阻挡。
    var pdxRing = e.x - player.x, pdyRing = e.y - player.y;
    var ringD = Math.sqrt(pdxRing*pdxRing + pdyRing*pdyRing) || 0.001;
    var ringHalf = Math.max(8, player.bladeThickness * 0.72);
    var ringHit = Math.abs(ringD - player.bladeOrbit) <= e.radius + ringHalf;
    if(ringHit){
      var ringIndex = Math.floor(((Math.atan2(pdyRing,pdxRing) - player.bladeAngle + Math.PI*2) % (Math.PI*2)) / (Math.PI*2 / Math.max(1,player.bladeCount)));
      ringIndex = Math.max(0, Math.min(segs.length - 1, ringIndex));
      if(segs.length && !(e.cd[ringIndex] > 0)){
        e.cd[ringIndex] = settings.bladeHitCd;
        var ringAngle = Math.atan2(pdyRing,pdxRing);
        var ringKb = ringAngle + Math.PI / 2;
        if(e.blades > 0){
          if(e.disarmCd <= 0){
            e.blades--; e.disarmCd = 34;
            shockwaves.push({x:e.x,y:e.y,r:e.radius*.5,spd:6,life:.8,color:'#ffd24a',w:3});
            createParticles(e.x,e.y,8,'#ffd24a',4);
            damageTexts.push({x:e.x,y:e.y-e.radius, vx:0,vy:-1.5,text:'拼刀!',life:.8,isCrit:false,scale:1.0,rot:0});
            sfxHit();
          }
        } else {
          var ringDmg = player.damage * (0.9 + Math.random()*0.2);
          var ringCrit = Math.random() < player.critChance;
          if(ringCrit) ringDmg *= player.critMult;
          damageEnemy(e, ringDmg, ringCrit, ringKb);
          if(!e.dead) createParticles(e.x,e.y,3,ringCrit?'#ffdd59':'#fff',2.5);
        }
        // 物理阻挡：把怪物推回刀圈外，彻底杜绝“小怪钻进本体”。
        var pushOut = Math.max(0, (player.bladeOrbit - ringHalf - e.radius) - ringD);
        if(pushOut > 0){ e.x += (pdxRing/ringD) * pushOut; e.y += (pdyRing/ringD) * pushOut; }
      }
    }

    for(var j = 0; j < segs.length; j++){
      if(e.dead) break;
      if(e.cd[j] > 0) continue;
      var seg = segs[j];
      var hitR = e.radius + player.bladeThickness * 0.6;
      if(segCircle(seg, e.x, e.y, hitR)){
        e.cd[j] = settings.bladeHitCd;
        var kbAngle = seg.angle + Math.PI / 2;

        // 刀对刀：精英/Boss 有刀刃时，先拼刀
        if(e.blades > 0){
          // 拼刀有短冷却：精英不会被一瞬间缴械（要压着打几百毫秒才断一把）
          if(e.disarmCd > 0){
            hitSparks.push({
              x:e.x + rand(-8,8), y:e.y + rand(-8,8), vx:rand(-3,3), vy:rand(-3,3),
              life:1, decay:0.12, size:rand(1.6,3.2), color:'#fff0b0'
            });
            shockwaves.push({ x:e.x, y:e.y, r:e.radius*0.4, spd:4, life:0.4, color:'#ffd24a', w:1.6 });
            sfxHit();
            continue;
          }
          e.blades--;
          e.disarmCd = 34;
          // 拼刀特效
          shockwaves.push({ x:e.x, y:e.y, r:e.radius*0.5, spd:6, life:0.8, color:'#ffd24a', w:3 });
          createParticles(e.x, e.y, 10, '#ffd24a', 4);
          hitSparks.push({
            x:e.x, y:e.y, vx:rand(-3,3), vy:rand(-3,3),
            life:1, decay:0.1, size:rand(2,4), color:'#fff7c0'
          });
          damageTexts.push({
            x:e.x+rand(-8,8), y:e.y-e.radius, vx:rand(-0.4,0.4),
            text:'拼刀!', life:0.8, isCrit:false, vy:-1.5, scale:1.0, rot:0
          });
          sfxHit();
          // 精英刀刃被全部打掉后短暂停顿
          if(e.blades === 0){
            hitstop = Math.max(hitstop, 3);
            showBanner(e.name + ' 刀刃尽碎！');
          }
          continue;
        }

        var dmg = player.damage * (0.9 + Math.random() * 0.2);
        var isCrit = Math.random() < player.critChance;
        if(isCrit) dmg *= player.critMult;

        damageEnemy(e, dmg, isCrit, kbAngle);

        slashes.push({
          x: e.x, y: e.y,
          angle: seg.angle,
          life: 1,
          color: isCrit ? '#ffdd59' : '#ffffff',
          len: player.bladeLength * 1.1,
          isCrit: isCrit
        });
        createParticles(e.x, e.y, isCrit ? 8 : 4, isCrit ? '#ffdd59' : '#aaddff', 3);

        if(!isCrit) sfxHit();
      }
    }
  }

  // 玩家的刀也能砸空投箱（20w 血，谁先砸开谁先抢）
  for(var adi = 0; adi < airDrops.length; adi++){
    var ad = airDrops[adi];
    if(ad.opened) continue;
    for(var sj = 0; sj < segs.length; sj++){
      if(segCircle(segs[sj], ad.x, ad.y, 26)){
        if(!ad.cd || ad.cd <= 0){
          ad.cd = 6;
          damageAirDrop(ad, player.damage * (0.9 + Math.random() * 0.25) * (settings.airDropDmgMult || 1), player);
          sfxHit();
        }
        break;
      }
    }
    if(ad.cd > 0) ad.cd -= 1;
  }

  updateEnemies(dt);
  updateEnemyCombat(dt);   // 怪物互砍 + 吞噬进化
  updateProjectiles(dt);   // 飞刀
  updateStorm(dt);         // 风暴圈（圈外掉血）
  updateDecals(dt);        // 地面血迹/焦痕
  updateXpGems(dt);
  updateItems(dt);
  maybeSpawnBoss();
  refreshThreat();
  // 存活精英计数（HUD / 排名）
  aliveElites = 0;
  for(var ei = 0; ei < enemies.length; ei++) if(!enemies[ei].dead && enemies[ei].tier >= 1 && !enemies[ei].guardian) aliveElites++;

  // 玩家 BUFF / 罡气 / 诸葛连弩
  if(player.buffFireT > 0) player.buffFireT -= dt;
  if(player.buffThunderT > 0) player.buffThunderT -= dt;
  if(player.adrenT > 0) player.adrenT -= dt;
  if(player.buffFireT <= 0 && player.gear.enchant !== 'huodao' && player.gear.tech !== 'gongfa_di') player.fireBlade = 0;
  if(player.buffThunderT <= 0 && player.gear.enchant !== 'leiji') player.thunderBlade = 0;
  if(player.shieldMax > 0 && player.shield < player.shieldMax){
    player.shield = Math.min(player.shieldMax, player.shield + player.shieldMax * 0.02 * dt / 1000);
  }
  player.boltCd = (player.boltCd || 0) - dt;
  if(player.bolts && player.boltCd <= 0){
    var bq = gridQuery(player.x, player.y, 300);
    var bt = null, bd = 1e9;
    for(var bi2 = 0; bi2 < bq.length; bi2++){
      var oe = bq[bi2];
      if(!oe || oe.dead || oe.tier === undefined || oe.opened !== undefined) continue;
      var ddd = dist(player.x, player.y, oe.x, oe.y);
      if(ddd < bd){ bd = ddd; bt = oe; }
    }
    if(bt){
      player.boltCd = 320;
      projectiles.push({
        x:player.x, y:player.y, vx:(bt.x - player.x)/Math.max(1,bd) * 9, vy:(bt.y - player.y)/Math.max(1,bd) * 9,
        r:6, spin:0, life:1.2, owner:null, friendly:true, dmg:player.damage * 0.45, color:'#ffd27a'
      });
    } else player.boltCd = 200;
  }
  // 电弧衰减
  for(var li2 = lightning.length - 1; li2 >= 0; li2--){
    lightning[li2].life -= 0.09 * dtf;
    if(lightning[li2].life <= 0) lightning.splice(li2, 1);
  }

  // 粒子
  for(var i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.x += p.vx * dtf; p.y += p.vy * dtf;
    p.vx *= 0.95; p.vy *= 0.95;
    p.life -= p.decay * dtf;
    p.size *= 0.975;
    if(p.life <= 0) particles.splice(i, 1);
  }

  // 命中火花
  for(var i = hitSparks.length - 1; i >= 0; i--){
    var sp = hitSparks[i];
    sp.x += sp.vx * dtf; sp.y += sp.vy * dtf;
    sp.vx *= 0.9; sp.vy *= 0.9;
    sp.life -= sp.decay * dtf;
    if(sp.life <= 0) hitSparks.splice(i, 1);
  }

  // 屏幕冲击波
  for(var i = shockwaves.length - 1; i >= 0; i--){
    var sw = shockwaves[i];
    sw.r += sw.spd * dtf;
    sw.life -= 0.04 * dtf;
    if(sw.life <= 0) shockwaves.splice(i, 1);
  }

  // 环境光尘
  for(var i = 0; i < motes.length; i++){
    var mt = motes[i];
    mt.x += mt.vx * dtf;
    mt.y += mt.vy * dtf;
    mt.tw += 0.05 * dtf;
    if(mt.y < -10){ mt.y = H + 10; mt.x = rand(0, W); }
    if(mt.x < -10) mt.x = W + 10;
    if(mt.x > W + 10) mt.x = -10;
  }

  // 伤害数字
  for(var i = damageTexts.length - 1; i >= 0; i--){
    var d = damageTexts[i];
    d.x += (d.vx || 0) * dtf;
    d.y += d.vy * dtf;
    d.vy *= 0.96;
    d.life -= 0.022 * dtf;
    d.scale = lerp(d.scale, d.isCrit ? 1.15 : 1, 0.18 * dtf);
    if(d.life <= 0) damageTexts.splice(i, 1);
  }

  // 斩击特效
  for(var i = slashes.length - 1; i >= 0; i--){
    slashes[i].life -= 0.06 * dtf;
    if(slashes[i].life <= 0) slashes.splice(i, 1);
  }

  // 扩散圆环
  for(var i = rings.length - 1; i >= 0; i--){
    var r = rings[i];
    r.r = lerp(r.r, r.maxR, 0.18 * dtf);
    r.life -= 0.055 * dtf;
    if(r.life <= 0) rings.splice(i, 1);
  }

  // 波次（只用来做数值成长，缩圈由 zoneTimer 独立控制）
  waveTimer += dt;
  if(waveTimer > settings.waveDuration){
    waveTimer = 0;
    wave++;
    screenFlash = 0.12;
    feedMsg('— 第 ' + wave + ' 阶段 —', '#9fd8ff');
  }

  // 缩圈节奏（慢慢来，让精英们一起长大）
  if(storm && settings.stormEnabled && zonePhase < 40){
    zoneTimer -= dt;
    if(zoneTimer <= 0){
      zoneTimer = settings.zonePhaseTime;
      zonePhase++;
      // 收敛模型：每次消掉「超出最小圈的部分」的一定比例，圈才会真的收得完
      var nr = Math.max(settings.stormMinRadius,
        storm.r - (storm.r - settings.stormMinRadius) * settings.stormShrinkPerWave);
      if(nr < storm.r - 20){
        storm.targetR = nr; storm.shrink = 1;
        storm.cx += rand(-120, 120); storm.cy += rand(-120, 120);
        var lim = Math.max(0, settings.mapRadius - nr) * 0.6;
        storm.cx = clamp(storm.cx, -lim, lim); storm.cy = clamp(storm.cy, -lim, lim);
        showBanner('🌀 第 ' + zonePhase + ' 次缩圈');
        feedMsg('🌀 安全区收缩至 ' + Math.round(nr) + ' · 圈外持续掉血', '#c8a2ff');
        spawnPlane();       // 每缩一次圈，刷新空投飞机
        checkVictory();
      }
    }
  }

  // 大地图人口 / 空投 / BUFF
  updatePopulation(dt);
  updatePlanes(dt);
  // 场外精英继续发育（按人口消耗）
  for(var eg2 = 0; eg2 < enemies.length; eg2++){
    var ee = enemies[eg2];
    if(ee.dead || ee.tier < 1 || ee.guardian) continue;
    var pdx2 = ee.x - player.x, pdy2 = ee.y - player.y;
    if(pdx2*pdx2 + pdy2*pdy2 > 2600 * 2600) updateEliteOffscreen(ee, dt);
  }
  // 精英互相消耗：只剩最后一个精英时吃鸡
  if(!victoryDone && finalSpawned >= 0 && aliveElites === 0 && enemies.length > 0 && killCount > 0) checkVictory();

  // 相机
  camera.x = lerp(camera.x, player.x, settings.camSmooth);
  camera.y = lerp(camera.y, player.y, settings.camSmooth);
}

/* ============================================================
   角色绘制（Q版武侠英雄）
   ============================================================ */
/* 侠客立绘：墨线 + 平涂 + 边缘光，带走路动作与武器 */
function drawHero(c, px, py, pr, h, t, scale, walkT){
  var s = scale || 1;
  walkT = walkT || 0;
  var moving = walkT > 0;
  var f = (player && player.face < 0) ? -1 : 1;
  var swing = moving ? Math.sin(walkT) : 0;
  var bob = moving ? Math.abs(Math.sin(walkT)) * pr * 0.07 : Math.sin(t * 0.005) * pr * 0.035;
  var skin = h.skin, hair = h.hair, col = h.color, col2 = h.color2;
  var cape = h.cape || col2;

  c.save();
  c.translate(px, py + bob);
  c.scale(s * f, s);

  // ---- 披风（在身体后面） ----
  var cw = Math.sin(t * 0.004 + 1.2) * pr * 0.16;
  c.beginPath();
  c.moveTo(-pr * 0.42, -pr * 0.55);
  c.quadraticCurveTo(-pr * 1.15 + cw, pr * 0.35, -pr * 0.82 + cw, pr * 1.02);
  c.quadraticCurveTo(-pr * 0.2, pr * 0.82, pr * 0.34, pr * 0.92);
  c.quadraticCurveTo(pr * 0.6, pr * 0.2, pr * 0.42, -pr * 0.55);
  c.closePath();
  var cg3 = c.createLinearGradient(0, -pr * 0.6, 0, pr * 1.1);
  cg3.addColorStop(0, cape);
  cg3.addColorStop(1, 'rgba(6,10,16,0.92)');
  c.fillStyle = cg3; c.fill();
  inkIn(c, 2); c.stroke();

  // ---- 腿 ----
  var legSwing = swing * pr * 0.24;
  c.fillStyle = '#2c2b33';
  rrect(c, -pr * 0.36, pr * 0.52 + legSwing * 0.2, pr * 0.3, pr * 0.62, pr * 0.13);
  c.fill(); inkIn(c, 1.8); c.stroke();
  c.beginPath();
  rrect(c, pr * 0.06, pr * 0.52 - legSwing * 0.2, pr * 0.3, pr * 0.62, pr * 0.13);
  c.fill(); c.stroke();
  // 靴
  c.fillStyle = '#151218';
  c.beginPath();
  c.ellipse(-pr * 0.21, pr * 1.14 + legSwing * 0.2, pr * 0.2, pr * 0.09, 0, 0, Math.PI * 2);
  c.ellipse(pr * 0.21, pr * 1.14 - legSwing * 0.2, pr * 0.2, pr * 0.09, 0, 0, Math.PI * 2);
  c.fill();
  inkIn(c, 1.6); c.stroke();

  // ---- 身体（长袍 + 亮面） ----
  c.beginPath();
  c.moveTo(-pr * 0.52, -pr * 0.45);
  c.quadraticCurveTo(0, -pr * 0.6, pr * 0.52, -pr * 0.45);
  c.lineTo(pr * 0.6, pr * 0.62);
  c.quadraticCurveTo(0, pr * 0.76, -pr * 0.6, pr * 0.62);
  c.closePath();
  var bg3 = c.createLinearGradient(-pr * 0.5, -pr * 0.5, pr * 0.5, pr * 0.7);
  bg3.addColorStop(0, col);
  bg3.addColorStop(0.62, col2);
  bg3.addColorStop(1, '#1a1016');
  c.fillStyle = bg3; c.fill();
  inkIn(c, 2.2); c.stroke();
  // 衣襟
  c.beginPath();
  c.moveTo(-pr * 0.24, -pr * 0.48);
  c.lineTo(0, pr * 0.2);
  c.lineTo(pr * 0.24, -pr * 0.48);
  c.closePath();
  c.fillStyle = 'rgba(255,255,255,0.16)';
  c.fill();
  inkIn(c, 1.3); c.stroke();
  // 腰带 + 玉扣
  c.fillStyle = '#241a12';
  c.fillRect(-pr * 0.54, pr * 0.28, pr * 1.08, pr * 0.15);
  c.fillStyle = h.aura;
  c.beginPath(); c.arc(0, pr * 0.355, pr * 0.1, 0, Math.PI * 2); c.fill();
  inkIn(c, 1.2); c.stroke();

  // ---- 手臂 ----
  c.strokeStyle = col2; c.lineWidth = pr * 0.26; c.lineCap = 'round';
  c.beginPath();
  c.moveTo(-pr * 0.42, -pr * 0.28);
  c.quadraticCurveTo(-pr * 0.72, pr * 0.05, -pr * 0.6 + swing * pr * 0.16, pr * 0.42);
  c.stroke();
  inkIn(c, 2.6); c.stroke();
  c.strokeStyle = col2;
  c.beginPath();
  c.moveTo(pr * 0.42, -pr * 0.28);
  c.quadraticCurveTo(pr * 0.78, -pr * 0.05, pr * 0.72 - swing * pr * 0.16, pr * 0.3);
  c.stroke();
  inkIn(c, 2.6); c.stroke();
  // 手
  c.fillStyle = skin;
  c.beginPath(); c.arc(-pr * 0.62 + swing * pr * 0.16, pr * 0.46, pr * 0.15, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(pr * 0.74 - swing * pr * 0.16, pr * 0.34, pr * 0.15, 0, Math.PI * 2); c.fill();
  inkIn(c, 1.5); c.stroke();

  // ---- 武器（握在右手） ----
  var wpn = h.weapon;
  var bc1 = wpn === 'flame' ? '#ff7a1a' : wpn === 'sword' ? '#a8e8ff' : '#e8eef5';
  var bc2 = wpn === 'flame' ? '#ffd24a' : wpn === 'sword' ? '#4fa8e0' : '#c8a24a';
  c.save();
  c.translate(pr * 0.74 - swing * pr * 0.16, pr * 0.34);
  c.rotate(-0.85 + swing * 0.12);
  c.fillStyle = bc1;
  c.beginPath();
  c.moveTo(0, -pr * 1.5);
  c.lineTo(pr * 0.17, -pr * 0.34);
  c.lineTo(-pr * 0.05, pr * 0.22);
  c.lineTo(-pr * 0.17, -pr * 0.34);
  c.closePath(); c.fill();
  inkIn(c, 1.7); c.stroke();
  c.fillStyle = bc2;
  c.fillRect(-pr * 0.24, pr * 0.2, pr * 0.48, pr * 0.13);
  inkIn(c, 1.2); c.strokeRect(-pr * 0.24, pr * 0.2, pr * 0.48, pr * 0.13);
  c.restore();

  // ---- 头 ----
  var headR = pr * 0.6, headY = -pr * 0.92;
  c.fillStyle = skin;
  c.fillRect(-pr * 0.14, -pr * 0.58, pr * 0.28, pr * 0.2);   // 脖子
  var hg2 = c.createRadialGradient(-headR * 0.35, headY - headR * 0.4, headR * 0.1, 0, headY, headR * 1.05);
  hg2.addColorStop(0, '#fff1d8');
  hg2.addColorStop(1, skin);
  c.beginPath();
  c.ellipse(0, headY, headR * 0.94, headR, 0, 0, Math.PI * 2);
  c.fillStyle = hg2; c.fill();
  inkIn(c, 2); c.stroke();

  // 发型 / 头饰
  if(h.id === 'jiumozhi'){
    c.fillStyle = 'rgba(200,60,50,0.65)';
    for(var s2 = 0; s2 < 3; s2++){
      c.beginPath();
      c.arc(-headR * 0.34 + s2 * headR * 0.34, headY - headR * 0.55, headR * 0.08, 0, Math.PI * 2);
      c.fill();
    }
  } else {
    c.fillStyle = hair;
    c.beginPath();
    c.arc(0, headY - headR * 0.06, headR * 0.99, Math.PI * 1.02, Math.PI * 1.98);
    c.fill();
    inkIn(c, 1.6); c.stroke();
    if(h.id === 'qiaofeng'){
      c.fillStyle = '#c0392b';
      c.beginPath();
      c.moveTo(-headR * 0.98, headY - headR * 0.28);
      c.lineTo(headR * 1.02, headY - headR * 0.36);
      c.lineTo(headR * 1.0, headY - headR * 0.5);
      c.lineTo(-headR, headY - headR * 0.46);
      c.closePath(); c.fill();
      inkIn(c, 1.4); c.stroke();
      // 束发带飘尾
      c.strokeStyle = '#c0392b'; c.lineWidth = 2;
      c.beginPath();
      c.moveTo(-headR * 0.95, headY - headR * 0.36);
      c.quadraticCurveTo(-headR * 1.7, headY - headR * 0.1 + cw * 0.4, -headR * 1.9, headY + headR * 0.4);
      c.stroke();
    } else {
      // 段誉：两侧长发
      c.fillStyle = hair;
      c.beginPath();
      c.moveTo(-headR * 0.95, headY - headR * 0.2);
      c.quadraticCurveTo(-headR * 1.25, headY + headR * 0.6, -headR * 0.6, headY + headR * 0.95);
      c.quadraticCurveTo(-headR * 0.85, headY + headR * 0.3, -headR * 0.6, headY);
      c.closePath(); c.fill();
      c.beginPath();
      c.moveTo(headR * 0.95, headY - headR * 0.2);
      c.quadraticCurveTo(headR * 1.25, headY + headR * 0.6, headR * 0.6, headY + headR * 0.95);
      c.quadraticCurveTo(headR * 0.85, headY + headR * 0.3, headR * 0.6, headY);
      c.closePath(); c.fill();
      c.fillStyle = h.aura;
      c.beginPath(); c.arc(0, headY - headR * 0.68, headR * 0.16, 0, Math.PI * 2); c.fill();
    }
  }

  // 眼睛 + 嘴
  var eyeY2 = headY + headR * 0.06, eyeOff2 = headR * 0.34;
  c.fillStyle = '#12100f';
  c.beginPath();
  c.ellipse(-eyeOff2, eyeY2, headR * 0.13, headR * 0.19, 0, 0, Math.PI * 2);
  c.ellipse(eyeOff2, eyeY2, headR * 0.13, headR * 0.19, 0, 0, Math.PI * 2);
  c.fill();
  c.fillStyle = '#fff';
  c.beginPath();
  c.arc(-eyeOff2 + headR * 0.05, eyeY2 - headR * 0.07, headR * 0.05, 0, Math.PI * 2);
  c.arc(eyeOff2 + headR * 0.05, eyeY2 - headR * 0.07, headR * 0.05, 0, Math.PI * 2);
  c.fill();
  c.strokeStyle = '#a04c42'; c.lineWidth = 1.6;
  c.beginPath(); c.arc(0, headY + headR * 0.42, headR * 0.2, 0.2 * Math.PI, 0.8 * Math.PI); c.stroke();

  // 边缘光（月光/气场）
  c.save();
  c.globalCompositeOperation = 'lighter';
  c.strokeStyle = h.aura + 'aa';
  c.lineWidth = 2.2;
  c.beginPath();
  c.arc(0, headY, headR * 1.02, Math.PI * 1.05, Math.PI * 1.55);
  c.stroke();
  c.beginPath();
  c.moveTo(-pr * 0.5, -pr * 0.42);
  c.lineTo(-pr * 0.62, pr * 0.6);
  c.stroke();
  c.restore();

  c.restore();
}

function drawHeroPortrait(c, size, h){
  // 角色选择卡片头像：自适应画布尺寸，保证完整不溢出
  c.clearRect(0, 0, size, size);
  var pr = 20;
  var sc = size * 0.0172;
  drawHero(c, size / 2, size * 0.52, pr, h, 0, sc, 0);
}

/* ============================================================
   场景物体绘制（夜战场地物：石灯 / 篝火 / 战旗 / 残柱…）
   ============================================================ */
function inkIn(c, w){
  c.strokeStyle = PAL.ink;
  c.lineWidth = w;
  c.lineJoin = 'round';
  c.lineCap = 'round';
}

function drawScenery(c, sc, x, y, t){
  var sz = sc.size;
  var ph = (sc.seed % 1000) / 1000;
  var sway = Math.sin(t * 0.0014 + ph * 6.283) * 0.07;

  // 通用落地阴影
  c.globalAlpha = 0.4;
  c.fillStyle = '#02070c';
  c.beginPath();
  c.ellipse(x + 3*sz, y + 3*sz, 17*sz, 6*sz, 0, 0, Math.PI*2);
  c.fill();
  c.globalAlpha = 1;

  if(sc.type === 'fire'){
    // 石圈 + 柴火 + 跳动火焰
    for(var i = 0; i < 7; i++){
      var a = i / 7 * Math.PI * 2 + ph * 3;
      c.beginPath();
      c.ellipse(x + Math.cos(a) * 15*sz, y + Math.sin(a) * 5.5*sz, 4.6*sz, 3.4*sz, a, 0, Math.PI*2);
      c.fillStyle = i % 2 ? '#5b6b73' : '#42525c';
      c.fill();
      inkIn(c, 1.4*sz); c.stroke();
    }
    c.strokeStyle = '#4a3524'; c.lineWidth = 3.4*sz; c.lineCap = 'round';
    c.beginPath(); c.moveTo(x - 8*sz, y + 2*sz); c.lineTo(x + 8*sz, y - 3*sz); c.stroke();
    c.beginPath(); c.moveTo(x + 7*sz, y + 2*sz); c.lineTo(x - 7*sz, y - 3*sz); c.stroke();
    var fl = 0.72 + Math.sin(t * 0.02 + ph * 9) * 0.16 + Math.sin(t * 0.045 + ph * 3) * 0.08;
    c.save();
    c.globalCompositeOperation = 'lighter';
    for(var f = 0; f < 3; f++){
      var fs = (1 - f * 0.28) * fl;
      c.globalAlpha = 0.42 - f * 0.09;
      c.fillStyle = f === 0 ? '#ff5a1e' : f === 1 ? '#ffa33c' : '#fff0b8';
      c.beginPath();
      c.moveTo(x - 7*sz*fs, y - 2*sz);
      c.quadraticCurveTo(x - 9*sz*fs, y - 16*sz*fs, x + Math.sin(t*0.01+ph)*2*sz, y - 26*sz*fs);
      c.quadraticCurveTo(x + 9*sz*fs, y - 15*sz*fs, x + 7*sz*fs, y - 2*sz);
      c.closePath();
      c.fill();
    }
    c.restore();
    c.globalAlpha = 1;
  } else if(sc.type === 'lantern'){
    // 石灯笼：底座 + 灯箱（暖光） + 顶盖
    c.fillStyle = '#4b5a64';
    c.beginPath(); c.moveTo(x - 8*sz, y + 2*sz); c.lineTo(x + 8*sz, y + 2*sz);
    c.lineTo(x + 5.5*sz, y - 4*sz); c.lineTo(x - 5.5*sz, y - 4*sz); c.closePath(); c.fill();
    inkIn(c, 1.6*sz); c.stroke();
    c.fillStyle = '#3c4a53';
    c.fillRect(x - 3.5*sz, y - 12*sz, 7*sz, 8*sz);
    inkIn(c, 1.3*sz); c.strokeRect(x - 3.5*sz, y - 12*sz, 7*sz, 8*sz);
    var lg = c.createLinearGradient(x, y - 20*sz, x, y - 12*sz);
    lg.addColorStop(0, '#ffe9a8'); lg.addColorStop(1, '#ffab3d');
    c.fillStyle = lg;
    c.fillRect(x - 4.5*sz, y - 20*sz, 9*sz, 8*sz);
    inkIn(c, 1.6*sz); c.strokeRect(x - 4.5*sz, y - 20*sz, 9*sz, 8*sz);
    c.fillStyle = '#54646e';
    c.beginPath();
    c.moveTo(x - 9*sz, y - 20*sz); c.lineTo(x + 9*sz, y - 20*sz);
    c.lineTo(x + 5*sz, y - 28*sz); c.lineTo(x - 5*sz, y - 28*sz); c.closePath(); c.fill();
    inkIn(c, 1.5*sz); c.stroke();
  } else if(sc.type === 'banner'){
    // 战旗：旗杆 + 破布旗面（飘动）
    c.strokeStyle = '#2b3640'; c.lineWidth = 3*sz; c.lineCap = 'round';
    c.beginPath(); c.moveTo(x, y + 2*sz); c.lineTo(x, y - 54*sz); c.stroke();
    c.beginPath(); c.arc(x, y - 56*sz, 2.6*sz, 0, Math.PI*2); c.fillStyle = '#ffd27a'; c.fill();
    var w2 = 22*sz, h2 = 34*sz;
    c.beginPath();
    c.moveTo(x, y - 52*sz);
    c.quadraticCurveTo(x + w2 * (0.55 + sway), y - 46*sz, x + w2 * (0.95 + sway*1.6), y - 40*sz);
    c.lineTo(x + w2 * (0.8 + sway*1.6), y - 26*sz);
    c.quadraticCurveTo(x + w2 * 0.5, y - 20*sz, x, y - 18*sz);
    c.closePath();
    var bGr = c.createLinearGradient(x, y - 52*sz, x, y - 18*sz);
    bGr.addColorStop(0, '#a8322c'); bGr.addColorStop(1, '#63191a');
    c.fillStyle = bGr; c.fill();
    inkIn(c, 1.5*sz); c.stroke();
    c.fillStyle = 'rgba(255,210,122,0.85)';
    c.font = 'bold ' + Math.round(13*sz) + 'px serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('侠', x + w2 * 0.42, y - 35*sz);
  } else if(sc.type === 'deadtree'){
    c.strokeStyle = '#2e2a26'; c.lineCap = 'round';
    c.lineWidth = 6*sz;
    c.beginPath(); c.moveTo(x, y + 2*sz); c.quadraticCurveTo(x - 2*sz, y - 18*sz, x + 2*sz, y - 34*sz); c.stroke();
    c.lineWidth = 3*sz;
    c.beginPath(); c.moveTo(x + 1*sz, y - 20*sz); c.quadraticCurveTo(x - 12*sz, y - 26*sz, x - 18*sz, y - 34*sz); c.stroke();
    c.beginPath(); c.moveTo(x + 2*sz, y - 26*sz); c.quadraticCurveTo(x + 14*sz, y - 30*sz, x + 20*sz, y - 40*sz); c.stroke();
    c.lineWidth = 2*sz;
    c.beginPath(); c.moveTo(x, y - 33*sz); c.lineTo(x - 4*sz, y - 44*sz); c.stroke();
    c.beginPath(); c.moveTo(x, y - 33*sz); c.lineTo(x + 6*sz, y - 45*sz); c.stroke();
    c.strokeStyle = 'rgba(180,220,255,0.22)'; c.lineWidth = 1.4*sz;
    c.beginPath(); c.moveTo(x - 2*sz, y + 1*sz); c.lineTo(x + 1*sz, y - 33*sz); c.stroke();
  } else if(sc.type === 'bamboo'){
    for(var b = 0; b < 4; b++){
      var bx = x + (b - 1.5) * 6*sz, bh = (38 + (b % 3) * 12) * sz;
      var bs = Math.sin(t * 0.0018 + ph * 5 + b) * 3*sz;
      c.strokeStyle = '#3f6b45'; c.lineWidth = 2.6*sz; c.lineCap = 'round';
      c.beginPath(); c.moveTo(bx, y + 2*sz); c.quadraticCurveTo(bx + bs*0.5, y - bh*0.6, bx + bs, y - bh); c.stroke();
      c.strokeStyle = 'rgba(140,210,150,0.35)'; c.lineWidth = 1*sz;
      c.beginPath(); c.moveTo(bx - 1*sz, y + 1*sz); c.quadraticCurveTo(bx + bs*0.5 - 1*sz, y - bh*0.6, bx + bs - 1*sz, y - bh); c.stroke();
      for(var lf2 = 0; lf2 < 2; lf2++){
        var ly = y - bh * (0.6 + lf2 * 0.28);
        var dir = lf2 ? 1 : -1;
        c.strokeStyle = '#4f8a52'; c.lineWidth = 1.6*sz;
        c.beginPath();
        c.moveTo(bx + bs*0.6, ly);
        c.quadraticCurveTo(bx + bs*0.6 + dir*9*sz, ly - 5*sz, bx + bs*0.6 + dir*15*sz, ly + 2*sz);
        c.stroke();
      }
    }
  } else if(sc.type === 'pillar'){
    c.fillStyle = '#5a6b74';
    c.beginPath();
    c.moveTo(x - 9*sz, y + 2*sz);
    c.lineTo(x - 7*sz, y - 40*sz);
    c.lineTo(x + 3*sz, y - 46*sz);
    c.lineTo(x + 9*sz, y - 38*sz);
    c.lineTo(x + 8*sz, y + 2*sz);
    c.closePath(); c.fill();
    inkIn(c, 1.8*sz); c.stroke();
    c.fillStyle = 'rgba(255,255,255,0.10)';
    c.beginPath(); c.moveTo(x - 7*sz, y - 39*sz); c.lineTo(x - 2*sz, y - 43*sz);
    c.lineTo(x - 2*sz, y + 2*sz); c.lineTo(x - 7*sz, y + 2*sz); c.closePath(); c.fill();
    c.strokeStyle = '#2c5a3f'; c.lineWidth = 2.2*sz;
    c.beginPath(); c.moveTo(x + 7*sz, y - 2*sz); c.quadraticCurveTo(x + 2*sz, y - 14*sz, x + 6*sz, y - 24*sz); c.stroke();
  } else if(sc.type === 'swords'){
    c.fillStyle = '#3a3226';
    c.beginPath(); c.ellipse(x, y - 2*sz, 16*sz, 7*sz, 0, 0, Math.PI*2); c.fill();
    inkIn(c, 1.4*sz); c.stroke();
    for(var s2 = 0; s2 < 5; s2++){
      var sa = -0.9 + s2 * 0.45;
      var len2 = (20 + (s2 % 3) * 7) * sz;
      var ex2 = x + Math.sin(sa) * len2 * 0.8, ey2 = y - 4*sz - Math.cos(sa) * len2;
      c.strokeStyle = s2 % 2 ? '#8f9aa3' : '#6c757d'; c.lineWidth = 2.6*sz; c.lineCap = 'round';
      c.beginPath(); c.moveTo(x + Math.sin(sa)*4*sz, y - 4*sz); c.lineTo(ex2, ey2); c.stroke();
      c.strokeStyle = '#c8b06a'; c.lineWidth = 2.2*sz;
      c.beginPath();
      c.moveTo(ex2 - Math.cos(sa)*5*sz, ey2 - Math.sin(sa)*5*sz);
      c.lineTo(ex2 + Math.cos(sa)*5*sz, ey2 + Math.sin(sa)*5*sz);
      c.stroke();
    }
  } else if(sc.type === 'rock'){
    var rg = c.createLinearGradient(x - 16*sz, y - 18*sz, x + 12*sz, y + 6*sz);
    rg.addColorStop(0, '#6b7d88'); rg.addColorStop(0.55, '#48565f'); rg.addColorStop(1, '#2a343c');
    c.fillStyle = rg;
    c.beginPath();
    c.moveTo(x - 15*sz, y + 2*sz);
    c.quadraticCurveTo(x - 17*sz, y - 11*sz, x - 4*sz, y - 13*sz);
    c.quadraticCurveTo(x + 7*sz, y - 16*sz, x + 14*sz, y - 4*sz);
    c.quadraticCurveTo(x + 17*sz, y + 2*sz, x, y + 4*sz);
    c.closePath(); c.fill();
    inkIn(c, 1.6*sz); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,0.16)'; c.lineWidth = 1.4*sz;
    c.beginPath(); c.moveTo(x - 10*sz, y - 6*sz); c.lineTo(x - 2*sz, y - 11*sz); c.stroke();
  } else if(sc.type === 'bush'){
    var bg = ['#1f4433', '#2b5c42', '#376e4e'];
    for(var bi = 0; bi < 3; bi++){
      c.beginPath();
      c.arc(x + (bi-1)*7*sz, y - 6*sz - (bi === 1 ? 3*sz : 0), 9*sz, 0, Math.PI*2);
      c.fillStyle = bg[bi]; c.fill();
      inkIn(c, 1.3*sz); c.stroke();
    }
    c.fillStyle = 'rgba(150,230,180,0.20)';
    c.beginPath(); c.arc(x - 5*sz, y - 12*sz, 3.4*sz, 0, Math.PI*2); c.fill();
    if(ph > 0.5){
      c.fillStyle = ph > 0.8 ? '#ff9ec4' : '#ffd27a';
      for(var fl3 = 0; fl3 < 3; fl3++){
        c.beginPath();
        c.arc(x - 6*sz + fl3 * 6*sz, y - 14*sz + Math.sin(fl3 * 2 + ph * 9) * 2*sz, 1.7*sz, 0, Math.PI*2);
        c.fill();
      }
    }
  } else if(sc.type === 'runestone'){
    // 出生石阵：一圈刻纹石 + 幽光阵法
    var R = 150 * sz;
    c.save();
    c.globalCompositeOperation = 'lighter';
    var rgd = c.createRadialGradient(x, y, R * 0.2, x, y, R * 1.25);
    rgd.addColorStop(0, 'rgba(120,220,255,0.05)');
    rgd.addColorStop(0.75, 'rgba(120,200,255,0.045)');
    rgd.addColorStop(1, 'rgba(90,160,255,0)');
    c.fillStyle = rgd;
    c.beginPath(); c.arc(x, y, R * 1.25, 0, Math.PI*2); c.fill();
    c.restore();
    c.strokeStyle = 'rgba(150,230,255,' + (0.18 + Math.sin(t * 0.002) * 0.06) + ')';
    c.lineWidth = 1.6;
    c.beginPath(); c.arc(x, y, R, 0, Math.PI*2); c.stroke();
    c.beginPath(); c.arc(x, y, R * 0.72, 0, Math.PI*2); c.stroke();
    for(var ri2 = 0; ri2 < 8; ri2++){
      var ra2 = ri2 / 8 * Math.PI * 2 + 0.2;
      var rx = x + Math.cos(ra2) * R, ry = y + Math.sin(ra2) * R * 0.86;
      c.fillStyle = '#4a5a66';
      c.beginPath();
      c.moveTo(rx - 7, ry + 4); c.lineTo(rx - 4, ry - 18);
      c.lineTo(rx + 4, ry - 20); c.lineTo(rx + 7, ry + 4);
      c.closePath(); c.fill();
      inkIn(c, 1.6); c.stroke();
      c.fillStyle = 'rgba(130,220,255,0.55)';
      c.fillRect(rx - 2, ry - 14, 4, 8);
    }
  }
}

/* ============================================================
   渲染
   ============================================================ */
function rrect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

/* 敌人立绘：每种怪都有自己的轮廓、动作与配色 */
function drawEnemyFigure(c, e, x, y, t){
  var r = e.radius;
  var flash = e.hitFlash > 0;
  var burning = e.burnT > 0;
  var f = e.face >= 0 ? 1 : -1;
  var bob = Math.sin(e.wobble) * r * 0.05;

  // 阴影
  c.globalAlpha = 0.42;
  c.fillStyle = '#02060b';
  c.beginPath();
  c.ellipse(x, y + r * 0.86, r * 1.05, r * 0.36, 0, 0, Math.PI * 2);
  c.fill();
  c.globalAlpha = 1;

  // 脚下光环（精英/Boss 威慑感）
  if(e.tier >= 1){
    var st = evolveStage(e.kills);
    c.save();
    c.globalCompositeOperation = 'lighter';
    var eg2 = c.createRadialGradient(x, y, r * 0.3, x, y, r * (e.type === 'boss' ? 3.4 : 2.5));
    eg2.addColorStop(0, st.aura + '44');
    eg2.addColorStop(0.5, st.aura + '18');
    eg2.addColorStop(1, st.aura + '00');
    c.fillStyle = eg2;
    c.beginPath(); c.arc(x, y, r * (e.type === 'boss' ? 3.4 : 2.5), 0, Math.PI * 2); c.fill();
    c.restore();
    // 地面法阵
    c.save();
    c.globalAlpha = 0.5;
    c.strokeStyle = st.accent;
    c.lineWidth = 1.6;
    c.beginPath(); c.ellipse(x, y + r * 0.8, r * 1.5, r * 0.55, 0, 0, Math.PI * 2); c.stroke();
    c.globalAlpha = 0.3;
    c.beginPath(); c.ellipse(x, y + r * 0.8, r * 1.05, r * 0.38, 0, 0, Math.PI * 2); c.stroke();
    c.restore();
  }
  if(burning){
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.fillStyle = 'rgba(170,110,255,0.30)';
    c.beginPath(); c.arc(x, y, r * 1.5, 0, Math.PI * 2); c.fill();
    c.restore();
  }
  // 小怪也带一点自身颜色的微光：暗夜战场里能一眼分辨种类（尤其飞刀手）
  if(e.tier === 0){
    c.save();
    c.globalCompositeOperation = 'lighter';
    var mg = c.createRadialGradient(x, y, r * 0.4, x, y, r * 2.1);
    mg.addColorStop(0, e.glow + '0.22)');
    mg.addColorStop(1, e.glow + '0)');
    c.fillStyle = mg;
    c.beginPath(); c.arc(x, y, r * 2.1, 0, Math.PI * 2); c.fill();
    c.restore();
  }

  c.save();
  c.translate(x, y + bob);
  c.scale(f, 1);

  if(e.type === 'slime'){
    // ===== 草料：圆滚滚的草精，顶两片叶子 =====
    var sq = 1 + Math.sin(e.wobble * 1.7) * 0.05;
    c.beginPath();
    c.moveTo(-r * 1.05, r * 0.72);
    c.bezierCurveTo(-r * 1.18, -r * 0.35, -r * 0.62, -r * 1.02 * sq, 0, -r * 1.02 * sq);
    c.bezierCurveTo(r * 0.62, -r * 1.02 * sq, r * 1.18, -r * 0.35, r * 1.05, r * 0.72);
    c.closePath();
    var sg = c.createLinearGradient(0, -r, 0, r * 0.8);
    sg.addColorStop(0, flash ? '#ffffff' : '#9fdd7c');
    sg.addColorStop(0.55, flash ? '#ffdede' : e.color);
    sg.addColorStop(1, flash ? '#ffb5b5' : e.color2);
    c.fillStyle = sg; c.fill();
    inkIn(c, 2.2); c.stroke();
    // 叶芽
    var ls = Math.sin(t * 0.003 + e.wobble) * 0.16;
    for(var lf = 0; lf < 2; lf++){
      var dir = lf ? 1 : -1;
      c.save();
      c.translate(dir * r * 0.28, -r * 0.92);
      c.rotate(dir * (0.5 + ls));
      c.beginPath();
      c.ellipse(0, -r * 0.34, r * 0.17, r * 0.42, 0, 0, Math.PI * 2);
      c.fillStyle = '#4aa063'; c.fill();
      inkIn(c, 1.6); c.stroke();
      c.restore();
    }
    // 眼睛（看向玩家）
    var look = 0.12 * (player.x > e.x ? 1 : -1);
    c.fillStyle = '#0a1016';
    c.beginPath();
    c.ellipse(-r * 0.3, -r * 0.18, r * 0.13, r * 0.17, 0, 0, Math.PI * 2);
    c.ellipse(r * 0.3, -r * 0.18, r * 0.13, r * 0.17, 0, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = '#ffffff';
    c.beginPath();
    c.arc(-r * 0.3 + r * 0.05, -r * 0.22, r * 0.05, 0, Math.PI * 2);
    c.arc(r * 0.3 + r * 0.05, -r * 0.22, r * 0.05, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = '#2c5a2f'; c.lineWidth = 1.6;
    c.beginPath(); c.arc(look, r * 0.12, r * 0.2, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();

  } else if(e.type === 'fast'){
    // ===== 刺客：兜帽 + 双匕 + 飘带 =====
    var lean = 0.10;
    c.rotate(lean * f * 0); // 保持正立，靠飘带表现速度
    // 飘带
    c.strokeStyle = flash ? '#ffffff' : '#c98b1e'; c.lineWidth = r * 0.16; c.lineCap = 'round';
    for(var rb = 0; rb < 2; rb++){
      var ph2 = t * 0.008 + rb * 1.6 + e.wobble;
      c.beginPath();
      c.moveTo(-r * 0.2, -r * 0.1 + rb * r * 0.3);
      c.quadraticCurveTo(-r * 1.3, -r * 0.2 + rb * r * 0.4 + Math.sin(ph2) * r * 0.25,
                         -r * 2.1, -r * 0.4 + rb * r * 0.5 + Math.sin(ph2 + 0.8) * r * 0.4);
      c.stroke();
    }
    // 披风
    c.beginPath();
    c.moveTo(0, -r * 1.12);
    c.quadraticCurveTo(-r * 1.15, -r * 0.2, -r * 0.95, r * 0.86);
    c.lineTo(r * 0.95, r * 0.86);
    c.quadraticCurveTo(r * 1.05, -r * 0.3, 0, -r * 1.12);
    c.closePath();
    var fg3 = c.createLinearGradient(0, -r, 0, r);
    fg3.addColorStop(0, flash ? '#ffffff' : e.color);
    fg3.addColorStop(1, flash ? '#ffd0d0' : e.color2);
    c.fillStyle = fg3; c.fill();
    inkIn(c, 2.2); c.stroke();
    // 兜帽阴影露出脸
    c.beginPath();
    c.moveTo(0, -r * 0.92);
    c.lineTo(-r * 0.52, r * 0.06);
    c.lineTo(r * 0.52, r * 0.06);
    c.closePath();
    c.fillStyle = '#080c12'; c.fill();
    // 发光眼
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.fillStyle = '#fff2b0';
    c.beginPath();
    c.ellipse(-r * 0.2, -r * 0.35, r * 0.11, r * 0.07, -0.25, 0, Math.PI * 2);
    c.ellipse(r * 0.2, -r * 0.35, r * 0.11, r * 0.07, 0.25, 0, Math.PI * 2);
    c.fill();
    c.restore();
    // 手中双匕
    c.strokeStyle = '#dfe9f2'; c.lineWidth = r * 0.16; c.lineCap = 'round';
    c.beginPath(); c.moveTo(r * 0.72, r * 0.3); c.lineTo(r * 1.35, r * 0.06); c.stroke();
    c.beginPath(); c.moveTo(-r * 0.72, r * 0.3); c.lineTo(-r * 1.3, r * 0.1); c.stroke();

  } else if(e.type === 'tank'){
    // ===== 铁卫：重甲 + 盾 =====
    c.beginPath();
    rrect(c, -r * 0.92, -r * 0.62, r * 1.84, r * 1.5, r * 0.34);
    var tg = c.createLinearGradient(0, -r * 0.6, 0, r * 0.9);
    tg.addColorStop(0, flash ? '#ffffff' : '#b8cadd');
    tg.addColorStop(0.6, flash ? '#ffdede' : e.color);
    tg.addColorStop(1, flash ? '#ffb5b5' : e.color2);
    c.fillStyle = tg; c.fill();
    inkIn(c, 2.4); c.stroke();
    // 肩甲
    for(var sd = -1; sd <= 1; sd += 2){
      c.beginPath();
      c.arc(sd * r * 0.92, -r * 0.42, r * 0.42, Math.PI * 0.1, Math.PI * 1.1);
      c.fillStyle = flash ? '#ffd9d9' : '#6c8098'; c.fill();
      inkIn(c, 2); c.stroke();
    }
    // 头盔
    c.beginPath();
    c.arc(0, -r * 0.72, r * 0.62, Math.PI, Math.PI * 2);
    c.fillStyle = flash ? '#ffffff' : '#8ea4bb'; c.fill();
    inkIn(c, 2.2); c.stroke();
    c.fillStyle = '#0a1016';
    c.fillRect(-r * 0.46, -r * 0.78, r * 0.92, r * 0.19);
    c.fillStyle = '#ff5f5f';
    c.fillRect(-r * 0.3, -r * 0.75, r * 0.16, r * 0.12);
    c.fillRect(r * 0.14, -r * 0.75, r * 0.16, r * 0.12);
    // 尖顶
    c.beginPath();
    c.moveTo(0, -r * 1.62); c.lineTo(-r * 0.16, -r * 1.2); c.lineTo(r * 0.16, -r * 1.2);
    c.closePath();
    c.fillStyle = '#c8b06a'; c.fill(); inkIn(c, 1.8); c.stroke();
    // 盾
    c.save();
    c.translate(r * 0.72, r * 0.18);
    rrect(c, -r * 0.34, -r * 0.62, r * 0.68, r * 1.24, r * 0.18);
    var shg = c.createLinearGradient(-r * 0.3, 0, r * 0.3, 0);
    shg.addColorStop(0, '#4f6070');
    shg.addColorStop(1, '#2b3a48');
    c.fillStyle = shg; c.fill();
    inkIn(c, 2); c.stroke();
    c.strokeStyle = '#c8b06a'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(0, -r * 0.5); c.lineTo(0, r * 0.5); c.stroke();
    c.beginPath(); c.arc(0, 0, r * 0.2, 0, Math.PI * 2); c.stroke();
    c.restore();

  } else if(e.type === 'thrower'){
    // ===== 飞刀手：背刀袋 + 抬手投掷 =====
    c.beginPath();
    c.moveTo(-r * 0.72, r * 0.78);
    c.quadraticCurveTo(-r * 0.86, -r * 0.5, 0, -r * 0.62);
    c.quadraticCurveTo(r * 0.86, -r * 0.5, r * 0.72, r * 0.78);
    c.closePath();
    var hg2 = c.createLinearGradient(0, -r, 0, r);
    hg2.addColorStop(0, flash ? '#ffffff' : e.color);
    hg2.addColorStop(1, flash ? '#ffd0d0' : e.color2);
    c.fillStyle = hg2; c.fill();
    inkIn(c, 2.2); c.stroke();
    // 腰带
    c.fillStyle = '#123a3f';
    c.fillRect(-r * 0.74, r * 0.18, r * 1.48, r * 0.16);
    // 头 + 头巾
    c.beginPath(); c.arc(0, -r * 0.85, r * 0.44, 0, Math.PI * 2);
    c.fillStyle = flash ? '#ffe2e2' : '#f0d3ac'; c.fill();
    inkIn(c, 2); c.stroke();
    c.beginPath();
    c.arc(0, -r * 0.9, r * 0.45, Math.PI, Math.PI * 2);
    c.fillStyle = flash ? '#ffffff' : e.color2; c.fill();
    c.fillRect(-r * 0.46, -r * 0.96, r * 0.92, r * 0.12);
    inkIn(c, 1.6); c.stroke();
    c.fillStyle = '#0a1016';
    c.beginPath();
    c.ellipse(-r * 0.16, -r * 0.8, r * 0.07, r * 0.09, 0, 0, Math.PI * 2);
    c.ellipse(r * 0.16, -r * 0.8, r * 0.07, r * 0.09, 0, 0, Math.PI * 2);
    c.fill();
    // 抬起的投掷手
    c.strokeStyle = flash ? '#ffdede' : e.color2; c.lineWidth = r * 0.22; c.lineCap = 'round';
    c.beginPath(); c.moveTo(r * 0.5, r * 0.05); c.lineTo(r * 1.05, -r * 0.55); c.stroke();
    // 背上的飞刀
    for(var kn = 0; kn < 3; kn++){
      c.save();
      c.translate(-r * 0.5 + kn * r * 0.2, -r * 0.3);
      c.rotate(-0.5);
      c.fillStyle = '#cfe4ee';
      c.beginPath(); c.moveTo(0, -r * 0.34); c.lineTo(-r * 0.08, 0); c.lineTo(r * 0.08, 0); c.closePath(); c.fill();
      inkIn(c, 1.2); c.stroke();
      c.restore();
    }
    // 待发飞刀（旋转）
    var spin2 = t * 0.02 + e.wobble;
    c.save();
    c.translate(r * 1.15, -r * 0.68);
    c.rotate(spin2);
    c.fillStyle = '#eaf7ff';
    c.beginPath(); c.moveTo(0, -r * 0.42); c.lineTo(-r * 0.12, 0); c.lineTo(r * 0.12, 0); c.closePath(); c.fill();
    inkIn(c, 1.2); c.stroke();
    c.restore();

  } else if(e.guardian){
    // ===== 红/蓝 BUFF 神兽（3w 血，专属场景怪）=====
    var isRed = e.guardianType === 'redbuff';
    var ac = isRed ? '#ff6a2a' : '#6ab6ff';
    var ac2 = isRed ? '#7a1a10' : '#123a6a';
    // 元素光环
    c.save();
    c.globalCompositeOperation = 'lighter';
    var ag2 = c.createRadialGradient(0, 0, r * 0.6, 0, 0, r * 3.1);
    ag2.addColorStop(0, ac + '55');
    ag2.addColorStop(0.5, ac + '22');
    ag2.addColorStop(1, ac + '00');
    c.fillStyle = ag2;
    c.beginPath(); c.arc(0, 0, r * 3.1, 0, Math.PI * 2); c.fill();
    c.restore();
    // 四足兽身
    c.beginPath();
    c.ellipse(0, r * 0.18, r * 1.25, r * 0.92, 0, 0, Math.PI * 2);
    var bg6 = c.createLinearGradient(0, -r, 0, r);
    bg6.addColorStop(0, flash ? '#ffffff' : e.color);
    bg6.addColorStop(1, flash ? '#ffd0d0' : ac2);
    c.fillStyle = bg6; c.fill();
    inkIn(c, 2.6); c.stroke();
    // 四条腿
    c.fillStyle = ac2;
    for(var lg = -1; lg <= 1; lg += 2){
      c.beginPath();
      rrect(c, lg * r * 0.9 - r * 0.16, r * 0.7, r * 0.32, r * 0.62, r * 0.12);
      c.fill();
      c.beginPath();
      rrect(c, lg * r * 0.42 - r * 0.16, r * 0.8, r * 0.32, r * 0.55, r * 0.12);
      c.fill();
    }
    // 背脊尖刺
    c.fillStyle = ac;
    for(var sp3 = -2; sp3 <= 2; sp3++){
      c.beginPath();
      c.moveTo(sp3 * r * 0.42, -r * 0.62);
      c.lineTo(sp3 * r * 0.42 - r * 0.14, -r * (0.95 + Math.abs(sp3) * 0.05));
      c.lineTo(sp3 * r * 0.42 + r * 0.16, -r * 0.6);
      c.closePath(); c.fill();
      inkIn(c, 1.4); c.stroke();
    }
    // 头部 + 双角
    var gx2 = r * 0.9, gy2 = -r * 0.42;
    c.beginPath();
    c.ellipse(gx2, gy2, r * 0.62, r * 0.52, 0.2, 0, Math.PI * 2);
    c.fillStyle = flash ? '#ffe4e4' : e.color; c.fill();
    inkIn(c, 2.2); c.stroke();
    c.fillStyle = '#e8d6a8';
    for(var hn = -1; hn <= 1; hn += 2){
      c.beginPath();
      c.moveTo(gx2 + hn * r * 0.24, gy2 - r * 0.3);
      c.lineTo(gx2 + hn * r * 0.62, gy2 - r * 1.05);
      c.lineTo(gx2 + hn * r * 0.5, gy2 - r * 0.18);
      c.closePath(); c.fill();
      inkIn(c, 1.5); c.stroke();
    }
    // 眼睛 + 獠牙
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.fillStyle = isRed ? '#fff0a0' : '#c8f0ff';
    c.beginPath();
    c.ellipse(gx2 + r*0.12, gy2 - r*0.05, r*0.13, r*0.09, 0, 0, Math.PI * 2);
    c.ellipse(gx2 + r*0.42, gy2 - r*0.02, r*0.13, r*0.09, 0, 0, Math.PI * 2);
    c.fill();
    c.restore();
    c.fillStyle = '#fff';
    c.beginPath();
    c.moveTo(gx2 + r*0.18, gy2 + r*0.3); c.lineTo(gx2 + r*0.26, gy2 + r*0.56); c.lineTo(gx2 + r*0.34, gy2 + r*0.3);
    c.closePath(); c.fill();
    // 元素特效：火焰 / 电芒
    c.save();
    c.globalCompositeOperation = 'lighter';
    for(var fx = 0; fx < 5; fx++){
      var fa2 = t * 0.003 + fx * 1.3 + e.wobble;
      var fpx = -r * 0.9 + fx * r * 0.5;
      var fpy = -r * (0.7 + Math.abs(Math.sin(fa2)) * 0.5);
      if(isRed){
        c.fillStyle = 'rgba(255,120,40,0.55)';
        c.beginPath();
        c.moveTo(fpx - r * 0.16, -r * 0.5);
        c.quadraticCurveTo(fpx, fpy - r * 0.5, fpx + r * 0.16, -r * 0.5);
        c.closePath(); c.fill();
      } else {
        c.strokeStyle = 'rgba(150,220,255,0.8)';
        c.lineWidth = 2;
        c.beginPath();
        c.moveTo(fpx - r * 0.2, -r * 0.5);
        c.lineTo(fpx, fpy);
        c.lineTo(fpx + r * 0.2, -r * 0.55);
        c.stroke();
      }
    }
    c.restore();
  } else {
    // ===== 精英 / Boss：斗笠刀客 / 魔头（披风 + 甲 + 刀） =====
    var st2 = evolveStage(e.kills);
    var isBoss = e.type === 'boss';
    var capeLen = isBoss ? 1.0 : (e.kills >= 6 ? 0.92 : 0.78);
    var wave2 = Math.sin(t * 0.004 + e.wobble) * r * 0.2;
    // 披风
    c.beginPath();
    c.moveTo(-r * 0.5, -r * 0.7);
    c.quadraticCurveTo(-r * 1.0 * capeLen, r * 0.25, -r * 0.78 * capeLen + wave2, r * 1.02 * capeLen);
    c.quadraticCurveTo(0, r * 0.86 * capeLen, r * 0.74 * capeLen + wave2 * 0.5, r * 0.98 * capeLen);
    c.quadraticCurveTo(r * 0.72 * capeLen, r * 0.2, r * 0.5, -r * 0.7);
    c.closePath();
    var cg2 = c.createLinearGradient(0, -r * 0.6, 0, r * 1.2);
    cg2.addColorStop(0, flash ? '#ffffff' : st2.aura);
    cg2.addColorStop(1, flash ? '#ffc0c0' : '#3a0d12');
    c.fillStyle = cg2; c.fill();
    inkIn(c, 2.4); c.stroke();
    // 腿（罗裙下的战靴）
    c.fillStyle = '#241a18';
    c.beginPath();
    c.ellipse(-r * 0.22, r * 0.98, r * 0.17, r * 0.09, 0, 0, Math.PI * 2);
    c.ellipse(r * 0.22, r * 0.98, r * 0.17, r * 0.09, 0, 0, Math.PI * 2);
    c.fill();
    inkIn(c, 1.5); c.stroke();
    // 身体（束腰长袍）
    c.beginPath();
    c.moveTo(-r * 0.52, -r * 0.5);
    c.quadraticCurveTo(0, -r * 0.66, r * 0.52, -r * 0.5);
    c.lineTo(r * 0.42, r * 0.24);
    c.lineTo(r * 0.6, r * 0.96);
    c.quadraticCurveTo(0, r * 1.08, -r * 0.6, r * 0.96);
    c.lineTo(-r * 0.42, r * 0.24);
    c.closePath();
    var bg2 = c.createLinearGradient(0, -r * 0.6, 0, r);
    bg2.addColorStop(0, flash ? '#ffffff' : e.color);
    bg2.addColorStop(1, flash ? '#ffc8c8' : e.color2);
    c.fillStyle = bg2; c.fill();
    inkIn(c, 2.4); c.stroke();
    // 腰带
    c.fillStyle = '#1b1410';
    c.fillRect(-r * 0.55, r * 0.3, r * 1.1, r * 0.16);
    c.fillStyle = '#e8c46a';
    c.beginPath(); c.arc(0, r * 0.38, r * 0.12, 0, Math.PI * 2); c.fill();
    // 胸甲 / 护心镜
    c.beginPath();
    c.moveTo(-r * 0.4, -r * 0.4);
    c.lineTo(r * 0.4, -r * 0.4);
    c.lineTo(r * 0.22, r * 0.16);
    c.lineTo(-r * 0.22, r * 0.16);
    c.closePath();
    c.fillStyle = flash ? '#ffe6e6' : (isBoss ? '#7a45c8' : '#c98a3a');
    c.fill(); inkIn(c, 1.8); c.stroke();
    c.beginPath(); c.arc(0, -r * 0.12, r * 0.16, 0, Math.PI * 2);
    c.fillStyle = flash ? '#ffffff' : '#e8c46a'; c.fill();
    inkIn(c, 1.4); c.stroke();
    // 肩刺（进化后）
    if(e.kills >= 3){
      for(var sp2 = -1; sp2 <= 1; sp2 += 2){
        c.beginPath();
        c.moveTo(sp2 * r * 0.44, -r * 0.48);
        c.lineTo(sp2 * r * 0.92, -r * (e.kills >= 6 ? 0.95 : 0.78));
        c.lineTo(sp2 * r * 0.56, -r * 0.26);
        c.closePath();
        c.fillStyle = flash ? '#ffffff' : st2.accent; c.fill();
        inkIn(c, 1.6); c.stroke();
      }
    }
    // 手臂
    c.strokeStyle = flash ? '#ffd9d9' : e.color2;
    c.lineWidth = r * 0.24; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-r * 0.46, -r * 0.34); c.quadraticCurveTo(-r * 0.72, r * 0.02, -r * 0.6, r * 0.34); c.stroke();
    inkIn(c, 2.6); c.stroke();
    c.strokeStyle = flash ? '#ffd9d9' : e.color2;
    c.beginPath(); c.moveTo(r * 0.46, -r * 0.34); c.quadraticCurveTo(r * 0.74, -r * 0.1, r * 0.7, r * 0.2); c.stroke();
    inkIn(c, 2.6); c.stroke();
    // 头（斗笠下的黑影）
    var hy = -r * 0.78, hr = r * 0.42;
    c.beginPath(); c.arc(0, hy, hr, 0, Math.PI * 2);
    c.fillStyle = flash ? '#ffe4e4' : '#e8cba6'; c.fill();
    inkIn(c, 2); c.stroke();
    if(isBoss){
      // 魔头：头冠 + 双角
      c.fillStyle = flash ? '#ffffff' : '#ffd24a';
      c.beginPath();
      c.moveTo(-hr * 0.95, hy - hr * 0.5);
      c.lineTo(-hr * 0.6, hy - hr * 1.55);
      c.lineTo(0, hy - hr * 0.9);
      c.lineTo(hr * 0.6, hy - hr * 1.55);
      c.lineTo(hr * 0.95, hy - hr * 0.5);
      c.closePath(); c.fill();
      inkIn(c, 1.8); c.stroke();
      c.fillStyle = '#ff3d5a';
      c.beginPath(); c.arc(0, hy - hr * 1.0, hr * 0.18, 0, Math.PI * 2); c.fill();
      // 披风领毛
      c.fillStyle = 'rgba(20,8,26,0.85)';
      c.beginPath();
      c.ellipse(0, -r * 0.42, r * 0.72, r * 0.2, 0, 0, Math.PI * 2);
      c.fill();
    } else {
      // 刀客：斗笠
      var hg3 = c.createLinearGradient(0, hy - hr * 1.3, 0, hy + hr * 0.2);
      hg3.addColorStop(0, flash ? '#ffffff' : '#f0d28e');
      hg3.addColorStop(1, flash ? '#ffd0d0' : '#a97a34');
      c.beginPath();
      c.moveTo(-hr * 1.65, hy - hr * 0.12);
      c.quadraticCurveTo(0, hy - hr * 1.9, hr * 1.65, hy - hr * 0.12);
      c.quadraticCurveTo(0, hy + hr * 0.34, -hr * 1.65, hy - hr * 0.12);
      c.closePath();
      c.fillStyle = hg3; c.fill();
      inkIn(c, 2); c.stroke();
      c.strokeStyle = 'rgba(60,40,20,0.6)'; c.lineWidth = 1.6;
      c.beginPath(); c.moveTo(-hr * 1.0, hy - hr * 0.34); c.lineTo(hr * 1.0, hy - hr * 0.34); c.stroke();
      // 笠下的阴影（看不见脸，只有凶光）
      c.fillStyle = 'rgba(6,10,16,0.92)';
      c.beginPath();
      c.ellipse(0, hy + hr * 0.14, hr * 0.9, hr * 0.52, 0, 0, Math.PI * 2);
      c.fill();
    }
    // 凶眼（发光）
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.fillStyle = isBoss ? '#ff7ad0' : '#ff6a4a';
    c.beginPath();
    c.ellipse(-hr * 0.34, hy + hr * 0.14, hr * 0.17, hr * 0.1, -0.2, 0, Math.PI * 2);
    c.ellipse(hr * 0.34, hy + hr * 0.14, hr * 0.17, hr * 0.1, 0.2, 0, Math.PI * 2);
    c.fill();
    c.restore();
    // 手中长刀
    c.save();
    c.translate(r * 0.62, r * 0.06);
    c.rotate(-0.5);
    c.fillStyle = flash ? '#ffffff' : '#e6f0f8';
    c.beginPath();
    c.moveTo(0, -r * 1.45); c.lineTo(r * 0.13, -r * 0.2); c.lineTo(-r * 0.08, r * 0.34); c.lineTo(-r * 0.15, -r * 0.2);
    c.closePath(); c.fill();
    inkIn(c, 1.7); c.stroke();
    c.fillStyle = '#c8a24a';
    c.fillRect(-r * 0.2, r * 0.3, r * 0.4, r * 0.12);
    c.restore();
  }
  c.restore();

  // 名字牌 + 血条
  if(e.tier >= 1){
    var st3 = evolveStage(e.kills);
    var bw2 = Math.max(r * 2.6, 54);
    var by2 = y - r * (e.type === 'boss' ? 2.1 : 1.75);
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.font = '900 11px "PingFang SC",sans-serif';
    c.lineWidth = 3;
    c.strokeStyle = 'rgba(3,7,12,0.9)';
    var plate = e.name + (e.kills > 0 ? ' ×' + e.kills : '');
    c.strokeText(plate, x, by2 - 9);
    c.fillStyle = st3.accent;
    c.fillText(plate, x, by2 - 9);
    c.fillStyle = 'rgba(4,9,14,0.75)';
    c.fillRect(x - bw2 / 2 - 1, by2 - 2, bw2 + 2, 5);
    var hpR2 = Math.max(0, e.hp / e.maxHp);
    var hpc = hpR2 > 0.5 ? '#ff8a4a' : hpR2 > 0.25 ? '#ffb24a' : '#ff4d5e';
    c.fillStyle = hpc;
    c.fillRect(x - bw2 / 2, by2 - 1, bw2 * hpR2, 3);
  } else if(e.hp < e.maxHp){
    var bw3 = Math.max(r * 2.2, 26);
    c.fillStyle = 'rgba(0,0,0,0.65)';
    c.fillRect(x - bw3 / 2 - 1, y - r - 10, bw3 + 2, 5);
    var hpR3 = Math.max(0, e.hp / e.maxHp);
    c.fillStyle = hpR3 > 0.5 ? '#6fd88a' : hpR3 > 0.25 ? '#ffc04a' : '#ff5a5a';
    c.fillRect(x - bw3 / 2, y - r - 9, bw3 * hpR3, 3);
  }

  // 警觉标记（正在追杀玩家）
  if(e.targetPlayer && e.mode === 'hunt' && e.tier >= 1){
    c.textAlign = 'center';
    c.font = '900 14px sans-serif';
    c.fillStyle = '#ff5a5a';
    c.fillText('!', x + e.radius * 1.2, y - e.radius - 14);
  }

  // 飞刀手蓄力预警：虚线瞄准线 + 准星（给玩家闪避时间）
  if(e.aiType === 'ranged' && e.throwCd > 0 && e.throwCd < 30){
    var pxs = player.x + (x - e.x), pys = player.y + (y - e.y);
    var aimD = dist(e.x, e.y, player.x, player.y);
    if(aimD < 440){
      var k2 = 1 - e.throwCd / 30;
      var ax2 = x + (pxs - x) * 0.14, ay2 = y + (pys - y) * 0.14;
      var bx2 = x + (pxs - x) * 0.94, by2 = y + (pys - y) * 0.94;
      c.save();
      c.globalAlpha = (0.24 + k2 * 0.5) * clamp(1.25 - aimD / 440, 0.45, 1);
      c.strokeStyle = '#7ff0e0';
      c.lineWidth = 1.6 + k2 * 1.8;
      c.setLineDash([7, 7]);
      c.lineDashOffset = -time * 0.05;
      c.beginPath(); c.moveTo(ax2, ay2); c.lineTo(bx2, by2); c.stroke();
      c.setLineDash([]);
      c.globalAlpha = 0.45 + k2 * 0.5;
      c.beginPath(); c.arc(bx2, by2, 9 + k2 * 6, 0, Math.PI * 2); c.stroke();
      c.restore();
    }
  }
}

/* 风暴墙：圈外紫雾 + 圈边能量墙 */
function drawStormOverlay(ox, oy){
  if(!storm || !settings.stormEnabled) return;
  var sx = storm.cx + ox, sy = storm.cy + oy;
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  ctx.arc(sx, sy, Math.max(10, storm.r), 0, Math.PI * 2);
  var pulse = 0.19 + Math.sin(time * 0.002) * 0.035;
  ctx.fillStyle = 'rgba(92,52,196,' + pulse.toFixed(3) + ')';
  ctx.fill('evenodd');
  ctx.restore();
}
function drawStormWall(ox, oy){
  if(!storm || !settings.stormEnabled) return;
  var sx = storm.cx + ox, sy = storm.cy + oy, R = storm.r;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  // 能量墙（多层同心描边 + 呼吸）
  var br = 1 + Math.sin(time * 0.003) * 0.02;
  for(var l = 0; l < 3; l++){
    ctx.globalAlpha = 0.30 - l * 0.08;
    ctx.strokeStyle = l === 0 ? '#d9b6ff' : l === 1 ? '#a06bff' : '#6a3fd6';
    ctx.lineWidth = (5 - l * 1.2) * br;
    ctx.beginPath();
    ctx.arc(sx, sy, R, 0, Math.PI * 2);
    ctx.stroke();
  }
  // 断续符文（沿圈旋转）
  var segN = 72;
  for(var i = 0; i < segN; i++){
    var a = (i / segN) * Math.PI * 2 + time * 0.00018;
    var hh = Math.sin(i * 12.9898 + Math.floor(time * 0.002) * 3.7) * 43758.5453;
    var f = hh - Math.floor(hh);
    if(f < 0.55) continue;
    var ax = sx + Math.cos(a) * R, ay = sy + Math.sin(a) * R;
    ctx.globalAlpha = 0.20 + f * 0.45;
    ctx.strokeStyle = '#e6d2ff';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax + Math.cos(a + 1.57) * 10, ay + Math.sin(a + 1.57) * 10);
    ctx.stroke();
  }
  // 向内吸入的粒子
  for(var p = 0; p < 26; p++){
    var ph2 = (time * 0.00022 + p * 0.037) % 1;
    var pa = p * 2.4 + time * 0.0004;
    var pr2 = R * (1.25 - ph2 * 0.28);
    var px2 = sx + Math.cos(pa) * pr2, py2 = sy + Math.sin(pa) * pr2;
    ctx.globalAlpha = (1 - ph2) * 0.5;
    ctx.fillStyle = '#c8a2ff';
    ctx.beginPath();
    ctx.arc(px2, py2, 1.8, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* 小地图：安全区 + 敌人分布（绝地求生的"求生"信息层） */
function drawMinimap(){
  var size = (W < 620 || H < 520) ? 96 : 126;
  var pad = 14;
  var mx = W - size - pad, my = H - size - pad - (H < 560 ? 84 : 104);
  var R = Math.max(1200, settings.mapRadius) * 1.06;
  var scale = size / (R * 2);
  var cx0 = mx + size / 2, cy0 = my + size / 2;
  var wx = function(x){ return cx0 + x * scale; };
  var wy = function(y){ return cy0 + y * scale; };

  ctx.save();
  rrect(ctx, mx, my, size, size, 12);
  ctx.fillStyle = 'rgba(6,14,22,0.88)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(90,150,180,0.55)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.clip();

  // 圈外区域（紫色）
  if(settings.stormEnabled && storm){
    ctx.save();
    ctx.beginPath();
    ctx.rect(mx, my, size, size);
    ctx.arc(wx(storm.cx), wy(storm.cy), Math.max(2, storm.r * scale), 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(140,80,240,0.28)';
    ctx.fill('evenodd');
    ctx.restore();
    ctx.beginPath();
    ctx.arc(wx(storm.cx), wy(storm.cy), Math.max(2, storm.r * scale), 0, Math.PI * 2);
    ctx.strokeStyle = '#c8a2ff';
    ctx.lineWidth = 2;
    ctx.stroke();
    // 下一个圈（收缩目标）
    ctx.beginPath();
    ctx.arc(wx(storm.cx), wy(storm.cy), Math.max(2, storm.targetR * scale), 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(200,162,255,0.45)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  // 地图边界
  ctx.strokeStyle = 'rgba(120,180,210,0.35)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(cx0, cy0, settings.mapRadius * scale, 0, Math.PI * 2);
  ctx.stroke();

  // 经验（只画附近的，避免糊成一团）
  ctx.fillStyle = 'rgba(120,240,210,0.7)';
  for(var gi = 0; gi < xpGems.length; gi += 3){
    var gg = xpGems[gi];
    ctx.fillRect(wx(gg.x) - 1, wy(gg.y) - 1, 2, 2);
  }
  // 空投箱
  for(var adi2 = 0; adi2 < airDrops.length; adi2++){
    var ad2 = airDrops[adi2];
    if(ad2.opened) continue;
    var px4 = wx(ad2.x), py4 = wy(ad2.y);
    ctx.fillStyle = '#ffd27a';
    ctx.beginPath(); ctx.arc(px4, py4, 4.2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#5a4a2a'; ctx.lineWidth = 1; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,210,120,0.6)';
    ctx.beginPath(); ctx.arc(px4, py4, 7 + Math.sin(time * 0.006) * 1.6, 0, Math.PI * 2); ctx.stroke();
  }
  // 红/蓝 BUFF
  for(var gi2 = 0; gi2 < guardians.length; gi2++){
    var gd = guardians[gi2];
    if(gd.dead) continue;
    var gpx = wx(gd.x), gpy = wy(gd.y);
    ctx.fillStyle = gd.guardianType === 'redbuff' ? '#ff6a3c' : '#6ab6ff';
    ctx.beginPath();
    ctx.moveTo(gpx, gpy - 4.6); ctx.lineTo(gpx + 4.6, gpy); ctx.lineTo(gpx, gpy + 4.6); ctx.lineTo(gpx - 4.6, gpy);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1; ctx.stroke();
  }
  // 敌人：精英是重点（100 个红点 = 竞争者分布）
  for(var ei = 0; ei < enemies.length; ei++){
    var en = enemies[ei];
    if(en.dead) continue;
    if(en.guardian) continue;
    var ex = wx(en.x), ey = wy(en.y);
    if(ex < mx - 4 || ex > mx + size + 4 || ey < my - 4 || ey > my + size + 4) continue;
    if(en.tier === 0){
      ctx.fillStyle = 'rgba(150,220,140,0.5)';
      ctx.fillRect(ex - 1, ey - 1, 2, 2);
    }
    else {
      var st4 = evolveStage(en.kills);
      ctx.fillStyle = st4.aura;
      ctx.beginPath(); ctx.arc(ex, ey, 2.6 + Math.min(2, en.kills / 12), 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 0.8; ctx.stroke();
    }
  }
  // 运输机
  for(var pl2 = 0; pl2 < planes.length; pl2++){
    var pln = planes[pl2];
    var ppx = wx(pln.x), ppy = wy(pln.y);
    ctx.strokeStyle = '#ffd27a'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(ppx - 4, ppy); ctx.lineTo(ppx + 4, ppy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ppx, ppy - 3); ctx.lineTo(ppx, ppy + 3); ctx.stroke();
  }
  // 玩家
  var ppx2 = wx(player.x), ppy2 = wy(player.y);
  ctx.fillStyle = '#7fe9ff';
  ctx.beginPath();
  ctx.arc(ppx2, ppy2, 3.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.restore();

  // 提示
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '900 10px "PingFang SC",sans-serif';
  if(player.stormed){
    ctx.fillStyle = '#ffb0b0';
    ctx.fillText('圈外掉血', mx + size / 2, my - 8);
  } else {
    ctx.fillStyle = '#c8a2ff';
    ctx.fillText('存活精英 ' + aliveElites + ' · 第' + zonePhase + '圈', mx + size / 2, my - 8);
  }
}

function render(){
  var cx = camera.x + shake.x, cy = camera.y + shake.y;
  var ox = W / 2 - cx, oy = H / 2 - cy;

  // ===== 夜色战场地面 =====
  var gGrad = ctx.createLinearGradient(0, 0, 0, H);
  gGrad.addColorStop(0, PAL.ground1);
  gGrad.addColorStop(0.45, PAL.ground0);
  gGrad.addColorStop(1, PAL.ground2);
  ctx.fillStyle = gGrad;
  ctx.fillRect(0, 0, W, H);

  var pcx0 = player.x + ox, pcy0 = player.y + oy;
  var beamCol = selectedHero.aura;

  // 月光（屏幕空间的大柔光，给地面一点冷色月光）
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  var moon = ctx.createRadialGradient(W * 0.24, H * 0.10, 20, W * 0.24, H * 0.10, Math.max(W, H) * 0.85);
  moon.addColorStop(0, 'rgba(150,205,255,0.16)');
  moon.addColorStop(0.35, 'rgba(110,170,230,0.06)');
  moon.addColorStop(1, 'rgba(80,130,190,0)');
  ctx.fillStyle = moon;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // 地面斑块：程序化草地/泥地色块（去除纯色平面感）
  var patch = 236;
  var pStartX = Math.floor((cx - W/2 - patch) / patch) * patch;
  var pStartY = Math.floor((cy - H/2 - patch) / patch) * patch;
  for(var bx = pStartX; bx < cx + W/2 + patch; bx += patch){
    for(var by = pStartY; by < cy + H/2 + patch; by += patch){
      var h1 = (((bx * 374761393) ^ (by * 668265263) ^ groundSeed) >>> 0);
      var r1 = (h1 % 1000) / 1000;
      if(r1 < 0.72){
        var px1 = bx + (h1 % 200) + ox, py1 = by + ((h1 >> 7) % 200) + oy;
        var rr1 = 90 + r1 * 150;
        ctx.fillStyle = r1 < 0.36 ? 'rgba(52,116,86,0.22)' : 'rgba(10,28,40,0.26)';
        ctx.beginPath();
        ctx.ellipse(px1, py1, rr1, rr1 * 0.66, r1 * 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // 地面网格（很淡，暗示战场丈量）
  var gridSize = 96;
  var startX = Math.floor((cx - W/2) / gridSize) * gridSize;
  var startY = Math.floor((cy - H/2) / gridSize) * gridSize;
  var endX = cx + W/2 + gridSize, endY = cy + H/2 + gridSize;
  ctx.strokeStyle = 'rgba(120,200,220,0.045)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(var gx = startX; gx < endX; gx += gridSize){ ctx.moveTo(gx + ox, 0); ctx.lineTo(gx + ox, H); }
  for(var gy = startY; gy < endY; gy += gridSize){ ctx.moveTo(0, gy + oy); ctx.lineTo(W, gy + oy); }
  ctx.stroke();

  // 草叶（随镜头滚动 + 随风摆动，制造"割草"的草原质感）
  var tuft = 58;
  var tStartX = Math.floor((cx - W/2 - tuft) / tuft) * tuft;
  var tStartY = Math.floor((cy - H/2 - tuft) / tuft) * tuft;
  ctx.lineCap = 'round';
  for(var tx2 = tStartX; tx2 < cx + W/2 + tuft; tx2 += tuft){
    for(var ty2 = tStartY; ty2 < cy + H/2 + tuft; ty2 += tuft){
      var hh = (((tx2 * 73856093) ^ (ty2 * 19349663) ^ (groundSeed * 7)) >>> 0);
      var rf = (hh % 1000) / 1000;
      if(rf > 0.62) continue;
      var gx2 = tx2 + (hh % 90) + ox, gy2 = ty2 + ((hh >> 9) % 90) + oy;
      var sw = Math.sin(time * 0.0022 + (hh % 100) * 0.7) * 3.2;
      var tall = 7 + rf * 11;
      ctx.strokeStyle = rf < 0.16 ? 'rgba(96,178,124,0.62)' : rf < 0.4 ? 'rgba(64,140,102,0.55)' : 'rgba(44,104,80,0.46)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(gx2, gy2);
      ctx.quadraticCurveTo(gx2 + sw * 0.35, gy2 - tall * 0.6, gx2 + sw, gy2 - tall);
      ctx.moveTo(gx2 + 4, gy2);
      ctx.quadraticCurveTo(gx2 + 4 + sw * 0.5, gy2 - tall * 0.5, gx2 + 4 + sw * 1.15, gy2 - tall * 0.78);
      ctx.moveTo(gx2 - 4, gy2);
      ctx.quadraticCurveTo(gx2 - 4 + sw * 0.28, gy2 - tall * 0.45, gx2 - 4 + sw * 0.75, gy2 - tall * 0.66);
      ctx.stroke();
      if(rf < 0.035){
        ctx.fillStyle = '#ff8fb8';
        ctx.beginPath(); ctx.arc(gx2 + sw, gy2 - tall - 1, 2, 0, Math.PI*2); ctx.fill();
      }
    }
  }

  // 碎石
  for(var sx2 = startX; sx2 < endX; sx2 += 137){
    for(var sy2 = startY; sy2 < endY; sy2 += 131){
      var hs = (((sx2 * 2654435761) ^ (sy2 * 40503) ^ groundSeed) >>> 0);
      var rs = (hs % 1000) / 1000;
      if(rs > 0.32) continue;
      ctx.fillStyle = 'rgba(96,118,132,0.35)';
      ctx.beginPath();
      ctx.ellipse(sx2 + (hs % 130) + ox, sy2 + ((hs >> 8) % 130) + oy, 1.6 + rs * 3, 1.1 + rs * 2, rs * 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 战场残留（血迹 / 焦痕，慢慢变淡）
  for(var di2 = 0; di2 < decals.length; di2++){
    var dc = decals[di2];
    var dx2 = dc.x + ox, dy2 = dc.y + oy;
    if(dx2 < -80 || dx2 > W + 80 || dy2 < -80 || dy2 > H + 80) continue;
    ctx.globalAlpha = dc.a * Math.max(0, Math.min(1, dc.life));
    ctx.fillStyle = dc.color;
    ctx.beginPath();
    ctx.ellipse(dx2, dy2, dc.r * 1.25, dc.r * 0.7, dc.x * 0.01, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(dx2 + dc.r * 0.5, dy2 - dc.r * 0.2, dc.r * 0.5, dc.r * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 环境光尘（金/青双色，呼吸闪烁）
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(var i = 0; i < motes.length; i++){
    var mt = motes[i];
    var fl = 0.5 + Math.sin(mt.tw) * 0.5;
    ctx.globalAlpha = mt.a * fl;
    var col = mt.hue < 0.5 ? '255,232,150' : '170,235,255';
    ctx.beginPath();
    ctx.arc(mt.x, mt.y, mt.r * 2.6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(' + col + ',0.25)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(mt.x, mt.y, mt.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(' + col + ',1)';
    ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  // 地物（石灯 / 篝火 / 战旗 / 残柱…）—— 按 y 排序模拟前后遮挡
  var visibleScenery = [];
  for(var si = 0; si < scenery.length; si++){
    var sc = scenery[si];
    var sxp = sc.x + ox, syp = sc.y + oy;
    var pad2 = sc.type === 'runestone' ? 220 : 140;
    if(sxp > -pad2 && sxp < W + pad2 && syp > -pad2 && syp < H + pad2){
      visibleScenery.push({ sc: sc, x: sxp, y: syp });
    }
  }
  visibleScenery.sort(function(a,b){ return a.y - b.y; });
  for(var vi = 0; vi < visibleScenery.length; vi++){
    drawScenery(ctx, visibleScenery[vi].sc, visibleScenery[vi].x, visibleScenery[vi].y, time);
  }

  // 夜雾（几层缓慢漂移的薄雾，压出纵深）
  ctx.save();
  for(var mi2 = 0; mi2 < mountains.length; mi2++){
    var fg2 = mountains[mi2];
    var fxp = ((fg2.x * (W + 800)) - cx * (0.06 + mi2 * 0.03) + time * fg2.spd * 0.06) % (W + 800);
    if(fxp < -400) fxp += W + 800;
    var fyp = fg2.y * H + Math.sin(time * 0.0004 + mi2) * 22;
    var fgd = ctx.createRadialGradient(fxp, fyp, 0, fxp, fyp, fg2.r);
    fgd.addColorStop(0, 'rgba(150,195,225,' + fg2.a + ')');
    fgd.addColorStop(1, 'rgba(150,195,225,0)');
    ctx.fillStyle = fgd;
    ctx.beginPath();
    ctx.ellipse(fxp, fyp, fg2.r, fg2.r * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  if(screenFlash > 0.01){
    ctx.fillStyle = 'rgba(255,247,194,' + screenFlash * 0.28 + ')';
    ctx.fillRect(0, 0, W, H);
  }

  // ===== 空投箱（20w 血，双方抢）+ 运输机 =====
  for(var adi = 0; adi < airDrops.length; adi++){
    var ad = airDrops[adi];
    var ax = ad.x + ox, ay = ad.y + oy;
    if(ax < -200 || ax > W + 200 || ay < -300 || ay > H + 200) continue;
    if(ad.fall > 0) ay -= ad.fall * 320;
    if(ad.opened){
      ctx.fillStyle = '#3a2a18';
      ctx.fillRect(ax - 18, ay - 12, 36, 20);
      ctx.strokeStyle = PAL.ink; ctx.lineWidth = 2; ctx.strokeRect(ax - 18, ay - 12, 36, 20);
      continue;
    }
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var ab = ctx.createLinearGradient(ax, ay - 300, ax, ay + 8);
    ab.addColorStop(0, 'rgba(255,210,120,0)');
    ab.addColorStop(0.55, 'rgba(255,210,120,0.22)');
    ab.addColorStop(1, 'rgba(255,180,80,0.42)');
    ctx.fillStyle = ab;
    ctx.beginPath();
    ctx.moveTo(ax - 26, ay - 300); ctx.lineTo(ax + 26, ay - 300);
    ctx.lineTo(ax + 12, ay + 8); ctx.lineTo(ax - 12, ay + 8);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    if(ad.fall <= 0){
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = '#02070c';
      ctx.beginPath(); ctx.ellipse(ax, ay + 16, 26, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    var adf = ad.hitFlash > 0;
    ctx.fillStyle = adf ? '#fff3d0' : '#5a4a2a';
    ctx.beginPath();
    rrect(ctx, ax - 22, ay - 14, 44, 28, 5);
    ctx.fill();
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = 2.4; ctx.stroke();
    ctx.fillStyle = adf ? '#ffffff' : '#8a6b32';
    ctx.fillRect(ax - 22, ay - 5, 44, 4);
    ctx.fillStyle = '#ffd27a';
    ctx.beginPath(); ctx.arc(ax, ay - 7, 4.6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = 1.4; ctx.stroke();
    var aw2 = 54, ahp = Math.max(0, ad.hp / ad.maxHp);
    ctx.fillStyle = 'rgba(4,9,14,0.8)';
    ctx.fillRect(ax - aw2 / 2 - 1, ay - 34, aw2 + 2, 6);
    ctx.fillStyle = ahp > 0.5 ? '#ffb24a' : ahp > 0.2 ? '#ff8a4a' : '#ff5a5a';
    ctx.fillRect(ax - aw2 / 2, ay - 33, aw2 * ahp, 4);
    ctx.textAlign = 'center';
    ctx.font = '900 11px "PingFang SC",sans-serif';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(3,7,12,0.9)';
    var adLabel = '空投补给 ' + Math.max(0, Math.round(ad.hp / 1000)) + 'k';
    ctx.strokeText(adLabel, ax, ay - 42);
    ctx.fillStyle = '#ffd27a';
    ctx.fillText(adLabel, ax, ay - 42);
  }
  // 运输机（高空飞过）
  for(var pli = 0; pli < planes.length; pli++){
    var pl = planes[pli];
    var px3 = pl.x + ox, py3 = pl.y + oy;
    if(px3 < -400 || px3 > W + 400 || py3 < -400 || py3 > H + 400) continue;
    var ang2 = Math.atan2(pl.vy, pl.vx);
    ctx.save();
    ctx.translate(px3, py3);
    ctx.rotate(ang2);
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = '#02070c';
    ctx.beginPath(); ctx.ellipse(46, 52, 34, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#26333d';
    ctx.beginPath();
    ctx.moveTo(-34, 0); ctx.lineTo(10, -7); ctx.lineTo(34, 0); ctx.lineTo(10, 7);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(-22, -34); ctx.lineTo(4, -30); ctx.lineTo(10, 0); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(-22, 34); ctx.lineTo(4, 30); ctx.lineTo(10, 0); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-30, 0); ctx.lineTo(-40, -14); ctx.lineTo(-24, -12); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.fillStyle = (Math.floor(time * 0.006) % 2) ? '#ff5a5a' : '#7fff9a';
    ctx.beginPath(); ctx.arc(px3 + 8, py3 + 2, 2.4, 0, Math.PI * 2); ctx.fill();
  }

  // 经验宝石
  for(var i = 0; i < xpGems.length; i++){
    var g = xpGems[i];
    var gx = g.x + ox, gy = g.y + oy;
    var pulse = 1 + Math.sin(g.phase) * 0.15;
    var gr = g.radius * pulse;

    ctx.beginPath();
    ctx.arc(gx, gy, gr * 3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(116,255,223,0.11)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(gx, gy, gr * 1.8, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(116,255,223,0.22)';
    ctx.fill();

    var gemGrad = ctx.createRadialGradient(gx - gr*0.3, gy - gr*0.3, 0, gx, gy, gr);
    gemGrad.addColorStop(0, '#f0fff0');
    gemGrad.addColorStop(0.5, '#65e0c6');
    gemGrad.addColorStop(1, '#187d7b');
    ctx.beginPath();
    ctx.arc(gx, gy, gr, 0, Math.PI * 2);
    ctx.fillStyle = gemGrad;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(gx - gr*0.3, gy - gr*0.3, gr*0.35, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fill();
  }

  // 道具（升级/精英掉落）
  for(var i = 0; i < items.length; i++){
    var it = items[i];
    var ico = it.gear || it.item;
    var ix = it.x + ox, iy = it.y + oy + Math.sin(it.phase) * 3;
    var ir = it.gear ? it.radius * (1.15 + Math.sin(it.phase * 1.6) * 0.08) : it.radius;
    if(it.gear){
      // 稀有道具光柱（远处也能看见）
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var beam2 = ctx.createLinearGradient(ix, iy - 190, ix, iy + 10);
      beam2.addColorStop(0, ico.color + '00');
      beam2.addColorStop(0.6, ico.color + '33');
      beam2.addColorStop(1, ico.color + '00');
      ctx.fillStyle = beam2;
      ctx.beginPath();
      ctx.moveTo(ix - 16, iy - 190); ctx.lineTo(ix + 16, iy - 190);
      ctx.lineTo(ix + 7, iy + 10); ctx.lineTo(ix - 7, iy + 10);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    // 光晕
    ctx.beginPath();
    ctx.arc(ix, iy, ir * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = ico.color + '22';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(ix, iy, ir * 1.6, 0, Math.PI * 2);
    ctx.fillStyle = ico.color + '44';
    ctx.fill();
    // 道具框
    ctx.beginPath();
    ctx.arc(ix, iy, ir, 0, Math.PI * 2);
    var ig = ctx.createRadialGradient(ix - ir*0.3, iy - ir*0.3, 0, ix, iy, ir);
    ig.addColorStop(0, '#ffffff');
    ig.addColorStop(0.4, ico.color);
    ig.addColorStop(1, '#1a1a1a');
    ctx.fillStyle = ig;
    ctx.fill();
    ctx.strokeStyle = ico.color;
    ctx.lineWidth = 2;
    ctx.stroke();
    // 图标
    ctx.font = (it.gear ? 'bold 17px ' : 'bold 14px ') + 'sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ico.icon, ix, iy + 1);
    // 名字（小）
    ctx.font = 'bold ' + (it.gear ? 11 : 9) + 'px "PingFang SC",sans-serif';
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = 'rgba(0,0,0,0.8)';
    ctx.lineWidth = 2;
    ctx.strokeText(ico.name, ix, iy + ir + 9);
    ctx.fillText(ico.name, ix, iy + ir + 9);
  }

  // 扩散圆环
  for(var i = 0; i < rings.length; i++){
    var r = rings[i];
    ctx.beginPath();
    ctx.arc(r.x + ox, r.y + oy, r.r, 0, Math.PI * 2);
    ctx.globalAlpha = r.life * .7;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 3 * r.life;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // 屏幕冲击波（加亮混合，暴击/击杀时大环扩散）
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(var i = 0; i < shockwaves.length; i++){
    var sw = shockwaves[i];
    var swx = sw.x + ox, swy = sw.y + oy;
    // 主环
    ctx.globalAlpha = sw.life * 0.8;
    ctx.beginPath();
    ctx.arc(swx, swy, sw.r, 0, Math.PI * 2);
    ctx.strokeStyle = sw.color;
    ctx.lineWidth = (sw.w || 3) * sw.life;
    ctx.stroke();
    // 内柔光环
    ctx.globalAlpha = sw.life * 0.3;
    ctx.beginPath();
    ctx.arc(swx, swy, sw.r * 0.92, 0, Math.PI * 2);
    ctx.strokeStyle = sw.color;
    ctx.lineWidth = (sw.w || 3) * sw.life * 2.2;
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  // 敌人
  for(var i = 0; i < enemies.length; i++){
    var e = enemies[i];
    if(e.dead) continue;
    drawEnemyFigure(ctx, e, e.x + ox, e.y + oy, time);
  }

  // 精英/Boss 刀刃（绘制在敌人之上、玩家刀刃之下）
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(var i = 0; i < enemies.length; i++){
    var e = enemies[i];
    if(e.dead || e.blades <= 0) continue;
    var ex = e.x + ox, ey = e.y + oy;
    var stB = evolveStage(e.kills);
    var isB = e.type === 'boss';
    for(var bi = 0; bi < e.blades; bi++){
      var a = e.bladeAngle + (Math.PI*2/e.blades)*bi;
      var ox2 = Math.cos(a) * (e.bladeOrbit - e.bladeLen);
      var oy2 = Math.sin(a) * (e.bladeOrbit - e.bladeLen);
      var tx = Math.cos(a) * e.bladeOrbit;
      var ty = Math.sin(a) * e.bladeOrbit;
      // 光晕
      ctx.strokeStyle = (isB ? 'rgba(200,107,255,0.30)' : 'rgba(255,120,80,0.26)');
      ctx.lineWidth = e.radius * 0.35;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(ex + ox2, ey + oy2);
      ctx.lineTo(ex + tx, ey + ty);
      ctx.stroke();
      // 刀身
      var eg = ctx.createLinearGradient(ex+ox2, ey+oy2, ex+tx, ey+ty);
      eg.addColorStop(0, isB ? '#c86bff' : stB.aura);
      eg.addColorStop(0.5, '#ffffff');
      eg.addColorStop(1, isB ? '#7a3fd6' : stB.aura);
      ctx.strokeStyle = eg;
      ctx.lineWidth = e.radius * 0.14;
      ctx.beginPath();
      ctx.moveTo(ex + ox2, ey + oy2);
      ctx.lineTo(ex + tx, ey + ty);
      ctx.stroke();
    }
    // 枢纽
    ctx.beginPath();
    ctx.arc(ex, ey, e.radius*0.25, 0, Math.PI*2);
    ctx.fillStyle = isB ? 'rgba(200,107,255,0.65)' : 'rgba(255,140,80,0.6)';
    ctx.fill();
  }
  ctx.restore();

  // ===== 敌方飞刀（必须一眼看见：发光 + 拖尾 + 旋转刀身）=====
  for(var pj = 0; pj < projectiles.length; pj++){
    var p = projectiles[pj];
    var qx = p.x + ox, qy = p.y + oy;
    var spd2 = Math.hypot(p.vx, p.vy) || 1;
    var ux = p.vx / spd2, uy = p.vy / spd2;

    // 地面投影
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#04121a';
    ctx.beginPath();
    ctx.ellipse(qx, qy + p.r * 0.9, p.r * 1.1, p.r * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // 飞行拖尾（三层由粗到细）
    for(var tl = 0; tl < 3; tl++){
      var back = 10 + tl * 13;
      ctx.globalAlpha = 0.30 - tl * 0.08;
      ctx.strokeStyle = tl === 0 ? '#bff8ff' : '#5ce0d0';
      ctx.lineWidth = (9 - tl * 2.4);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(qx - ux * back, qy - uy * back);
      ctx.lineTo(qx, qy);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // 外发光
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var pg = ctx.createRadialGradient(qx, qy, 1, qx, qy, p.r * 3.4);
    pg.addColorStop(0, 'rgba(190,250,255,0.85)');
    pg.addColorStop(0.4, 'rgba(92,224,208,0.35)');
    pg.addColorStop(1, 'rgba(92,224,208,0)');
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.arc(qx, qy, p.r * 3.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 旋转的三叶飞刀
    ctx.save();
    ctx.translate(qx, qy);
    ctx.rotate(p.spin);
    for(var bl = 0; bl < 3; bl++){
      ctx.save();
      ctx.rotate(bl * Math.PI * 2 / 3);
      ctx.beginPath();
      ctx.moveTo(0, -p.r * 2.1);
      ctx.lineTo(p.r * 0.62, -p.r * 0.15);
      ctx.lineTo(0, p.r * 0.35);
      ctx.lineTo(-p.r * 0.6, -p.r * 0.18);
      ctx.closePath();
      var bg5 = ctx.createLinearGradient(0, -p.r * 2.1, 0, p.r * 0.35);
      bg5.addColorStop(0, '#ffffff');
      bg5.addColorStop(0.55, '#c8f4ff');
      bg5.addColorStop(1, '#3fa8b8');
      ctx.fillStyle = bg5;
      ctx.fill();
      ctx.strokeStyle = '#052029';
      ctx.lineWidth = 1.2;
      ctx.lineJoin = 'round';
      ctx.stroke();
      ctx.restore();
    }
    ctx.beginPath();
    ctx.arc(0, 0, p.r * 0.42, 0, Math.PI * 2);
    ctx.fillStyle = '#0d3b45';
    ctx.fill();
    ctx.strokeStyle = '#e8fbff';
    ctx.lineWidth = 1.3;
    ctx.stroke();
    ctx.restore();
  }

  // 玩家
  var px = player.x + ox, py = player.y + oy;
  var pr = player.radius;

  ctx.beginPath();
  ctx.ellipse(px, py + pr * 0.85, pr * 1.15, pr * 0.42, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fill();

  // 多层能量光环
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  // 外层大光晕（英雄气质色）
  var auraCol = selectedHero.aura;
  var pulseR = pr * (2.4 + Math.sin(time * 0.006) * 0.18);
  var pGlow = ctx.createRadialGradient(px, py, pr, px, py, pulseR * 2.2);
  pGlow.addColorStop(0, auraCol + '55');
  pGlow.addColorStop(0.5, auraCol + '22');
