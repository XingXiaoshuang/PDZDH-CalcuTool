<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>转刀割草 · 绝地求生</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a18;font-family:'Segoe UI',Roboto,'PingFang SC',sans-serif;touch-action:none;}

canvas{display:block;position:fixed;top:0;left:0;}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;}

/* ---- HUD ---- */
#hud{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;}
#hpBar{width:150px;height:18px;background:rgba(255,255,255,.08);border-radius:9px;overflow:hidden;border:1px solid rgba(255,255,255,.18);position:relative;box-shadow:0 2px 8px rgba(0,0,0,.3);}
#hpFill{width:100%;height:100%;background:linear-gradient(90deg,#ff2d55,#ff6b81,#ff9a9e);border-radius:9px;transition:width .12s;box-shadow:0 0 12px rgba(255,45,85,.6);}
#hpText{position:absolute;top:0;left:0;width:150px;height:18px;line-height:18px;text-align:center;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);letter-spacing:.5px;}
#waveInfo{text-align:right;color:#fff;font-size:15px;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.7);line-height:1.2;}
#waveInfo small{display:block;font-size:11px;font-weight:600;opacity:.75;margin-top:2px;}

#xpBarWrap{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));left:12px;right:12px;height:10px;background:rgba(255,255,255,.06);border-radius:5px;overflow:hidden;border:1px solid rgba(255,255,255,.1);}
#xpFill{width:0%;height:100%;background:linear-gradient(90deg,#00d2ff,#3a7bd5,#00d2ff);background-size:200% 100%;border-radius:5px;transition:width .1s;box-shadow:0 0 14px rgba(0,210,255,.7);animation:xpFlow 2s linear infinite;}
@keyframes xpFlow{0%{background-position:0% 0}100%{background-position:200% 0}}
#xpText{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));right:14px;color:#6ee7ff;font-size:12px;font-weight:800;text-shadow:0 0 10px rgba(0,210,255,.8);}
#levelBadge{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));left:14px;color:#fff;font-size:13px;font-weight:900;background:linear-gradient(135deg,rgba(0,210,255,.25),rgba(58,123,213,.25));padding:3px 14px;border-radius:12px;border:1.5px solid rgba(0,210,255,.5);box-shadow:0 0 16px rgba(0,210,255,.3);letter-spacing:.5px;}

/* ---- 暂停 ---- */
#pauseBtn{pointer-events:auto;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);color:#fff;width:40px;height:40px;border-radius:50%;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:absolute;top:calc(56px + env(safe-area-inset-top));left:12px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:all .15s;}
#pauseBtn:active{transform:scale(.9);background:rgba(255,255,255,.2);}

/* ---- 升级面板 ---- */
#upgradePanel{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,rgba(10,15,40,.88),rgba(5,5,15,.95));display:none;flex-direction:column;justify-content:center;align-items:center;pointer-events:auto;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
#upgradePanel.show{display:flex;}
#upgradeTitle{color:#fff;font-size:26px;font-weight:900;margin-bottom:6px;letter-spacing:2px;
  background:linear-gradient(135deg,#00d2ff,#7b61ff,#ff6b81);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 20px rgba(0,210,255,.5));}
#upgradeSub{color:#8899bb;font-size:12px;margin-bottom:24px;letter-spacing:1px;}
#upgradeCards{display:flex;flex-direction:column;gap:12px;width:88%;max-width:370px;}
.upCard{background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.14);border-radius:16px;padding:14px 16px;cursor:pointer;transition:all .18s cubic-bezier(.34,1.56,.64,1);pointer-events:auto;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;opacity:0;animation:cardIn .35s ease forwards;box-shadow:0 4px 20px rgba(0,0,0,.3);}
@keyframes cardIn{from{transform:translateY(24px) scale(.95);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.upCard::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 0% 50%,rgba(0,210,255,.15),transparent 70%);opacity:0;transition:opacity .2s;}
.upCard:active{transform:scale(.96);background:rgba(0,210,255,.12);border-color:#00d2ff;box-shadow:0 0 24px rgba(0,210,255,.35);}
.upCard:active::before{opacity:1;}
.upCard .upIcon{font-size:32px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(255,255,255,.06);border-radius:12px;}
.upCard .upInfo{flex:1;}
.upCard .upName{color:#fff;font-size:16px;font-weight:800;margin-bottom:3px;letter-spacing:.5px;}
.upCard .upDesc{color:#99aabb;font-size:12px;line-height:1.4;}
.upCard .upTag{display:inline-block;font-size:10px;padding:2px 9px;border-radius:6px;margin-top:5px;font-weight:800;letter-spacing:.5px;}

/* ---- 开始界面 ---- */
#startScreen{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,#1a1a3e 0%,#0a0a18 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:auto;z-index:20;overflow:hidden;}
#startScreen.hide{display:none;}
#startScreen::before{content:'';position:absolute;width:200%;height:200%;top:-50%;left:-50%;background:radial-gradient(circle at 30% 40%,rgba(0,210,255,.08),transparent 40%),radial-gradient(circle at 70% 60%,rgba(255,45,85,.06),transparent 40%);animation:rotateBg 20s linear infinite;}
@keyframes rotateBg{to{transform:rotate(360deg)}}
#startTitle{font-size:38px;font-weight:900;color:#fff;letter-spacing:8px;text-shadow:0 0 40px rgba(0,210,255,.8),0 0 80px rgba(0,210,255,.4),0 0 120px rgba(123,97,255,.3);margin-bottom:10px;position:relative;z-index:1;animation:titlePulse 3s ease-in-out infinite;}
@keyframes titlePulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}
#startSub{color:#6677aa;font-size:13px;margin-bottom:40px;letter-spacing:3px;position:relative;z-index:1;}
#startBtn{background:linear-gradient(135deg,#00d2ff,#3a7bd5,#7b61ff);background-size:200% 200%;color:#fff;border:none;padding:16px 60px;border-radius:32px;font-size:19px;font-weight:900;letter-spacing:4px;cursor:pointer;box-shadow:0 8px 32px rgba(0,210,255,.45),0 0 60px rgba(0,210,255,.2);transition:all .2s;pointer-events:auto;position:relative;z-index:1;animation:btnGlow 2s ease-in-out infinite;}
@keyframes btnGlow{0%,100%{background-position:0% 50%;box-shadow:0 8px 32px rgba(0,210,255,.45)}50%{background-position:100% 50%;box-shadow:0 8px 40px rgba(123,97,255,.6)}}
#startBtn:active{transform:scale(.94);}
#startHint{color:#445;font-size:12px;margin-top:28px;line-height:2;text-align:center;position:relative;z-index:1;letter-spacing:.5px;}
#startHint b{color:#00d2ff;font-weight:700;}
/* 角色选择 */
#charSelect{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,#1a1a3e 0%,#0a0a18 100%);display:flex;flex-direction:column;justify-content:flex-start;align-items:center;pointer-events:auto;z-index:21;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:16px 0;box-sizing:border-box;}
#charSelect.hide{display:none;}
#charSelect::before{content:'';position:absolute;width:200%;height:200%;top:-50%;left:-50%;background:radial-gradient(circle at 30% 40%,rgba(255,107,74,.1),transparent 40%),radial-gradient(circle at 70% 60%,rgba(93,173,226,.1),transparent 40%);animation:rotateBg 20s linear infinite;pointer-events:none;}
#charTitle{font-size:clamp(20px,6vw,28px);font-weight:900;color:#fff;letter-spacing:clamp(2px,1.5vw,6px);text-shadow:0 0 30px rgba(255,180,100,.6);margin:8px 0 4px;position:relative;z-index:1;text-align:center;}
#charSub{color:#8899bb;font-size:clamp(10px,3vw,12px);margin-bottom:16px;letter-spacing:clamp(1px,0.8vw,2px);position:relative;z-index:1;text-align:center;}
#heroCards{display:flex;gap:clamp(8px,2.5vw,22px);position:relative;z-index:1;flex-wrap:wrap;justify-content:center;padding:0 10px;width:100%;box-sizing:border-box;}
.heroCard{width:clamp(108px,28vw,170px);max-width:42vw;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:2px solid rgba(255,255,255,.15);border-radius:16px;padding:clamp(10px,2.5vw,18px) clamp(8px,2vw,14px);cursor:pointer;transition:all .25s;text-align:center;backdrop-filter:blur(8px);box-sizing:border-box;flex:0 1 auto;}
.heroCard:hover{transform:translateY(-6px);border-color:rgba(255,255,255,.5);box-shadow:0 10px 30px rgba(0,0,0,.5);}
.heroCard.selected{border-color:#ffd24a;box-shadow:0 0 24px rgba(255,210,74,.5);transform:translateY(-6px);}
.heroAvatar{width:clamp(56px,16vw,84px);height:clamp(56px,16vw,84px);border-radius:50%;margin:0 auto 8px;box-shadow:inset 0 -6px 12px rgba(0,0,0,.4);overflow:hidden;display:flex;align-items:center;justify-content:center;}
.heroAvatar canvas{max-width:100%;max-height:100%;display:block;border-radius:50%;}
.heroName{font-size:clamp(14px,4.5vw,20px);font-weight:900;color:#fff;letter-spacing:1px;}
.heroTitle{font-size:clamp(9px,2.8vw,11px);color:#ffd24a;margin:2px 0 6px;letter-spacing:1px;}
.heroDesc{font-size:clamp(9px,2.8vw,11px);color:#aabbcc;line-height:1.4;margin-bottom:8px;}
.heroStats{font-size:clamp(8px,2.5vw,10px);color:#8899aa;text-align:left;line-height:1.6;}
.heroStats b{color:#fff;}
#charStartBtn{margin:20px 0 12px;background:linear-gradient(135deg,#ffb347,#ff6b4a);color:#fff;border:none;padding:clamp(10px,2.8vw,14px) clamp(32px,10vw,50px);border-radius:30px;font-size:clamp(14px,4.5vw,17px);font-weight:900;letter-spacing:clamp(2px,1vw,4px);cursor:pointer;box-shadow:0 8px 30px rgba(255,107,74,.5);position:relative;z-index:1;transition:all .2s;}
#charStartBtn:hover{transform:scale(1.05);}
#charStartBtn:active{transform:scale(.94);}
/* 窄屏单列布局 */
@media (max-width:380px){
  #heroCards{flex-direction:column;align-items:center;gap:10px;}
  .heroCard{width:88vw;max-width:320px;display:flex;align-items:center;text-align:left;gap:12px;padding:10px 12px;}
  .heroAvatar{margin:0;width:56px;height:56px;flex-shrink:0;}
  .heroInfo{flex:1;min-width:0;}
}

/* ---- 结束界面 ---- */
#gameOverScreen{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,rgba(20,5,15,.92),rgba(5,5,15,.97));display:none;flex-direction:column;justify-content:center;align-items:center;pointer-events:auto;z-index:20;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
#gameOverScreen.show{display:flex;}
#overTitle{font-size:34px;font-weight:900;color:#ff2d55;letter-spacing:6px;margin-bottom:16px;text-shadow:0 0 30px rgba(255,45,85,.8),0 0 60px rgba(255,45,85,.4);animation:overIn .5s cubic-bezier(.34,1.56,.64,1);}
@keyframes overIn{from{transform:scale(1.5);opacity:0}to{transform:scale(1);opacity:1}}
#overStats{color:#8899bb;font-size:14px;line-height:2.2;text-align:center;margin-bottom:32px;}
#overStats b{color:#fff;font-size:22px;font-weight:900;margin-left:6px;text-shadow:0 0 14px rgba(0,210,255,.6);}
#restartBtn{background:linear-gradient(135deg,#ff2d55,#ff6b81);color:#fff;border:none;padding:15px 54px;border-radius:30px;font-size:17px;font-weight:900;letter-spacing:4px;cursor:pointer;box-shadow:0 8px 28px rgba(255,45,85,.45);transition:all .15s;pointer-events:auto;}
#restartBtn:active{transform:scale(.94);}

/* ---- 暂停界面 ---- */
#pauseScreen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(5,5,15,.75);display:none;justify-content:center;align-items:center;flex-direction:column;pointer-events:auto;z-index:15;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
#pauseScreen.show{display:flex;}
#pauseScreen p{color:#fff;font-size:26px;font-weight:900;margin-bottom:28px;letter-spacing:4px;text-shadow:0 0 20px rgba(0,210,255,.5);}
#pauseScreen button{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.25);color:#fff;padding:13px 42px;border-radius:26px;font-size:15px;font-weight:800;cursor:pointer;margin:7px;pointer-events:auto;letter-spacing:2px;transition:all .15s;min-width:180px;}
#pauseScreen button:active{transform:scale(.95);background:rgba(0,210,255,.2);border-color:#00d2ff;}

/* ---- 摇杆 ---- */
#joystick{position:absolute;bottom:calc(70px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(0,210,255,.06),rgba(255,255,255,.02));border:2px solid rgba(0,210,255,.15);pointer-events:none;opacity:0;transition:opacity .3s;box-shadow:0 0 30px rgba(0,210,255,.1) inset;}
#joystick.active{opacity:.9;}
#joystickStick{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(110,231,255,.7),rgba(0,150,255,.5));border:2.5px solid rgba(110,231,255,.9);pointer-events:none;transition:transform .05s;box-shadow:0 0 20px rgba(0,210,255,.6),0 0 40px rgba(0,210,255,.3);}
/* ============================================================
   夜战 · 绝地求生 皮肤（整体重绘）
   ============================================================ */
html,body{background:#05090f;font-family:'PingFang SC','Microsoft YaHei','Trebuchet MS',sans-serif;}
#hud{align-items:flex-start;gap:10px;}
#hpBar{width:min(42vw,192px);height:22px;border:2px solid #2f5568;background:#08131c;border-radius:7px;box-shadow:0 4px 14px #000b,inset 0 2px 8px #0009;overflow:hidden;}
#hpFill{background:linear-gradient(90deg,#2fd39c,#8ff0c8);box-shadow:0 0 16px #2fd39c99;border-radius:5px;}
#hpBar.low #hpFill{background:linear-gradient(90deg,#ff4d5e,#ff9a6a);box-shadow:0 0 18px #ff4d5ebb;}
#hpText{width:100%;height:18px;line-height:19px;font-size:12px;font-weight:800;letter-spacing:1px;}
#waveInfo{padding:6px 12px 7px;background:#08131cdb;border:2px solid #2f5568;border-radius:9px;box-shadow:0 4px 14px #000b;font-size:15px;color:#eaf6ff;white-space:nowrap;text-align:right;font-weight:900;letter-spacing:.5px;}
#waveInfo small{display:block;color:#9fd8ff;opacity:1;font-size:11px;font-weight:700;margin-top:2px;letter-spacing:.3px;}
#zoneInfo{display:block;font-style:normal;font-size:10px;font-weight:900;color:#c2a6ff;margin-top:3px;letter-spacing:.6px;}
#zoneInfo.warn{color:#ff9a9a;animation:zoneBlink .75s steps(2,end) infinite;}
@keyframes zoneBlink{50%{opacity:.3}}
#pauseBtn{top:calc(66px + env(safe-area-inset-top));left:12px;border-radius:9px;background:#0d1f2bdc;border:2px solid #2f5568;box-shadow:0 4px 12px #000a;color:#cfe6f5;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
#settingsBtn{background:#0d1f2bdc;box-shadow:0 4px 12px #000a;color:#f6cf7a;}
#levelBadge{border-radius:8px;background:#0c2f3d;border:2px solid #35d6a8;box-shadow:0 4px 12px #000a;color:#d8fff3;}
#xpBarWrap{height:12px;border:2px solid #2f5568;background:#08131c;border-radius:7px;box-shadow:0 4px 12px #000a;}
#xpFill{background:linear-gradient(90deg,#3fd3e8,#6ff0c0);box-shadow:0 0 14px #3fd3e8aa;animation:none;}
#xpText{color:#a9eeff;font-weight:900;text-shadow:0 2px 6px #000b;}
/* 击杀播报 */
#feed{position:absolute;top:calc(112px + env(safe-area-inset-top));right:12px;width:min(62vw,272px);display:flex;flex-direction:column;gap:4px;align-items:flex-end;}
#feed .fd{background:#061019dd;border-left:3px solid #3fd3a8;border-radius:5px;padding:4px 9px;font-size:11px;font-weight:800;color:#dceefb;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 3px 10px #0009;animation:fdIn .2s ease-out;transition:opacity .5s;}
/* 空投装备栏 + BUFF */
#gearBar{position:absolute;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:min(52vw,420px);}
#gearBar .gslot{width:34px;height:34px;border-radius:9px;background:#08131cdb;border:2px solid #2f5568;display:flex;align-items:center;justify-content:center;font-size:17px;position:relative;box-shadow:0 3px 10px #000a;}
#gearBar .gslot.rare{border-color:#f6cf7a;box-shadow:0 0 14px #f6cf7a66,0 3px 10px #000a;}
#gearBar .gslot .gt{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:900;color:#ffd27a;text-shadow:0 1px 3px #000;white-space:nowrap;}
#gearBar .gslot.buff{border-color:#ff6a2a;}
@keyframes fdIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
/* 开始界面 */
#startScreen{background:radial-gradient(ellipse at 50% 46%,rgba(10,26,38,.30),rgba(4,8,14,.88) 68%,rgba(3,6,10,.97));}
#startScreen::before{display:none;}
#startTitle{font-size:clamp(34px,9.5vw,68px);letter-spacing:6px;text-align:center;color:#fff8e2;margin:0 12px 6px;animation:none;position:relative;z-index:1;
  text-shadow:0 3px 0 #1d3a4a,0 6px 0 #0a1720,0 10px 26px #000c,0 0 44px rgba(255,190,90,.35);}
#startSub{color:#0a1a24;font-weight:900;font-size:clamp(15px,4.6vw,22px);background:linear-gradient(135deg,#ffd98a,#f2b452);padding:5px 22px;border-radius:999px;letter-spacing:clamp(4px,1.6vw,10px);margin:2px 0 12px;box-shadow:0 6px 0 #8a5a22,0 12px 26px #000a;position:relative;z-index:1;}
#startTag{color:#a8c3d6;font-size:11px;letter-spacing:1.4px;margin-bottom:30px;position:relative;z-index:1;text-align:center;padding:0 18px;}
#startHint{color:#7f97ab;font-size:11px;letter-spacing:.4px;margin-top:24px;position:relative;z-index:1;text-align:center;padding:0 20px;line-height:1.8;}
#startHint b{color:#f6cf7a;font-weight:800;}
#startBtn,#restartBtn{background:linear-gradient(135deg,#ffdf9a,#f2ab3d);border:3px solid #fff3cd;color:#3a2410;border-radius:10px;box-shadow:0 7px 0 #94611f,0 14px 30px #000b;animation:none;font-size:20px;font-weight:1000;letter-spacing:5px;}
#startBtn:active,#restartBtn:active{transform:translateY(5px);box-shadow:0 2px 0 #94611f;}
#startSettingsBtn{background:#0d1f2b;border:3px solid #2f5568;color:#cfe6f5;border-radius:10px;box-shadow:0 5px 0 #061420;letter-spacing:2px;}
#startSettingsBtn:active{transform:translateY(4px);box-shadow:0 1px 0 #061420;}
#charTitle{color:#fff3d4;text-shadow:0 3px 0 #173040,0 6px 20px #000c;}
#charSub{color:#9fb9cc;}
.heroCard{background:linear-gradient(165deg,rgba(19,40,56,.92),rgba(8,18,26,.94));border:2px solid #2f5568;border-radius:14px;box-shadow:0 8px 22px #000a;}
.heroCard:hover{border-color:#68a8c8;box-shadow:0 12px 28px #000c;}
.heroCard.selected{border-color:#f6cf7a;box-shadow:0 0 0 2px #f6cf7a55,0 14px 30px #000c;transform:translateY(-6px);}
.heroName{color:#fff4dc;}.heroTitle{color:#f6cf7a;}.heroDesc{color:#a7c2d4;}.heroStats{color:#8fa8ba;}.heroStats b{color:#eaf6ff;}
#charStartBtn{background:linear-gradient(135deg,#ffdf9a,#f2ab3d);color:#3a2410;border:3px solid #fff3cd;border-radius:10px;box-shadow:0 6px 0 #94611f;font-weight:1000;letter-spacing:4px;}
#charStartBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #94611f;}
/* 升级面板 */
#upgradePanel{background:radial-gradient(ellipse at center,rgba(7,17,26,.90),rgba(3,7,12,.96));}
#upgradeTitle{background:none;color:#ffeeb8;-webkit-text-fill-color:#ffeeb8;filter:none;text-shadow:0 4px 0 #16405a,0 0 30px rgba(255,190,90,.4);letter-spacing:8px;}
#upgradeSub{color:#9fc4d8;}
.upCard{background:linear-gradient(120deg,rgba(20,42,58,.95),rgba(9,20,30,.95));border:2px solid #2f5568;border-radius:12px;box-shadow:0 8px 22px #000a;padding:13px 14px;}
.upCard .upName{color:#fff4dc;}.upCard .upDesc{color:#9fb9cc;}.upCard .upIcon{background:#0b2230;border-radius:9px;border:2px solid #23485c;}

<script>
(function(){
'use strict';

/* ============================================================
   音频引擎（Web Audio API 合成）
   ============================================================ */
var actx = null, noiseBuf = null;
var _lastHit = 0, _lastKill = 0;

function initAudio(){
  if(actx){ if(actx.state === 'suspended') actx.resume(); return; }
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    actx = new AC();
    var len = actx.sampleRate * 0.5;
    noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for(var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }catch(e){ actx = null; }
}

function playNoise(dur, freq, q, vol, rate){
  if(!actx || !noiseBuf) return;
  var t = actx.currentTime;
  var src = actx.createBufferSource();
  src.buffer = noiseBuf;
  src.playbackRate.value = rate || 1;
  var bp = actx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = freq;
  bp.Q.value = q;
  var g = actx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  src.connect(bp); bp.connect(g); g.connect(actx.destination);
  src.start(t); src.stop(t + dur + 0.02);
}

function playTone(freq, dur, type, vol, slideTo){
  if(!actx) return;
  var t = actx.currentTime;
  var o = actx.createOscillator();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  var g = actx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

function sfxHit(){
  var now = performance.now();
  if(now - _lastHit < 26) return;
  _lastHit = now;
  // 金属切肉声：高频噪声"唰"+ 短促金属"铮"
  playNoise(0.06, 2600 + Math.random() * 1800, 2.2, 0.14, 1.6 + Math.random() * 0.6);
  playTone(900 + Math.random() * 350, 0.05, 'triangle', 0.07, 380);
  // 极短低频撞击
  playTone(180 + Math.random() * 60, 0.06, 'sine', 0.12, 90);
}

function sfxKill(){
  var now = performance.now();
  if(now - _lastKill < 45) return;
  _lastKill = now;
  playNoise(0.15, 1100, 1.0, 0.18, 0.7);
  playTone(260, 0.18, 'sawtooth', 0.1, 70);
  playTone(520, 0.09, 'triangle', 0.07, 200);
}

function sfxHurt(){
  playTone(140, 0.24, 'sawtooth', 0.22, 55);
  playNoise(0.2, 400, 0.8, 0.16, 0.6);
}

function sfxLevel(){
  playTone(523, 0.11, 'sine', 0.16, 660);
  setTimeout(function(){ playTone(659, 0.11, 'sine', 0.16, 784); }, 90);
  setTimeout(function(){ playTone(784, 0.2, 'sine', 0.18, 1047); }, 180);
}

function sfxCrit(){
  playNoise(0.12, 3800, 2.8, 0.2, 1.9);
  playTone(1400, 0.1, 'square', 0.09, 560);
  playTone(120, 0.14, 'sawtooth', 0.13, 50);
  playTone(2100, 0.07, 'sine', 0.06, 1200);
}

var _lastSwing = 0;
function sfxSwing(){
  var now = performance.now();
  if(now - _lastSwing < 110) return;
  _lastSwing = now;
  // 刀刃破空"咻"：带通噪声快速下扫
  if(!actx || !noiseBuf) return;
  var t = actx.currentTime;
  var src = actx.createBufferSource();
  src.buffer = noiseBuf;
  src.playbackRate.setValueAtTime(2.2, t);
  src.playbackRate.exponentialRampToValueAtTime(0.6, t + 0.12);
  var bp = actx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.setValueAtTime(3200, t);
  bp.frequency.exponentialRampToValueAtTime(700, t + 0.12);
  bp.Q.value = 3.5;
  var g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.13, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0008, t + 0.14);
  src.connect(bp); bp.connect(g); g.connect(actx.destination);
  src.start(t); src.stop(t + 0.16);
}

/* ============================================================
   固定常量
   ============================================================ */

  stormDpsPctHp: 0.012,

  /* ===== 大地图 · 世界人口 ===== */

  maxActiveMobs: 260,       // 场上同时存在的实体小怪上限

/* ============================================================
   玩家属性重算（设置 + 升级加成）
   ============================================================ */
function recalcPlayer(){
  if(!player) return;
  var b = player.bonus, s = settings;
  var oldMax = player.maxHp;

  player.speed         = s.moveSpeed;
  player.bladeCount    = Math.max(1, Math.round(s.bladeCount + b.bladeCount + (player.gearBlade || 0)));
  player.damage        = s.bladeDamage + b.damage;
  player.bladeLength   = Math.max(4, s.bladeLength + b.bladeLength);
  player.bladeThickness= Math.max(1, s.bladeThickness + b.bladeThickness);
  player.bladeOrbit    = Math.max(12, s.bladeOrbit + b.bladeOrbit);
  player.bladeRotSpeed = s.bladeRotSpeed * b.bladeRotSpeedMul;
  player.maxHp         = Math.max(1, Math.round(s.maxHp + b.maxHp));
  player.hpRegen       = s.hpRegen + b.hpRegen;
  player.speedMul      = b.speedMul * (player.gearSpeedMul || 1);
  player.lifesteal     = s.lifesteal + b.lifesteal;
  player.magnet        = s.magnet + b.magnet;
  player.critChance    = Math.min(1, s.critChance + b.critChance);
  player.critMult      = s.critMult + b.critMult;
  player.xpBonus       = s.xpBonus + b.xpBonus;
  player.guard         = Math.min(0.6, b.guard || 0);
  player.stormRes      = Math.min(0.72, b.stormRes || 0);
  player.eliteDmg      = 1 + (b.eliteDmg || 0);
  player.dmgReduce     = Math.min(0.55, b.dmgReduce || 0);
  player.cdMul         = b.cdMul || 1;
  player.shieldMax     = (player.gearShield || 0) + (selectedHero.shield || 0);
  player.reflect       = Math.min(0.65, (b.reflect || 0) + (player.gearReflect || 0) + (selectedHero.reflect || 0));
  if(player.shield > player.shieldMax) player.shield = player.shieldMax;

  if(player.maxHp > oldMax) player.hp += player.maxHp - oldMax;
  if(player.hp > player.maxHp) player.hp = player.maxHp;
  if(player.hp < 0) player.hp = 0;
}

    item:it,
    phase:rand(0, Math.PI*2),

function updateItems(dt){
  var dtf = dt / 16.67;
  for(var i = items.length - 1; i >= 0; i--){
    var it = items[i];
    var dx = player.x - it.x, dy = player.y - it.y;
    var d = Math.sqrt(dx*dx + dy*dy) || 1;
    if(d < player.magnet + 40){
      var pull = 6 * dtf * (1 + (player.magnet + 40 - d) / (player.magnet + 40) * 2);
      it.x += (dx / d) * pull;
      it.y += (dy / d) * pull;
    } else {
      it.x += it.vx * dtf * 0.7;
      it.y += it.vy * dtf * 0.7;
    }
    it.vx *= 0.93; it.vy *= 0.93;
    it.phase += 0.12 * dtf;
    it.life += dtf;
    if(d < player.radius + it.radius){
      if(it.gear){
        equipGear(it.gear);
      } else {
        it.item.apply();
        createParticles(it.x, it.y, 12, it.item.color, 3.5);
        shockwaves.push({ x:it.x, y:it.y, r:8, spd:6, life:1, color:it.item.color, w:3 });
        sfxLevel();
      }
      updateUI();
      items.splice(i, 1);
    }
  }
}

      e.maxHp += add; e.hp += add;

/* 由装备推导出的玩家能力（每次换装全部重算，天然"覆盖不叠加"） */
function recalcGear(){
  var g = player.gear || (player.gear = { armor:null, enchant:null, aux:null, tech:null });
  var hid = selectedHero.id;
  player.immuneUntyped = 0; player.pierceArmor = 0; player.bolts = 0;
  player.poisonBlade = 0; player.fireBlade = 0; player.thunderBlade = 0;
  player.gearBlade = 0; player.gearSpeedMul = 1; player.gearFireDmg = 0;
  player.gearShield = 0; player.gearReflect = 0;
  if(g.armor === 'tengjia') player.immuneUntyped = 1;
  if(g.enchant === 'dudao') player.poisonBlade = 1;
  if(g.enchant === 'huodao'){ player.fireBlade = 1; player.gearFireDmg += 6; }
  if(g.enchant === 'leiji') player.thunderBlade = 1;
  if(g.enchant === 'qinggang') player.pierceArmor = 1;
  if(g.aux === 'zhuge') player.bolts = 1;
  if(g.tech === 'gongfa_huang') player.gearSpeedMul *= (hid === 'duanyu' ? 1.5 : 1.25);
  if(g.tech === 'gongfa_xuan') player.gearBlade += (hid === 'qiaofeng' ? 16 : 8);
  if(g.tech === 'gongfa_di'){ player.fireBlade = 1; player.gearFireDmg += (hid === 'jiumozhi' ? 16 : 8); }
  if(g.tech === 'gongfa_tian'){ player.gearShield += 1000; player.gearReflect += (hid === 'xuzhu' ? 0.5 : 0.25); }
}

   ============================================================ */
function updateBlades(dt){
  var lvlMul = 1 + player.level * 0.006;
  var skillMul = player.skillSpinT > 0 ? 5.8 : 1;
  var step = player.bladeRotSpeed * dt * lvlMul * 0.065 * skillMul;
  player.bladeAngle += step;
  bladeAngStep = step;   // 供渲染计算弧形拖尾
  var n = player.bladeCount;
  blades = [];
  for(var i = 0; i < n; i++){
    var a = player.bladeAngle + (Math.PI * 2 / n) * i;
    var inner = Math.max(4, player.bladeOrbit - player.bladeLength);
    blades.push({
      angle: a,
      ox: player.x + Math.cos(a) * inner,
      oy: player.y + Math.sin(a) * inner,
      x: player.x + Math.cos(a) * player.bladeOrbit,
      y: player.y + Math.sin(a) * player.bladeOrbit
    });
  }
}

function getBladeSegments(){
  var out = [];
  for(var i = 0; i < blades.length; i++){
    var b = blades[i];
    out.push({ x1:b.ox, y1:b.oy, x2:b.x, y2:b.y, angle:b.angle });
  }
  return out;
}

function segCircle(seg, cx, cy, r){
  var dx = seg.x2 - seg.x1, dy = seg.y2 - seg.y1;
  var fx = seg.x1 - cx, fy = seg.y1 - cy;
  var a = dx*dx + dy*dy;
  if(a < 0.0001) return dist(seg.x1, seg.y1, cx, cy) <= r;
  var t = clamp(-(fx*dx + fy*dy) / a, 0, 1);
  var px = seg.x1 + dx*t, py = seg.y1 + dy*t;
  return dist(px, py, cx, cy) <= r;
}

/* ============================================================
   空间网格：100 个精英 + 上百小怪时的邻域查询（避免 O(n²)）
   ============================================================ */
var grid = { cell: 180, map: new Map(), list: [] };
var _gq = [];
function gkey(cx, cy){ return (cx + 6000) * 30000 + (cy + 6000); }
function gridBuild(){
  grid.map.clear();
  var cs = grid.cell, m = grid.map;
  for(var i = 0; i < enemies.length; i++){
    var e = enemies[i];
    if(e.dead) continue;
    var k = gkey(Math.floor(e.x / cs), Math.floor(e.y / cs));
    var arr = m.get(k);
    if(!arr){ arr = []; m.set(k, arr); }
    arr.push(e);
  }
  for(var d = 0; d < airDrops.length; d++){
    var dr = airDrops[d];
    if(dr.opened) continue;
    var k2 = gkey(Math.floor(dr.x / cs), Math.floor(dr.y / cs));
    var arr2 = m.get(k2);
    if(!arr2){ arr2 = []; m.set(k2, arr2); }
    arr2.push(dr);
  }
}
/* 查询半径 r 内的实体，写入 _gq 并返回 */
function gridQuery(x, y, r){
  _gq.length = 0;
  var cs = grid.cell, m = grid.map;
  var x0 = Math.floor((x - r) / cs), x1 = Math.floor((x + r) / cs);
  var y0 = Math.floor((y - r) / cs), y1 = Math.floor((y + r) / cs);
  for(var cx = x0; cx <= x1; cx++){
    for(var cy = y0; cy <= y1; cy++){
      var arr = m.get(gkey(cx, cy));
      if(!arr) continue;
      for(var i = 0; i < arr.length; i++) _gq.push(arr[i]);
    }
  }
  return _gq;
}

/* 玩家战力估算 —— 用于「威胁等级」橡皮筋（玩家越强，敌人越强） */
function playerPower(){
  if(!player) return 1;
  return 1 + player.level * 0.05 + player.bladeCount * 0.055 + player.damage / 170
       + player.bladeLength / 320 + Math.max(0, player.maxHp - 100) / 1100;
}
function refreshThreat(){
  var natural = 1 + wave * 0.05;
  threat = clamp(playerPower() - natural, 0, 2.6);
}

function spawnEnemyAt(ex, ey, type, opts){
  if(enemies.length >= settings.maxEnemies) return null;
  opts = opts || {};
  var t = ENEMY_TYPES[type] || ENEMY_TYPES.slime;
  var th = threat * settings.threatScale;
  var hpScale = (1 + (wave - 1) * settings.hpScalePerWave) * (1 + th);
  var dmgScale = (1 + (wave - 1) * settings.dmgScalePerWave) * (1 + th * 0.6);
  var hp = settings.enemyHp * t.hpMul * hpScale;
  var waveBladeBonus = Math.floor((wave - 1) / 2);
  var scaledBlades = t.blades > 0 ? t.blades + waveBladeBonus : 0;
  var scaledBladeDmg = t.bladeDmg * (1 + (wave - 1) * 0.18) * (1 + th * 0.5);
  if(opts.final){
    hp *= 3.2; scaledBlades += 3; scaledBladeDmg *= 1.6; dmgScale *= 1.25;
  }
  if(opts.guardian){ hp = settings.buffGuardianHp; }
  var nm = t.name;
  if(type === 'elite') nm = randomEliteName();
  if(opts.name) nm = opts.name;
  var e = {
    x:ex, y:ey,
    hp:hp, maxHp:hp,
    speed: settings.enemySpeed * t.speedMul * (1 + (wave-1) * settings.spdScalePerWave) * (opts.final ? 0.9 : 1),
    speedMul: 1,
    damage: settings.enemyDmg * t.dmgMul * dmgScale,
    radius:t.radius * (opts.final ? 1.25 : 1),
    color:t.color, color2:t.color2, glow:t.glow,
    type:type, tier:t.tier, name:nm, baseName:nm,
    food:t.food, aiType:t.ai, special:!!t.special, guardian:!!t.guardian,
    tengjia: (t.tengjia ? 1 : 0) + ((type === 'elite' && Math.random() < 0.18) ? 1 : 0),
    armor: (t.tier >= 2 ? 8 : t.tier >= 1 ? 4 : (type === 'tank' ? 6 : 0)) + (opts.final ? 6 : 0),
    poisonRes: t.poisonRes || 0,
    blades: scaledBlades, maxBlades: scaledBlades,
    bladeDmg: scaledBladeDmg,
    bladeLen: t.radius * 0.8,
    bladeOrbit: t.radius * 1.5,
    bladeAngle: rand(0, Math.PI*2),
    bladeRotSpeed: 0.09 + (t.tier === 2 ? 0.045 : 0),
    hitFlash:0,
    wobble:rand(0, Math.PI*2),
    dead:false,
    cd:[],
    bladeHitCd:0,
    kills:0,
    gems:0,              // 吞下的经验：被击杀时会吐出来
    kx:0, ky:0,
    face:1,
    home:{ x:ex, y:ey },
    mode:'idle', target:null, targetPlayer:false, retarget: rand(0, 0.4),
    rage:0, fleeT:0, dashT:0, dashCd: rand(60, 200), throwCd: rand(80, 150),
    final:!!opts.final, burnT:0, regenT: 4200, disarmCd: 0, dots:[],
    /* 和主角同一套成长体系：加刀 / 变大 / 加范围 / 吸血 / 加速 / 加伤 / 回血 */
    lifesteal: 0, regen: 0, upBlade: 0, upOrbit: 0, upRadius: 0, upSpeed: 0, upDmg: 0, upCrit: 0,
    growT: rand(2, 6), offGrow: 0, fromWorld: !!opts.fromWorld, isSpecial: !!t.special,
    kind: opts.kind || (t.special ? 'special' : 'mob')
  };
  enemies.push(e);
  return e;
}

function spawnEnemy(initial, forcedType){
  if(enemies.length >= settings.maxEnemies) return;
  var ang = rand(0, Math.PI * 2);
  var r = initial
    ? rand(150, Math.min(W,H) * 0.5 + 160)
    : rand(Math.min(W,H) * 0.48 + 65, Math.max(W,H) * 0.55 + 120);
  var ex = player.x + Math.cos(ang) * r;
  var ey = player.y + Math.sin(ang) * r;

  var type = forcedType || 'slime';
  if(!forcedType){
    var wr = Math.random();
    var eC = settings.eliteChance + threat * 0.03, tC = settings.tankChance;
    var fC = settings.fastChance, thc = settings.throwerChance;
    // 场上精英数量有限：猎食者要保持「少数强者」的压迫感
    var maxElites = 3 + Math.floor(wave / 3);
    if(wave >= 2 && wr < eC && aliveElites < maxElites) type = 'elite';
    else if(wave >= 2 && wr < eC + tC) type = 'tank';
    else if(wr < eC + tC + fC) type = 'fast';
    else if(wr < eC + tC + fC + thc) type = 'thrower';
  }
  spawnEnemyAt(ex, ey, type);
}

/* ============================================================
   精英成长：和玩家同一套体系（加刀 / 变大 / 加范围 / 吸血 / 加速 / 加伤 / 回血）
   ============================================================ */
function eliteUpgrade(e){
  var maxB = e.guardian ? 10 : 26;
  var k = Math.floor(Math.random() * 7);
  if(k === 0 && e.maxBlades < maxB){ e.blades++; e.maxBlades++; }
  else if(k === 1){ e.radius = Math.min(e.radius * 1.07, e.radius + 4); }
  else if(k === 2){ e.bladeOrbit += Math.max(3, e.radius * 0.14); }
  else if(k === 3){ e.bladeDmg *= 1.10; }
  else if(k === 4){ e.speed = Math.min(e.speed * 1.06, 6.5); }
  else if(k === 5){ e.lifesteal = Math.min(e.lifesteal + 1.6, 14); }
  else { e.regen = Math.min(e.regen + 0.8, 9); }
  e.bladeLen = Math.max(e.bladeLen, e.radius * 0.8);
  e.bladeOrbit = Math.max(e.bladeOrbit, e.radius * 1.45);
}

/* 进食：+刀 / 变大 / 加范围 / 吸血 等（真实吞噬与场外发育共用） */
function eliteFeed(e, n, silent){
  if(n <= 0 || e.dead) return;
  e.kills += 1;
  e.eatCount = (e.eatCount || 0) + n;
  e.bladeDmg += 0.85 * n;
  var hpGain = Math.max(2, Math.round(e.maxHp * 0.03 * n) + Math.round(e.lifesteal * 3));
  e.maxHp += hpGain;
  e.hp = Math.min(e.maxHp, e.hp + hpGain);
  e.gems += Math.round(n * 2.5);
  if(Math.random() < 0.45 + n * 0.04) eliteUpgrade(e);
  // 进化阶段
  var st = evolveStage(e.kills);
  if(e.stageName !== st.name){
    var first = !e.stageName;
    e.stageName = st.name;
    if(!first && !silent){
      feedMsg('☠ ' + e.name + ' 进化成「' + st.name + '」', st.aura);
      if(e.kills >= 6) showBanner('☠ ' + e.name + ' 已成 ' + st.name);
    }
  }
}

/* 场外（不在玩家视野附近）的精英按人口消耗抽象发育，防止"远处没人打就不成长" */
function updateEliteOffscreen(e, dt){
  if(settings.eliteOffscreenGrowth <= 0) return;
  e.growT -= dt / 1000;
  if(e.growT > 0) return;
  e.growT = rand(2.6, 4.6);
  // 往安全区里赶路（缩圈时才会真正跑到玩家附近开打）
  if(storm && settings.stormEnabled && stormOutside(e.x, e.y)){
    var za = Math.atan2(storm.cy - e.y, storm.cx - e.x);
    var zr = Math.min(300, dist(e.x, e.y, storm.cx, storm.cy));
    e.x += Math.cos(za) * zr * 0.35;
    e.y += Math.sin(za) * zr * 0.35;
  }
  if(worldMobsLeft <= 0){ e.growT *= 2; return; }
  var n = Math.min(worldMobsLeft, 1 + Math.floor(Math.random() * 2));
  worldMobsLeft -= n;
  eliteFeed(e, n, true);
  // 场外也会互相拼命：低概率被淘汰（剩余够多时才抽象淘汰，保证最后的强者要玩家亲自解决）
  var aliveN = 0;
  for(var i = 0; i < enemies.length; i++) if(!enemies[i].dead && enemies[i].tier >= 1 && !enemies[i].guardian) aliveN++;
  if(aliveN > settings.eliteFinalStand){
    // 缩圈越深，场外生态竞争越激烈，避免精英在圈边无限滚雪球。
    var zonePressure = 1 + Math.max(0, zonePhase) * 0.65;
    var duelRate = Math.min(0.32, settings.eliteDuelRate * zonePressure);
    if(Math.random() < duelRate){
      onEnemyDeath(e, null);
      if(e.kills >= 3 || Math.random() < 0.25){
        feedMsg('☠ ' + e.name + ' 被更强的对手猎杀了（吞噬 ' + e.kills + ' 次）', '#ff8a6a');
      }
    }
  }
}

/* ============================================================
   世界人口：总数十万的小怪/特种怪，按需在玩家周围"实体化"
   ============================================================ */
var _spawnFails = 0;
function worldSpawnPos(isSpecial){
  var a = rand(0, Math.PI * 2);
  var r = rand(settings.spawnRingMin, Math.max(settings.spawnRingMin + 100, settings.spawnRingMax));
  var px = player.x + Math.cos(a) * r, py = player.y + Math.sin(a) * r;
  // 超出安全区就往圈内拉（怪也知道往圈里挤）
  if(storm && settings.stormEnabled){
    var d = dist(px, py, storm.cx, storm.cy);
    if(d > storm.r * 0.95){
      var k = (storm.r * 0.95) / d;
      px = storm.cx + (px - storm.cx) * k;
      py = storm.cy + (py - storm.cy) * k;
    }
  }
  return { x:px, y:py };
}
function updatePopulation(dt){
  var mobs = 0, specials = 0, i, e;
  for(i = 0; i < enemies.length; i++){
    e = enemies[i];
    if(e.dead || e.tier >= 1) continue;
    if(e.isSpecial) specials++; else mobs++;
  }
  // 补充普通小怪
  if(worldMobsLeft > 0 && mobs < settings.maxActiveMobs){
    var need = Math.min(6, settings.maxActiveMobs - mobs, worldMobsLeft);
    for(i = 0; i < need; i++){
      var p = worldSpawnPos(false);
      var rr = Math.random();
      var fP = settings.fastChance * 2.2;
      var ty = rr < fP ? 'fast' : 'slime';   // 铁卫属于特种怪，由特种怪池子刷
      if(spawnEnemyAt(p.x, p.y, ty, { fromWorld:true })) worldMobsLeft--;
    }
  }
  // 补充特种怪（抗毒 / 飞镖 / 铁卫）
  if(worldSpecialsLeft > 0 && specials < settings.maxActiveSpecials){
    var need2 = Math.min(2, settings.maxActiveSpecials - specials, worldSpecialsLeft);
    for(i = 0; i < need2; i++){
      var p2 = worldSpawnPos(true);
      var rr2 = Math.random();
      var thP = settings.throwerChance * 2.2;
      var ty2 = rr2 < thP ? 'thrower' : (rr2 < thP + (1 - thP) * 0.5 ? 'toxic' : 'tank');
      if(spawnEnemyAt(p2.x, p2.y, ty2, { fromWorld:true })) worldSpecialsLeft--;
    }
  }
  // 回收：太远的实体怪（还没被消灭）回到人口池
  var dr2 = settings.despawnRadius * settings.despawnRadius;
  for(i = enemies.length - 1; i >= 0; i--){
    e = enemies[i];
    if(e.dead || e.tier >= 1 || !e.fromWorld) continue;
    var dx = e.x - player.x, dy = e.y - player.y;
    if(dx*dx + dy*dy > dr2){
      // 世界人口是有限资源：实体化后离场也视为资源消耗，不再返还人口池。
      enemies.splice(i, 1);
    }
  }
}

/* ============================================================
   空投：运输机 → 空投箱（20w 血，双方都抢）
   ============================================================ */
/* 把一个坐标夹进安全区内（margin：0~1，越小越靠圈心） */
function clampToZone(x, y, margin){
  if(!storm || !settings.stormEnabled) return { x:x, y:y };
  var lim = Math.max(120, storm.r * (margin == null ? 0.85 : margin));
  var dx = x - storm.cx, dy = y - storm.cy;
  var d = Math.sqrt(dx*dx + dy*dy);
  if(d <= lim || d < 0.001) return { x:x, y:y };
  var k = lim / d;
  return { x: storm.cx + dx * k, y: storm.cy + dy * k };
}
/* 该点是否在安全区内（带内缩留白） */
function inZone(x, y, margin){
  if(!storm || !settings.stormEnabled) return true;
  var lim = Math.max(120, storm.r * (margin == null ? 0.85 : margin));
  return dist(x, y, storm.cx, storm.cy) <= lim;
}
var PLANE_SPEED = 760;   // 飞机速度 px/秒（投弹点与航线用同一套时间轴）
function spawnPlane(){
  if(!settings.airDropPerShrink) return;
  var on = settings.airDropPerShrink;
  for(var n = 0; n < on; n++){
    // 先定落点：在玩家附近 900~2400 处，且强制夹进安全区
    var baseA = rand(0, Math.PI * 2), baseR = rand(900, 2400);
    var base = clampToZone(player.x + Math.cos(baseA) * baseR,
                           player.y + Math.sin(baseA) * baseR, 0.72);
    // 再定航线：让飞机从圈外飞进来并经过落点
    var a = rand(0, Math.PI * 2);
    var ux = Math.cos(a), uy = Math.sin(a);
    var sp = PLANE_SPEED;
    var L = 7200;                                        // 航线长度
    var tMid = (L * 0.5) / sp;
    var sx = base.x - ux * L * 0.5, sy = base.y - uy * L * 0.5;
    var cn = Math.max(1, Math.round(settings.airDropCrates));
    var crates = [];
    for(var c = 0; c < cn; c++){
      var along = (cn === 1) ? rand(-500, 500) : (c / (cn - 1) - 0.5) * 1500;
      var px = base.x + ux * along, py = base.y + uy * along;
      var cl = clampToZone(px, py, 0.74);                // 双保险：一定在圈内
      crates.push({ t: Math.max(0.6, tMid + along / sp), x:cl.x, y:cl.y });
    }
    planes.push({
      x:sx, y:sy, vx:ux * sp, vy:uy * sp,
      t:0, life:(L / sp) + 2.5, crates:crates
    });
    feedMsg('✈ 补给飞机进入战场 · 空投落在圈内', '#ffd27a');
  }
}
function updatePlanes(dt){
  for(var i = planes.length - 1; i >= 0; i--){
    var pl = planes[i];
    pl.x += pl.vx * dt / 1000; pl.y += pl.vy * dt / 1000;
    pl.t += dt / 1000;
    for(var c = 0; c < pl.crates.length; c++){
      var cr = pl.crates[c];
      if(!cr.done && pl.t >= cr.t){
        cr.done = true;
        var cl2 = clampToZone(cr.x, cr.y, 0.74);          // 落点再保证一次
        airDrops.push({
          x:cl2.x, y:cl2.y, hp:settings.airDropHp, maxHp:settings.airDropHp,
          opened:false, armor:10, phase:rand(0,Math.PI*2), fall:1, landed:false
        });
        feedMsg('📦 空投箱降落（圈内）', '#ffd27a');
        sfxLevel();
      }
    }
    if(pl.t > pl.life) planes.splice(i, 1);
  }
  for(var d = 0; d < airDrops.length; d++){
    var ad = airDrops[d];
    if(ad.opened) continue;
    // 缩圈后落在圈外的箱子：立刻"紧急转移"回安全区（不会让你为了空投去毒里送死）
    if(!inZone(ad.x, ad.y, 0.74)){
      var cc = clampToZone(ad.x, ad.y, 0.68);
      ad.x = cc.x; ad.y = cc.y; ad.fall = 1; ad.landed = false;
      feedMsg('📦 空投箱被风暴逼进安全区', '#ffd27a');
    }
    if(ad.fall > 0){
      ad.fall -= dt / 1400;
      if(ad.fall <= 0){ ad.fall = 0; ad.landed = true; shake.intensity = Math.max(shake.intensity, 5); }
    }
  }
}
function openAirDrop(ad){
  ad.opened = true;
  ad.broken = true;
  var pool = ['tengjia','dudao','huodao','leiji','qinggang','zhuge','taoyuan',
              'gongfa_huang','gongfa_xuan','gongfa_di','gongfa_tian'];
  var n = 1 + (Math.random() < 0.5 ? 1 : 0);

}
/* 精英砸开空投：抢到一部分成长（玩家也能捡地上的稀有道具） */
function eliteLootAirDrop(e, ad){

function damageAirDrop(ad, amount, who){

/* ============================================================
   敌人 AI：目标选择
   ——草料/小怪会吃地上的经验发育，玩家靠近才冲，看到精英会逃
   ——精英/Boss 主动猎杀别的怪吞噬成长，也会追杀变强的玩家
   ============================================================ */
function enemyPower(e){
  return e.blades * e.bladeDmg * 0.85 + e.maxHp * 0.11 + e.damage * 3.2 + e.kills * 6;
}
function nutrient(e){
  return 14 + e.maxHp * 0.35 + e.blades * e.bladeDmg * 0.55 + e.gems * 1.6 + e.kills * 14;
}
function nearestGem(e, range){
  var best = null, bd = range * range;
  for(var i = 0; i < xpGems.length; i++){
    var g = xpGems[i];
    var dx = g.x - e.x, dy = g.y - e.y;
    var d2 = dx*dx + dy*dy;
    if(d2 < bd){ bd = d2; best = g; }
  }
  return best;
}
function pickEnemyTarget(e){
  var pd = dist(e.x, e.y, player.x, player.y);

  // 精英/Boss：猎杀「最有营养」的其他怪，也会盯上玩家
  if(e.tier >= 1){
    var best = null, bestScore = -1, isPlayer = false;
    var hunt = settings.eliteHuntRange;
    var myPow = enemyPower(e);
    for(var i = 0; i < enemies.length; i++){
      var o = enemies[i];
      if(o === e || o.dead) continue;
      var d = dist(e.x, e.y, o.x, o.y);
      if(d > hunt) continue;
      var sc = nutrient(o) * 1.5 + (240 - d) * 0.5;
      if(enemyPower(o) > myPow * 1.35) sc *= 0.25;   // 打不过的先放一放
      // 前期优先吃小怪长大，越往后越要拼同类（绝地求生的节奏）
      var duelBias = 0.30 + zonePhase * 0.3 + e.kills * 0.02;
      if(o.tier >= 1) sc *= clamp(duelBias, 0.25, 2.2);
      if(sc > bestScore){ bestScore = sc; best = o; isPlayer = false; }
    }
    var pSc = (55 + player.level * 15 + player.bladeCount * 10) + (420 - Math.min(420, pd)) * 0.55;
    if(pd < 320) pSc *= 1.8;
    if(pd > 800) pSc *= 0.1;
    // 空投箱：精英也会去抢（优先级很高）
    for(var di4 = 0; di4 < airDrops.length; di4++){
      var adr = airDrops[di4];
      if(adr.opened) continue;
      var dd4 = dist(e.x, e.y, adr.x, adr.y);
      if(dd4 > hunt) continue;
      var adSc = 900 + (400 - Math.min(400, dd4)) * 0.6;
      if(adSc > bestScore){ bestScore = adSc; best = adr; isPlayer = false; }
    }
    if(pSc > bestScore){ bestScore = pSc; best = null; isPlayer = true; }
    e.target = best; e.targetPlayer = isPlayer;
    e.mode = isPlayer ? 'hunt' : (best ? 'hunt' : 'roam');
    return;
  }

  // 小怪：先看有没有精英在附近（逃命），再看玩家（仇恨），否则吃经验发育
  var eliteNear = null, eliteD = 1e9;
  if(settings.mobFleeRange > 0){
    for(var j = 0; j < enemies.length; j++){
      var o2 = enemies[j];
      if(o2 === e || o2.dead || o2.tier < 1) continue;
      var d2 = dist(e.x, e.y, o2.x, o2.y);
      if(d2 < eliteD){ eliteD = d2; eliteNear = o2; }
    }
  }
  if(e.aiType === 'hunter' && pd < 620){ e.target = null; e.targetPlayer = true; e.mode = 'hunt'; return; }
  if(eliteNear && eliteD < settings.mobFleeRange){ e.target = eliteNear; e.targetPlayer = false; e.mode = 'flee'; return; }
  if(pd < settings.mobAggroRange || e.rage > 0){ e.target = null; e.targetPlayer = true; e.mode = 'hunt'; return; }
  e.target = null; e.targetPlayer = false;
  e.mode = (e.aiType === 'guard') ? 'hold' : 'graze';
}

function updateEnemies(dt){
  var dtf = dt / 16.67;
  for(var i = enemies.length - 1; i >= 0; i--){
    var e = enemies[i];
    if(e.dead){ enemies.splice(i, 1); continue; }

    // 远离玩家的精英走"抽象模拟"（发育/淘汰在 updateEliteOffscreen 里算），
    // 只有靠近玩家或随缩圈被挤到身边的人才会实体化互砍 —— 既省性能也保证长局节奏。
    if(e.tier >= 1 && !e.guardian){
      var fdx = e.x - player.x, fdy = e.y - player.y;
      if(fdx*fdx + fdy*fdy > 2600 * 2600) continue;
    }

    for(var ci = 0; ci < e.cd.length; ci++){
      if(e.cd[ci] > 0) e.cd[ci] -= dtf;
    }
    // 计时器
    if(e.rage > 0) e.rage -= dtf;
    if(e.fleeT > 0) e.fleeT -= dtf;
    if(e.dashT > 0) e.dashT -= dtf;
    if(e.dashCd > 0) e.dashCd -= dtf;
    if(e.throwCd > 0) e.throwCd -= dtf;
    if(e.hitFlash > 0) e.hitFlash -= dtf;
    if(e.burnT > 0) e.burnT -= dtf;
    if(e.disarmCd > 0) e.disarmCd -= dtf;
    // 精英被打掉刀刃后会慢慢「重铸」刀刃（拼刀不是一次性缴械）
    if(e.fleeMsgT > 0) e.fleeMsgT -= dtf;
    if(e.zoneMsgT > 0) e.zoneMsgT -= dtf;
    if(e.tier >= 1 && e.blades < e.maxBlades){
      e.regenT -= dt;
      if(e.regenT <= 0){
        e.blades++;
        e.regenT = 5200;
        createParticles(e.x, e.y, 5, e.tier === 2 ? '#c8a2ff' : '#ffb24a', 2.6);
      }
    }

    // 中毒 / 持续伤害
    if(e.dots && e.dots.length){
      for(var di3 = e.dots.length - 1; di3 >= 0; di3--){
        var dot = e.dots[di3];
        dot.t -= dt / 1000;
        dot.tick -= dt / 1000;
        if(dot.tick <= 0){
          dot.tick = 0.5;
          e.hp -= dot.dmg * 0.5;
          e.hitFlash = Math.max(e.hitFlash, 2);
          if(Math.random() < 0.5){
            damageTexts.push({ x:e.x + rand(-6,6), y:e.y - e.radius - 4, vx:rand(-0.3,0.3), vy:-1.2,
              text:Math.max(1, Math.round(dot.dmg * 0.5)), life:0.7, isCrit:false, scale:0.85, rot:0, color:'#a8e05a' });
          }
          if(e.hp <= 0 && !e.dead){
            e.dead = true;
            onEnemyDeath(e, null);
          }
        }
        if(dot.t <= 0) e.dots.splice(di3, 1);
      }
    }
    // 精英自愈 / 吸血
    if(e.regen > 0 && e.hp < e.maxHp && e.hp > 0) e.hp = Math.min(e.maxHp, e.hp + e.regen * dt / 1000);

    // 重新选目标
    e.retarget -= dt / 1000;
    if(e.retarget <= 0 || (e.target && e.target.dead) || (e.targetPlayer === false && e.mode === 'hunt' && !e.target)){
      pickEnemyTarget(e);
      e.retarget = rand(0.35, 0.75);
    }
    if(e.fleeT > 0) e.mode = 'flee';

    // 圈外求生：所有怪都会往安全区里挤（抗毒怪除外，它们不怕毒）
    if(storm && settings.stormEnabled && !e.poisonRes && stormOutside(e.x, e.y) && e.mode !== 'zone'){
      e.mode = 'zone';
      e.zoneT = 3.5;
    }
    if(e.mode === 'zone'){
      e.zoneT = (e.zoneT || 3.5) - dt / 1000;
      if(e.zoneT <= 0) e.mode = 'hunt';
    }
    // BUFF 怪守家：离出生点太远就回去；被圈甩到毒区里就直接转移到圈内
    // （它们太慢，追不上缩圈；而且作为"野区资源"不该被毒圈吃掉）
    if(e.guardian){
      if(storm && settings.stormEnabled && !inZone(e.x, e.y, 0.72)){
        var gh = clampToZone(e.x, e.y, 0.45);
        createParticles(e.x, e.y, 18, e.color, 5);
        e.x = gh.x; e.y = gh.y;
        e.home.x = gh.x; e.home.y = gh.y;
        e.bladeHitCd = 20;
        createParticles(e.x, e.y, 14, e.color, 4);
        if(!e.zoneMsgT || e.zoneMsgT <= 0){
          e.zoneMsgT = 8;
          feedMsg('🐾 ' + e.name + ' 撤进安全区', '#ffb24a');
        }
      } else {
        var hd2 = dist(e.x, e.y, e.home.x, e.home.y);
        if(hd2 > 520) e.mode = 'hold';
      }
    }

    // 弱者逃命判定：精英残血时会脱战求生（打不过就跑）
    if(e.tier >= 1 && e.aiType === 'predator' && e.fleeT <= 0 && e.hp < e.maxHp * 0.32){
      var pd0 = dist(e.x, e.y, player.x, player.y);
      if(pd0 < 520 && player.damage * player.bladeCount > enemyPower(e) * 0.9){
        e.fleeT = 2.6; e.mode = 'flee';
        e.target = null; e.targetPlayer = false;
        if(!e.fleeMsgT || e.fleeMsgT <= 0){
          e.fleeMsgT = 9;
          feedMsg('✧ ' + e.name + ' 脱离战斗', '#9fd8ff');
        }
      }
    }

    // ---- 目标点与速度倍率 ----
    var tx = e.x, ty = e.y, mul = 1, chasing = false;
    if(e.mode === 'hunt'){
      var tgx, tgy;
      if(e.targetPlayer){ tgx = player.x; tgy = player.y; chasing = true; }
      else if(e.target){ tgx = e.target.x; tgy = e.target.y; chasing = true; }
      else { tgx = e.home.x; tgy = e.home.y; }
      tx = tgx; ty = tgy;
      mul = chasing ? 1 : 0.6;
      if(e.rage > 0) mul *= 1.22;
      if(e.aiType === 'predator') mul *= chasing ? 1.3 : 0.8;
    } else if(e.mode === 'flee'){
      var fx = e.x - player.x, fy = e.y - player.y;
      if(e.target){ fx = e.x - e.target.x; fy = e.y - e.target.y; }
      var fd = Math.sqrt(fx*fx + fy*fy) || 1;
      tx = e.x + fx / fd * 300; ty = e.y + fy / fd * 300;
      mul = 1.0;
    } else if(e.mode === 'graze'){
      var gem = nearestGem(e, 340);
      if(gem){ tx = gem.x; ty = gem.y; mul = 0.62; }
      else {
        var wo = Math.sin(e.wobble * 0.6 + e.home.x) * 90, wp = Math.cos(e.wobble * 0.5 + e.home.y) * 90;
        tx = e.home.x + wo; ty = e.home.y + wp; mul = 0.42;
      }
    } else if(e.mode === 'roam'){
      var pd1 = dist(e.x, e.y, player.x, player.y);
      var ra = Math.atan2(player.y - e.y, player.x - e.x);
      var rr = Math.max(180, pd1 - 120);
      tx = player.x - Math.cos(ra) * rr; ty = player.y - Math.sin(ra) * rr;
      mul = 0.7;
    } else if(e.mode === 'zone'){
      tx = storm.cx; ty = storm.cy;
      mul = 1.25;
    } else if(e.mode === 'hold'){
      tx = e.home.x + Math.sin(e.wobble * 0.4) * 60; ty = e.home.y + Math.cos(e.wobble * 0.35) * 60;
      mul = 0.34;
    }

    // 飞刀手：保持距离，边退边扔
    if(e.aiType === 'ranged' && e.mode !== 'zone'){
      var rd = dist(e.x, e.y, player.x, player.y);
      if(rd < 250){ mul = 1.05; }            // 拉远
      else if(rd > 420){ mul = 0.8; }         // 靠近
      else { mul = 0; }                      // 原地投刀
      tx = player.x; ty = player.y;
      if(rd < 250){ tx = e.x - (player.x - e.x); ty = e.y - (player.y - e.y); }
      if(e.throwCd <= 0 && rd < 440 && state === 'playing'){
        throwBlade(e);
        e.throwCd = rand(130, 210) * (1 - Math.min(0.3, threat * 0.1));
      }
    }

    // 冲刺（刺客/精英突进）
    if(e.dashT > 0){ mul = Math.max(mul, 2.6); }
    else if(e.dashCd <= 0 && chasing && (e.aiType === 'hunter' || e.aiType === 'predator')){
      e.dashT = 0.24; e.dashCd = rand(110, 210);
      createParticles(e.x, e.y, 4, e.color, 2.5);
    }

    var dx = tx - e.x, dy = ty - e.y;
    var d = Math.sqrt(dx*dx + dy*dy) || 1;
    if(d < e.radius + (e.targetPlayer ? player.radius : 6)) d = 0.0001, mul = 0;
    var spd = e.speed * mul * dtf;
    // 击退
    e.x += e.kx * dtf;
    e.y += e.ky * dtf;
    e.kx *= 0.82; e.ky *= 0.82;
    if(mul > 0){
      e.x += (dx / d) * spd;
      e.y += (dy / d) * spd;
      e.face = dx >= 0 ? 1 : -1;
    }
    if(e.aiType === 'graze' || e.aiType === 'guard') e.wobble += 0.05 * dtf;
    else e.wobble += 0.09 * dtf;
    if(e.blades > 0) e.bladeAngle += e.bladeRotSpeed * dtf * (e.dashT > 0 ? 2.2 : 1);

    // 吃掉路过的经验（小怪和精英都会抢资源）
    if(xpGems.length){
      for(var gi = xpGems.length - 1; gi >= 0 && gi >= xpGems.length - 40; gi--){
        var g2 = xpGems[gi];
        if(dist(e.x, e.y, g2.x, g2.y) < e.radius + g2.radius + 3){
          e.gems += g2.val;
          if(e.tier >= 1){ eliteFeed(e, 0.35, true); e.hp = Math.min(e.maxHp, e.hp + g2.val * 0.6); }
          else { e.maxHp += g2.val * 0.9; e.hp += g2.val * 0.9; }
          createParticles(g2.x, g2.y, 4, '#7ff0d0', 2);
          xpGems.splice(gi, 1);
        }
      }
    }

    // 抗毒怪：毒雾持续伤害（贴脸就掉血）
    // 精英也会抢地上的稀有道具（和玩家抢空投）
    if(e.tier >= 1 && items.length){
      for(var ii2 = items.length - 1; ii2 >= 0; ii2--){
        var it2 = items[ii2];
        if(!it2.gear) continue;
        if(dist(e.x, e.y, it2.x, it2.y) < e.radius + it2.radius + 4){
          eliteFeed(e, 4, false);
          if(it2.gear.id === 'tengjia') e.tengjia = 1;
          e.bladeDmg *= 1.06;
          createParticles(it2.x, it2.y, 16, it2.gear.color, 5);
          feedMsg('📦 ' + e.name + ' 抢走了【' + it2.gear.name + '】', '#ff8a6a');
          items.splice(ii2, 1);
        }
      }
    }
    if(e.type === 'toxic'){
      var td2 = dist(e.x, e.y, player.x, player.y);
      if(td2 < 74 && player.invuln <= 0){
        var pdam = (2 + wave * 0.4) * (1 - (player.dmgReduce || 0));
        player.hp -= pdam;
        player.invuln = Math.max(1, 22);
        if(Math.random() < 0.5) damageTexts.push({ x:player.x + rand(-8,8), y:player.y - 24, vx:0, vy:-1.1,
          text:'毒', life:0.8, isCrit:false, scale:1, rot:0, color:'#a8e05a' });
        vignettePulse = Math.max(vignettePulse, 0.4);
        updateUI();
        if(player.hp <= 0){ player.hp = 0; gameOver('poison'); }
      }
    }

    // 撞到玩家
    var pdx = player.x - e.x, pdy = player.y - e.y;
    var pdd = Math.sqrt(pdx*pdx + pdy*pdy) || 1;
    if(pdd < e.radius + player.radius && player.invuln <= 0 && e.mode !== 'graze' && e.mode !== 'hold'){
      var dmg = e.damage;
      if(e.tier >= 1){
        var pct = e.tier === 2 ? settings.pctHpDmgBoss : settings.pctHpDmgElite;
        dmg += player.maxHp * pct * (1 - (player.guard || 0));
      }
      dmg *= (1 - (player.dmgReduce || 0));
      player.hp -= dmg;
      player.invuln = Math.max(1, settings.invulnTime);
      // 反伤刺甲 / 罡气（玩家把伤害弹回去）
      if(player.reflect > 0 || (player.shield > 0)){
        if(player.shield > 0){
          player.shield -= dmg * 0.5;
          if(player.shield < 0) player.shield = 0;
        }
        if(player.reflect > 0){
          e.hp -= dmg * player.reflect;
          damageTexts.push({ x:e.x + rand(-6,6), y:e.y - e.radius, vx:rand(-0.3,0.3), vy:-1.4,
            text:Math.round(dmg * player.reflect), life:0.8, isCrit:false, scale:1, rot:0, color:'#c8a2ff' });
          if(e.hp <= 0 && !e.dead){ e.dead = true; onEnemyDeath(e, null); }
        }
      }
      e.x -= pdx / pdd * 22;
      e.y -= pdy / pdd * 22;
      e.kx -= pdx / pdd * 4; e.ky -= pdy / pdd * 4;
      shake.intensity = Math.max(shake.intensity, 9);
      screenFlash = 0.5;
      vignettePulse = 1;
      createParticles(player.x, player.y, 14, '#ff2d55', 4);
      sfxHurt();
      updateUI();
      if(player.hp <= 0){ player.hp = 0; gameOver('mob'); }
    }
  }

  // ---- 分离力（网格查询，避免 O(n²)）----
  for(var a = 0; a < enemies.length; a++){
    var ea = enemies[a];
    if(ea.dead) continue;
    var near = gridQuery(ea.x, ea.y, ea.radius + 34);
    for(var b = 0; b < near.length; b++){
      var eb = near[b];
      if(!eb || eb === ea || eb.tier === undefined) continue;
      if(eb.dead) continue;
      var ddx = eb.x - ea.x, ddy = eb.y - ea.y;
      if(ddx === 0 && ddy === 0) ddy = 0.01;
      var dd = Math.sqrt(ddx*ddx + ddy*ddy) || 0.01;
      var min = (ea.radius + eb.radius) * 0.92;
      if(dd < min){
        var push = (min - dd) / min * 0.5;
        var nx = ddx / dd, ny = ddy / dd;
        var wa = eb.radius / (ea.radius + eb.radius), wb = 1 - wa;
        ea.x -= nx * push * wa; ea.y -= ny * push * wa;
        eb.x += nx * push * wb; eb.y += ny * push * wb;
      }
    }
  }
}

/* 统一的死亡结算（刀伤 / 毒 / 反伤 / 风暴共用） */
function onEnemyDeath(e, killer){
  e.dead = true;
  if(e.guardian){
    grantBuff(e.guardianType);
    addDecal(e.x, e.y, '#5b2a0e', e.radius * 2, 0.6);
    createParticles(e.x, e.y, 40, e.color, 7);
    shockwaves.push({ x:e.x, y:e.y, r:16, spd:12, life:1, color:e.color, w:6 });
    if(killer === player) killCount += 8;
    return;
  }
  var val = (e.gems || 0) + 1 + Math.floor(wave * 0.35);
  if(killer === player){
    killCount++;
    // 玩家击杀：经验按比例吐出
    var xpVal = 1 + Math.floor(wave * 0.5) + Math.round((e.gems || 0) * (e.tier >= 1 ? 0.8 : 1));
    var gemCount = Math.min(4, 1 + Math.floor(xpVal / 4));
    for(var i = 0; i < gemCount; i++){
      spawnXpGem(e.x + rand(-12,12), e.y + rand(-12,12), Math.max(1, Math.floor(xpVal / gemCount)));
    }
  } else {
    spawnXpGem(e.x, e.y, Math.max(1, Math.round(val * 0.5)));
  }
  addDecal(e.x, e.y, e.tier >= 1 ? '#5b2a0e' : PAL.blood, e.radius * (e.tier >= 2 ? 1.8 : 1.1), 0.5);
  rings.push({ x:e.x, y:e.y, r:e.radius, maxR: e.tier >= 1 ? 70 : 40, life:1, color:e.color });
}

// 获取某精英敌人的刀刃段（用于怪物互砍判定）
function getEnemyBladeSegs(e){
  var segs = [];
  if(e.blades <= 0) return segs;
  var inner = Math.max(2, e.bladeOrbit - e.bladeLen);
  for(var i = 0; i < e.blades; i++){
    var a = e.bladeAngle + (Math.PI * 2 / e.blades) * i;
    segs.push({
      x1: e.x + Math.cos(a) * inner,
      y1: e.y + Math.sin(a) * inner,
      x2: e.x + Math.cos(a) * e.bladeOrbit,
      y2: e.y + Math.sin(a) * e.bladeOrbit,
      angle: a
    });
  }
  return segs;
}

/* ============================================================
   播报 / 地面残留 / 飞刀 / 风暴圈
   ============================================================ */
function feedMsg(text, color){
  var box = document.getElementById('feed');
  if(!box) return;
  var d = document.createElement('div');
  d.className = 'fd';
  d.textContent = text;
  if(color) d.style.borderLeftColor = color;
  box.appendChild(d);
  while(box.children.length > 4) box.removeChild(box.firstChild);
  setTimeout(function(){
    d.style.opacity = '0';
    setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 520);
  }, 3200);
}

function addDecal(x, y, color, r, alpha){
  decals.push({ x:x, y:y, r:r, color:color, a:alpha == null ? 0.5 : alpha, life:1 });
  if(decals.length > 84) decals.shift();
}
function updateDecals(dt){
  for(var i = 0; i < decals.length; i++){
    decals[i].life -= 0.000035 * dt;
    decals[i].a *= (1 - 0.00006 * dt);
  }
}

/* 飞刀手投出旋转飞刃 */
function throwBlade(e){
  if(projectiles.length > 80) return;
  var a = Math.atan2(player.y - e.y, player.x - e.x) + rand(-0.08, 0.08);
  var sp = 5.2 + Math.min(3, wave * 0.12) + threat * 0.5;
  projectiles.push({
    x: e.x + Math.cos(a) * e.radius, y: e.y + Math.sin(a) * e.radius,
    vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
    r: 8, spin: rand(0, 6), life: 3.2, owner: e,
    dmg: e.damage * 0.75, color: '#5ce0d0'
  });
  playTone(680 + Math.random() * 160, 0.05, 'triangle', 0.045, 380);
  createParticles(e.x, e.y, 3, '#5ce0d0', 2.2);
}

function updateProjectiles(dt){
  var dtf = dt / 16.67;
  for(var i = projectiles.length - 1; i >= 0; i--){
    var p = projectiles[i];
    p.x += p.vx * dtf; p.y += p.vy * dtf;
    p.spin += 0.4 * dtf;
    p.life -= dtf / 60;
    var hit = false;

    // 己方弩箭：只打怪，不会被自己的刀挡下
    if(p.friendly){
      var q = gridQuery(p.x, p.y, p.r + 40);
      for(var qi = 0; qi < q.length; qi++){
        var qe = q[qi];
        if(!qe || qe.dead || qe.tier === undefined || qe.opened !== undefined) continue;
        if(dist(p.x, p.y, qe.x, qe.y) < qe.radius + p.r){
          damageEnemy(qe, p.dmg, false);
          hitSparks.push({ x:p.x, y:p.y, vx:rand(-3,3), vy:rand(-3,3), life:1, decay:0.11, size:2.4, color:'#ffd27a' });
          hit = true;
          break;
        }
      }
      if(hit || p.life <= 0) projectiles.splice(i, 1);
      continue;
    }

    // 被玩家的刀刃劈掉（拼刀）
    for(var j = 0; j < blades.length; j++){
      if(segCircle(blades[j], p.x, p.y, p.r)){ hit = true; break; }
    }
    if(hit){
      for(var k = 0; k < 8; k++){
        hitSparks.push({ x:p.x, y:p.y, vx:rand(-4,4), vy:rand(-4,4), life:1, decay:0.09, size:rand(1.5,3), color:'#bff8ff' });
      }
      sfxHit();
      shockwaves.push({ x:p.x, y:p.y, r:3, spd:7, life:0.7, color:'#7fe9ff', w:2 });
    }
    // 被别的怪挡下
    if(!hit){
      for(var m = 0; m < enemies.length; m++){
        var e2 = enemies[m];
        if(e2.dead || e2 === p.owner) continue;
        if(dist(p.x, p.y, e2.x, e2.y) < e2.radius + p.r){ hit = true; break; }
      }
    }
    // 命中玩家
    if(!hit && player.invuln <= 0 && dist(p.x, p.y, player.x, player.y) < player.radius + p.r){
      var dmg = p.dmg * (1 - (player.dmgReduce || 0));
      player.hp -= dmg;
      player.invuln = Math.max(1, settings.invulnTime * 0.75);
      shake.intensity = Math.max(shake.intensity, 7);
      screenFlash = 0.3; vignettePulse = 1;
      damageTexts.push({ x:player.x, y:player.y - 18, vx:rand(-0.5,0.5), vy:-1.8, text:Math.floor(dmg), life:1, isCrit:false, scale:1.1, rot:0, color:'#7fe9ff' });
      createParticles(player.x, player.y, 10, '#7fe9ff', 3.5);
      sfxHurt();
      updateUI();
      hit = true;
      if(player.hp <= 0){ player.hp = 0; gameOver('blade'); }
    }
    if(hit || p.life <= 0) projectiles.splice(i, 1);
  }
}

/* 风暴圈：圈外持续掉血，怪也一样（圈外的怪会往圈里挤） */
function stormDps(){
  // 毒圈伤害跟“缩圈次数”绑定，同时保留旧的阶段成长。
  var zone = Math.max(0, zonePhase || 0);
  var wavePart = Math.max(0, wave - 1) * settings.stormDpsPerWave;
  var zonePart = zone * (settings.stormDpsPerZone || 0);
  return settings.stormDpsBase + wavePart + zonePart;
}

function stormPctDps(){
  var zone = Math.max(0, zonePhase || 0);
  return settings.stormDpsPctHp + zone * (settings.stormDpsPctPerZone || 0);
}
function stormOutside(x, y){
  if(!storm || !settings.stormEnabled) return false;
  var dx = x - storm.cx, dy = y - storm.cy;
  return dx*dx + dy*dy > storm.r * storm.r;
}
function updateStorm(dt){
  if(!storm) return;
  if(!settings.stormEnabled) return;   // 关闭时保留圈参数，重新打开即可恢复
  if(storm.shrink > 0){
    storm.r = lerp(storm.r, storm.targetR, 0.02 * (dt / 16.67));
    if(Math.abs(storm.r - storm.targetR) < 5){ storm.r = storm.targetR; storm.shrink = 0; }
  }
  var dps = stormDps();
  // 玩家
  if(stormOutside(player.x, player.y)){
    player.stormed = true;
    var pd = (dps + player.maxHp * settings.stormDpsPctHp) * (1 - (player.stormRes || 0)) * dt / 1000;
    player.hp -= pd;
    player.stormAcc = (player.stormAcc || 0) + pd;
    if(player.stormAcc > Math.max(3, player.maxHp * 0.025)){
      player.stormAcc = 0;
      damageTexts.push({ x:player.x + rand(-8,8), y:player.y - 24, vx:0, vy:-1.1, text:'毒', life:0.9, isCrit:false, scale:1.0, rot:0, color:'#c8a2ff' });
      vignettePulse = Math.max(vignettePulse, 0.55);
    }
    if(player.hp <= 0){ player.hp = 0; gameOver('storm'); }
    updateUI();
  } else player.stormed = false;
  // 怪
  for(var i = 0; i < enemies.length; i++){
    var e = enemies[i];
    if(e.dead) continue;
    if(stormOutside(e.x, e.y)){
      e.burnT = 1;
      // 圈外对所有怪物生效，包括普通经验怪、特种怪、精英和 Boss。
      // 百分比伤害随缩圈次数提高，避免高血量精英在圈外无限发育。
      var stormDmg = dps + e.maxHp * stormPctDps();
      if(e.stormImmune) stormDmg = 0;
      e.hp -= stormDmg * dt / 1000;
      e.stormAcc = (e.stormAcc || 0) + stormDmg * dt / 1000;
      if(e.stormAcc >= Math.max(3, e.maxHp * 0.02)){
        e.stormAcc = 0;
        damageTexts.push({ x:e.x + rand(-6,6), y:e.y - e.radius - 3, vx:0, vy:-1.0, text:'毒', life:0.7, isCrit:false, scale:0.8, rot:0, color:'#c8a2ff' });
      }
      if(e.hp <= 0) stormKill(e);
    }
  }
}
function stormKill(e){
  if(!e || e.dead) return;
  // 风暴击杀也走统一死亡结算，避免统计与资源状态不同步。
  onEnemyDeath(e, null);
  if(e.tier >= 1) feedMsg('☠ 风暴吞噬了 ' + e.name, '#c8a2ff');
  createParticles(e.x, e.y, 10, '#b98aff', 3.2);
  addDecal(e.x, e.y, '#3a1c5c', e.radius * 1.2, 0.35);
  sfxKill();
}

/* ============================================================
   怪物互砍 + 吞噬进化系统
   有刀的精英/Boss 会攻击附近其他怪物，击杀后吞噬其刀数/属性
   ============================================================ */
function updateEnemyCombat(dt){
  var dtf = dt / 16.67;
  // 先更新所有目标的刃击冷却
  for(var ci = 0; ci < enemies.length; ci++){
    if(enemies[ci].bladeHitCd > 0) enemies[ci].bladeHitCd -= dtf;
  }
  for(var i = 0; i < enemies.length; i++){
    var attacker = enemies[i];
    if(attacker.dead || attacker.blades <= 0) continue;

    var segs = getEnemyBladeSegs(attacker);
    var cand = gridQuery(attacker.x, attacker.y, attacker.bladeOrbit + 46);
    var candList = cand.slice();
    for(var j = 0; j < candList.length; j++){
      var target = candList[j];
      if(target === attacker) continue;
      if(target.dead) continue;
      // 空投箱：精英/怪物也会砸箱子抢空投
      if(target.maxHp !== undefined && target.opened !== undefined){
        if(!target.opened && segCircle(segs[0], target.x, target.y, 26)){
          if(attacker.bladeHitCd <= 0){
            attacker.bladeHitCd = 14;
            damageAirDrop(target, attacker.bladeDmg * 0.8 * (settings.airDropDmgMult || 1), attacker);
          }
        }
        continue;
      }
      // 目标自身的刃击冷却（防止被多把刀连续命中）
      if(target.bladeHitCd > 0) continue;

      // 距离剪枝
      var ddx = target.x - attacker.x, ddy = target.y - attacker.y;
      var dist = Math.sqrt(ddx*ddx + ddy*ddy);
      if(dist > attacker.bladeOrbit + target.radius + 30) continue;

      for(var si = 0; si < segs.length; si++){
        if(target.dead) break;
        var seg = segs[si];
        var hitR = target.radius + 4;
        if(segCircle(seg, target.x, target.y, hitR)){
          target.bladeHitCd = 16; // 命中冷却
          var edmg = attacker.bladeDmg * (0.85 + Math.random() * 0.3);

          // 目标如果也有刀，先拼刀
          if(target.blades > 0){
            target.blades--;
            // 拼刀特效
            shockwaves.push({ x:target.x, y:target.y, r:target.radius*0.5, spd:5, life:0.6, color:'#ff9f43', w:2.5 });
            createParticles(target.x, target.y, 6, '#ffd24a', 3);
            if(target.blades === 0){
              hitstop = Math.max(hitstop, 2);
            }
            break;
          }

          target.hp -= edmg;
          target.hitFlash = 5;
          // 击退
          var ka = Math.atan2(target.y - attacker.y, target.x - attacker.x);
          target.kx += Math.cos(ka) * 3;
          target.ky += Math.sin(ka) * 3;
          damageTexts.push({
            x: target.x + rand(-5,5), y: target.y - target.radius - 4,
            vx: rand(-0.4,0.4), text: Math.floor(edmg),
            life: 0.7, isCrit:false, vy:-1.4, scale:0.85, rot:rand(-0.08,0.08)
          });

          if(target.hp <= 0){
            ecoKills++;
            var grow = settings.eliteGrowth;
            // === 吞噬进化（和玩家同一套成长：加刀/变大/加范围/吸血/加伤/加血） ===
            // 吸收目标的刀数（折半）
            if(target.maxBlades > 0 && grow > 0){
              var absorb = Math.max(1, Math.floor(target.maxBlades * 0.5 * grow));
              attacker.blades += absorb;
              attacker.maxBlades += absorb;
            }
            attacker.bladeDmg += target.bladeDmg * 0.3 * grow;
            var hpGain = Math.floor(target.maxHp * 0.15 * grow);
            attacker.maxHp += hpGain;
            attacker.hp = Math.min(attacker.maxHp, attacker.hp + hpGain);
            attacker.radius = Math.min(attacker.radius * (1 + 0.03 * grow), attacker.radius + 1.6 * grow);
            attacker.gems += target.gems || 0;
            attacker.lifesteal = Math.min(attacker.lifesteal + 0.25, 14);
            eliteFeed(attacker, 1, false);
            if(attacker.kills % 3 === 1) feedMsg('☠ ' + attacker.name + ' 吞噬了 ' + target.name, attacker.tier === 2 ? '#b45cff' : '#ff8a4a');
            // 进化特效
            shockwaves.push({ x:attacker.x, y:attacker.y, r:attacker.radius*0.6, spd:9, life:1, color:'#ff6b4a', w:4 });
            createParticles(attacker.x, attacker.y, 16, attacker.color, 5);
            createParticles(attacker.x, attacker.y, 10, '#ffd24a', 4);
            onEnemyDeath(target, attacker);
            sfxKill();
          }
          break; // 一把刀每帧只命中一个目标
        }
      }
    }
  }
}

/* ============================================================
   经验宝石
   ============================================================ */
function spawnXpGem(x, y, val){
  // 地面经验也是有限资源，避免长时间无人拾取后无限堆积。
  if(xpGems.length >= 700) return;
  xpGems.push({
    x:x, y:y, val:val,
    radius:5,
    vx:rand(-2, 2), vy:rand(-2, 2),
    life:0, maxLife:45000, phase:rand(0, Math.PI*2)
  });
}

function updateXpGems(dt){
  var dtf = dt / 16.67;
  for(var i = xpGems.length - 1; i >= 0; i--){
    var g = xpGems[i];
    var dx = player.x - g.x, dy = player.y - g.y;
    var d = Math.sqrt(dx*dx + dy*dy) || 1;
    if(d < player.magnet && player.magnet > 0){
      var pull = settings.gemAttract * dtf * (1 + (player.magnet - d) / player.magnet * 2.5);
      g.x += (dx / d) * pull;
      g.y += (dy / d) * pull;
    }
    g.x += g.vx * dtf * 0.5;
    g.y += g.vy * dtf * 0.5;
    g.vx *= 0.95; g.vy *= 0.95;
    g.life += dt;
    g.phase += 0.1 * dtf;
    if(g.life >= (g.maxLife || 45000)){
      xpGems.splice(i, 1);
      continue;
    }
    if(d < player.radius + g.radius + 4){
      player.xp += g.val * (1 + player.xpBonus);
      createParticles(g.x, g.y, 4, '#00d2ff', 2);
      xpGems.splice(i, 1);
      checkLevelUp();
    }
  }
}

function checkLevelUp(){
  if(player.xp >= player.xpMax){
    player.xp -= player.xpMax;
    player.level++;
    player.xpMax = Math.max(1, Math.floor(settings.xpBase * Math.pow(settings.xpGrowth, player.level - 1)));
    sfxLevel();
    createParticles(player.x, player.y, 30, '#00d2ff', 5);
    rings.push({ x:player.x, y:player.y, r:10, maxR:120, life:1, color:'#00d2ff' });
    shockwaves.push({ x:player.x, y:player.y, r:12, spd:10, life:1, color:'#00d2ff', w:4 });
    if(settings.levelUpMode >= 0.5){
      // 三选一强化面板（可在设置里开启）
      showUpgradePanel();
    } else {
      // 默认：直接掉落道具 + 一点随机属性，不打断操作
      var nDrop = Math.max(1, Math.round(settings.levelDropCount));
      for(var di = 0; di < nDrop; di++){
        var da = rand(0, Math.PI * 2), dr = rand(26, 62);
        spawnItem(player.x + Math.cos(da) * dr, player.y + Math.sin(da) * dr);
      }
      var rnd2 = Math.random(), bonusTxt = '';
      if(rnd2 < 0.22){ player.bonus.damage += 6; bonusTxt = '刀刃伤害 +6'; }
      else if(rnd2 < 0.44){ player.bonus.maxHp += 12; bonusTxt = '生命上限 +12'; }
      else if(rnd2 < 0.62){ player.bonus.bladeRotSpeedMul *= 1.05; bonusTxt = '旋转 +5%'; }
      else if(rnd2 < 0.78){ player.bonus.bladeLength += 6; bonusTxt = '刀刃长度 +6'; }
      else if(rnd2 < 0.9){ player.bonus.critChance += 0.03; bonusTxt = '暴击率 +3%'; }
      else { player.bonus.magnet += 30; bonusTxt = '拾取范围 +30'; }
      recalcPlayer();
      showBanner('★ Lv.' + player.level + ' · 掉落 ' + nDrop + ' 件道具');
      feedMsg('✦ 升级奖励：' + bonusTxt, '#ffd27a');
      sfxKill();
    }
    updateUI();
  }
  updateUI();
}

function showUpgradePanel(){

  var panel = document.getElementById('upgradePanel');
  var container = document.getElementById('upgradeCards');
  container.innerHTML = '';
  document.getElementById('upgradeSub').textContent = 'Lv.' + player.level + ' · 选择一项强化（同类强化收益递减）';

    var idx = Math.floor(Math.random() * pool.length);
    picks.push(pool[idx]);
    pool.splice(idx, 1);
  }

  picks.forEach(function(up, i){
    var card = document.createElement('div');

    card.style.animationDelay = (i * 0.07) + 's';
    var dsc = typeof up.desc === 'function' ? up.desc() : up.desc;
    card.innerHTML =
      '<div class="upIcon">' + up.icon + '</div>' +
      '<div class="upInfo">' +
        '<div class="upName">' + up.name + '</div>' +
        '<div class="upDesc">' + dsc + '</div>' +
        '<span class="upTag" style="background:' + up.tc + '22;color:' + up.tc + '">' + up.tag + '</span>' +
      '</div>';
    card.addEventListener('click', function(e){ e.preventDefault(); pickUpgrade(up); });
    container.appendChild(card);
  });

  panel.classList.add('show');
  updateUI();
}

function pickUpgrade(up){
  up.apply();
  recalcPlayer();
  document.getElementById('upgradePanel').classList.remove('show');
  state = 'playing';
  if(player.xp >= player.xpMax) checkLevelUp();
  updateUI();
}

/* ============================================================
   伤害与特效
   ============================================================ */
function damageEnemy(e, amount, isCrit, kbAngle){
  if(e.tier >= 1 && player.eliteDmg) amount *= player.eliteDmg;
  // ===== 属性相克 / 防具 =====
  var el = playerElement();
  if(el === 'fire'){
    amount += (6 + (player.gearFireDmg || 0)) * (isCrit ? player.critMult : 1);
    if(isTengjia(e)) amount *= 2;            // 火克藤甲
  } else if(el === 'phys' && isTengjia(e)){
    amount *= 0.12;                          // 无属性打不动藤甲
    if(Math.random() < 0.25){
      damageTexts.push({ x:e.x + rand(-6,6), y:e.y - e.radius - 8, vx:0, vy:-1.2,
        text:'免疫', life:0.7, isCrit:false, scale:0.9, rot:0, color:'#8fd85a' });
    }
  }
  if(!player.pierceArmor && e.armor > 0){
    amount = Math.max(amount * 0.35, amount - e.armor * 2.2);
  }
  e.hp -= amount;
  e.hitFlash = isCrit ? 9 : 6;
  // 毒：持续伤害
  if(el === 'poison'){
    e.dots.push({ dmg: Math.max(2, amount * 0.28), t: 4, tick: 0.4 });
  }
  // 雷：伤害传递
  if(el === 'thunder'){
    var arcN = 0;
    var cand2 = gridQuery(e.x, e.y, 190);
    for(var ai2 = 0; ai2 < cand2.length && arcN < 3; ai2++){
      var o4 = cand2[ai2];
      if(!o4 || o4 === e || o4.dead || o4.tier === undefined || o4.opened !== undefined) continue;
      o4.hp -= amount * 0.45;
      o4.hitFlash = 4;
      arcN++;
      lightning.push({ x1:e.x, y1:e.y, x2:o4.x, y2:o4.y, life:1, color:'#9fe8ff' });
      if(o4.hp <= 0 && !o4.dead) onEnemyDeath(o4, player);
    }
    if(arcN) sfxHit();
  }
  // 打草惊蛇：被砍的小怪会喊同伙一起上（怪群不会站在那让你白割）
  if(e.tier === 0){
    e.rage = 4.5;
    if(e.mode !== 'flee'){ e.mode = 'hunt'; e.targetPlayer = true; e.target = null; e.retarget = 0.8; }
    for(var ri = 0; ri < enemies.length; ri++){
      var o3 = enemies[ri];
      if(o3 === e || o3.dead || o3.tier > 0) continue;
      if(dist(e.x, e.y, o3.x, o3.y) < 240){ o3.rage = 4.0; o3.retarget = 0.2; }
    }
  }

  // 击退（沿刀刃切线方向外推）
  var kb = isCrit ? 7.5 : 4.2;
  var ka = kbAngle != null ? kbAngle : Math.atan2(e.y - player.y, e.x - player.x);
  e.kx += Math.cos(ka) * kb;
  e.ky += Math.sin(ka) * kb;

  damageTexts.push({
    x: e.x + rand(-6, 6),
    y: e.y - e.radius - 6,
    vx: rand(-0.6, 0.6),
    text: Math.floor(amount),
    life: 1,
    isCrit: isCrit,
    vy: isCrit ? -2.4 : -1.7,
    scale: isCrit ? 1.8 : 1.15,
    rot: isCrit ? rand(-0.18, 0.18) : rand(-0.06, 0.06)
  });

  // 命中火花
  var sparkCount = isCrit ? 12 : 6;
  for(var si = 0; si < sparkCount; si++){
    var sa = ka + rand(-0.9, 0.9);
    var ss = rand(2, isCrit ? 8 : 5);
    hitSparks.push({
      x: e.x, y: e.y,
      vx: Math.cos(sa) * ss,
      vy: Math.sin(sa) * ss,
      life: 1,
      decay: rand(0.06, 0.12),
      size: rand(1.5, 3.5),
      color: isCrit ? (Math.random() < 0.5 ? '#ffe066' : '#ff8a3d') : (Math.random() < 0.5 ? '#ffffff' : '#bfe9ff')
    });
  }

  if(isCrit){
    sfxCrit();
    hitstop = Math.max(hitstop, 5);
    shake.intensity = Math.max(shake.intensity, 7);
    screenFlash = Math.max(screenFlash, 0.18);
    shockwaves.push({ x:e.x, y:e.y, r:e.radius*0.5, spd:8, life:1, color:'#ffd24a', w:4 });
  } else {
    hitstop = Math.max(hitstop, 2);
    shockwaves.push({ x:e.x, y:e.y, r:e.radius*0.4, spd:5, life:0.7, color:'#ffffff', w:2 });
  }

  if(e.hp <= 0){
    e.dead = true;
    killCount++;
    if(e.guardian){
      grantBuff(e.guardianType);
      addDecal(e.x, e.y, '#5b2a0e', e.radius * 2.2, 0.6);
      createParticles(e.x, e.y, 46, e.color, 8);
      shockwaves.push({ x:e.x, y:e.y, r:18, spd:13, life:1, color:e.color, w:7 });
      shake.intensity = Math.max(shake.intensity, 14);
      updateUI();
      return;
    }
    combo = comboTimer > 0 ? combo + 1 : 1;
    comboTimer = 2300;
    if(combo === 10 || combo === 25 || combo === 50) showBanner(combo + ' 连斩！');
    var xpVal = 1 + Math.floor(wave * 0.5) + (e.type === 'elite' ? 10 : e.type === 'tank' ? 4 : e.type === 'fast' ? 1 : e.type === 'thrower' ? 2 : 0)
              + Math.round((e.gems || 0) * (e.tier >= 1 ? 0.8 : 1));
    var gemCount = Math.min(4, 1 + Math.floor(xpVal / 4));
    for(var i = 0; i < gemCount; i++){
      spawnXpGem(e.x + rand(-12, 12), e.y + rand(-12, 12), Math.max(1, Math.floor(xpVal / gemCount)));
    }
    addDecal(e.x, e.y, e.tier >= 1 ? '#5b2a0e' : PAL.blood, e.radius * (e.tier >= 2 ? 1.8 : 1.1), 0.5);
    var deathP = e.type === 'elite' ? 24 : 12;
    createParticles(e.x, e.y, deathP, e.color, e.type === 'elite' ? 6 : 3.5);
    createParticles(e.x, e.y, Math.floor(deathP*0.6), '#ffffff', e.type === 'elite' ? 4 : 2.5);
    rings.push({ x:e.x, y:e.y, r:e.radius, maxR:e.type === 'elite' ? 70 : 40, life:1, color:e.color });
    // 击杀冲击波（更大）
    shockwaves.push({ x:e.x, y:e.y, r:e.radius*0.6, spd:10, life:1, color:e.color, w:3.5 });
    if(e.type === 'elite' || e.type === 'boss'){
      shockwaves.push({ x:e.x, y:e.y, r:e.radius*0.6, spd:14, life:1, color:'#ffd24a', w:5 });
      // 精英/Boss 掉落：大幅降低加刀概率，改用随机池
      var totalDrops = 0;
      // 加刀：精英 25% 概率掉1把，Boss 40% 概率掉1-2把（不再按刀数成比例掉）
      var bladeDropChance = e.type === 'boss' ? 0.4 : 0.25;
      if(Math.random() < bladeDropChance){
        var bladeCount = e.type === 'boss' && Math.random() < 0.4 ? 2 : 1;
        for(var di = 0; di < bladeCount; di++){
          spawnItem(e.x + rand(-18, 18), e.y + rand(-18, 18), 'blade');
          totalDrops++;
        }
      }
      // 随机加成道具（精英1件，Boss 2件）
      var bonusDrops = e.type === 'boss' ? 2 : 1;
      var bonusPool = ['damage','length','spin','crit','lifesteal','magnet','maxhp','thick','orbit','moveSpd'];
      for(var di2 = 0; di2 < bonusDrops; di2++){
        var id = bonusPool[Math.floor(Math.random()*bonusPool.length)];
        spawnItem(e.x + rand(-20, 20), e.y + rand(-20, 20), id);
        totalDrops++;
      }
      showBanner((e.type === 'boss' ? '🏆 Boss 击破！' : '⚔ 精英击杀！') + ' 掉落 ' + totalDrops + ' 件道具');
      feedMsg('🗡 你击杀了 ' + e.name + ' · 掠夺 ' + e.kills + ' 次吞噬', e.tier === 2 ? '#ffb24a' : '#ffe28e');
      if(e.final){ finalBossDead = true; checkVictory(); }
    }
    if(player.lifesteal > 0){
      player.hp = Math.min(player.hp + player.lifesteal, player.maxHp);
    }
    shake.intensity = Math.max(shake.intensity, e.type === 'elite' ? 10 : 3.5);
    if(e.type === 'elite') screenFlash = 0.2;
    sfxKill();
  }
  updateUI();
}

function createParticles(x, y, count, color, speed){
  for(var i = 0; i < count; i++){
    var a = rand(0, Math.PI * 2);
    var s = rand(1, speed || 3);
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life: 1,
      decay: rand(0.02, 0.05),
      color: color,
      size: rand(2, 5.5)
    });
  }
}

function showBanner(message){
  var el = document.getElementById('banner');
  el.textContent = message;
  el.classList.add('show');
  bannerTimer = 1500;
}
